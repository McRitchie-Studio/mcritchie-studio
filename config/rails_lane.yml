# THE RAILS LANE'S CONTRACT — what the green `rails` checks actually cover.
#
# ONE file, read by BOTH halves of the guard, exactly as config/e2e_lane.yml is:
#
#   · bin/ci-shard                        THE PLANNER. Cuts the lane into `shards`
#                                         buckets and runs one of them.
#   · bin/rails-executed-set-check        THE RUNTIME GATE. Re-derives the expected set
#                                         from the COMMITTED TREE (never from the
#                                         planner) and asserts the shards' own receipts
#                                         union to exactly that.
#
# WHY A RECEIPT AND NOT ANOTHER GUARD CLAUSE.
# test/lib/ci_workflow_triggers_test.rb protects the suite command by ENUMERATING the
# ways it can be narrowed — TEST, TESTOPTS, DEFAULT_TEST, DEFAULT_TEST_EXCLUDE, a job
# `if:`, a heredoc GITHUB_ENV write, an inline variable prefix. That file's own header
# says the right instinct on reading its list is not "the class is closed" but "here is
# where I would look next", and it NAMES a live hole (a heredoc write from an earlier
# step). It is a blacklist, and a blacklist only ever refuses the spellings its author
# imagined.
#
# Sharding makes that worse before it makes it better: the monolith at least ran one
# obvious command, whereas four buckets can each go quietly empty. So the lane stopped
# arguing about the COMMAND and started reading the EXECUTED SET. Every way a file can
# leave the lane — a flag invented next year, a bin-packing bug that assigns it to no
# bucket, a shard whose runner died after reporting success, a file nobody added to git
# — arrives at the same line of arithmetic:
#
#     union(shard receipts) == every committed file the globs below match
#
# and every one of those files must have contributed AT LEAST ONE RUN. A file present
# in the plan and absent from the receipt is the failure this gate exists to catch.
---
# The shard matrix in .github/workflows/ci.yml. `strategy.job-total` supplies the
# denominator there, so this is the ONE place the number lives.
#
# WHY FOUR, AND WHY SIX WAS TRIED AND MEASURED AND UNDONE. This number was raised to 6
# in this very task and put back, and the reason is worth more than the number.
#
# The reasoning for raising it was sound on paper: sharding took the lane to 3.5min
# (run 32338350375: 150s of work behind 56s of setup), the remaining lever looked like
# more shards, and merging `scan_ruby`/`scan_js`/`lint` into `static` freed exactly the
# two concurrency slots that shards 5 and 6 would cost. Job count unchanged, projected
# ~2.7min. The bin-packer agreed: 473 files, 253.6s per bucket, 0.0s spread.
#
# MEASURED AT SIX (run 32340039307): 3.6min. Against 3.7min at four. Nothing.
#
# WHY, and this is the part that generalises: the shard wall-times were 145s, 162s, 163s,
# 166s, 189s and 200s — a 55s spread the packer had predicted as ZERO. Look at what LPT
# does with a suite this skewed and it is obvious in hindsight. It puts each of the six
# heaviest files in its own bucket, so each shard's floor becomes ITS HEAVIEST FILE.
# Shard 1 owns test/lib/release_cli_test.rb (204s local, the heaviest in the repo) and
# came last at 200s. YOU CANNOT SHARD BELOW YOUR HEAVIEST FILE, and past the point where
# the biggest file sets the floor, another shard buys nothing while costing a slot.
#
# So four it is, and the next lever is NOT more matrix entries. It is either the 56s of
# setup that does not shard (container init 20s, apt 11s, gem propagation 11s, ruby 7s),
# or the handful of end-to-end CLI files that set the floor — and /tasks/groom-slowest-
# test-files carries the measurement showing their cost IS the end-to-end round-trips,
# which is what makes them worth having. Raise this again only with a measurement that
# the heaviest FILE no longer sets the floor.
shards: 4

# Every test file this lane owns.
include:
  - "test/**/*_test.rb"

# Somebody else's job. `test/system` is Capybara + a real Chrome, which the sharded
# lane deliberately does not install — it is 13 tests and ~13s, and making four runners
# each pay the Chrome install and the chromedriver-eviction dance to carry it is the
# opposite of the trade this lane exists to make. It runs in the `system` job, and
# bin/rails-executed-set-check does NOT expect it here.
exclude:
  - "test/system/**/*_test.rb"

# The number of skipped tests the lane may report before the gate calls it red.
#
# MEASURED, not chosen: 11, on runs 32329490149 and 32326010830 — the same 11 both
# times. They were invisible before this line; a suite quietly growing skips is a suite
# quietly shrinking, and the whole point of a receipt is that the shrinkage has to
# happen in a reviewable diff line instead.
#
# HONEST ABOUT ITS STRENGTH: this is a PIN, not a ratchet. config/e2e_lane.yml's
# `quarantined` is compared against its value on `origin/release` precisely because a
# number a branch can edit restrains nothing. This one can be raised in the same commit
# that adds the skip. It is still worth having — it turns an invisible drift into a
# visible edit — but do not read it as the equal of the e2e ratchet. Hardening it the
# same way is /tasks/ratchet-the-rails-skip-ceiling.
max_skips: 11
