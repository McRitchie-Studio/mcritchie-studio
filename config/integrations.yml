# What a McRitchie Studio plan connects to, and what we run for a client on top
# of it. This is the ONE place /integrations reads from (Integration,
# app/models/integration.rb). Draft of 2026-10-13 (Mr. McRitchie, task
# integrations-and-add-ons-page): built to look at, not final copy.
#
# The core product is the agent-powered backend the tiers on /packages sell
# (config/workspace_packages.yml). This page is what plugs into it, in three
# sections (Mr. McRitchie, 2026-10-13):
#
#   integrations  free connections to accounts the CLIENT owns. We do no ongoing
#                 work and the client pays the vendor directly.
#   add_ons       the standard, repeatable services we set up and run, priced
#                 (or quoted) on top of a plan.
#   custom        rarer needs scoped one client at a time: no price line, one
#                 "Talk to us" button.
#
# Entry keys:
#   key       unique across the file
#   name      customer-facing label
#   icon      a software key (config/workspace_icons.yml) when the entry is about
#             ONE brand's product: the entry leads with that brand's logo.
#             Otherwise an emoji, the neutral lead of an entry no brand owns.
#   blurb     one customer-facing sentence: what they get, not how
#   status    live        delivered today
#             soon        not delivered today: renders "Coming soon". Keep this
#                         honest, the same rule as a `planned` row on /packages.
#             on_request  delivered per contract after a call, not self-serve
#   tier      the first package key (workspace_packages.yml) the entry is
#             available from; it renders "From <tier>", or "Every plan" for the
#             first tier. Blank: no tier gate.
#   tier_note optional muted line beside the tier ("Drafting agent from Team")
#   price     integrations: omitted (they are free). add_ons: a price string, or
#             omitted for "Quote". custom: never shown.
#   price_note optional muted line under the price
#   guide     optional: a guide page (/integrations/<guide>) the button opens
#             instead of the contact form; the guide's own button then goes to
#             the form. One of Integration::GUIDES.
#
#   connects  optional: the ways this entry connects (keys of connection_methods
#             below), in the order the card lists them
#   abilities optional: what the entry can do once connected, each
#               key    unique within the entry
#               name   customer-facing, one short phrase
#               via    the connection methods that unlock it; every one must be
#                      in the entry's `connects`, or the load fails
#               status live (default) or soon: an ability not delivered yet
#                      says Coming soon, the same honesty rule as an entry
#
# The button is not configured: it follows from the group and the status, so a
# Coming soon entry can never offer to connect. Every button opens the /contact
# form prefilled, carrying {page, item, intent} into the submission's `source`.
#   integrations, live or on_request  "Connect"       intent connect
#   integrations, soon                "Get notified"  intent notify
#   add_ons                           "Talk to us"    intent add_on
#   custom                            "Talk to us"    intent custom
# The ways an account can be connected (Mr. McRitchie, 2026-10-13): one
# integration can offer several, and they differ in who they cover, the setup
# they take and the upkeep they leave. A person's sign-in is one click but may
# ask again; an admin's grant takes two minutes and then needs nothing.
connection_methods:
  sign_in:
    label: Sign in
    covers: One person
    setup: One click
    upkeep: May ask you to sign in again
  admin_grant:
    label: Admin approval
    covers: Your whole company
    setup: About 2 minutes in your admin console
    upkeep: No upkeep
  app_install:
    label: Install our app
    covers: Your workspace
    setup: One install
    upkeep: No upkeep
  api_key:
    label: API key
    covers: What the key allows
    setup: Paste it once
    upkeep: Replace it when you rotate it
  managed:
    label: We run it
    covers: Everything
    setup: Nothing to do
    upkeep: We handle it

groups:
  - key: google_sign_in
    title: Connect your Google
    kicker: Sign in
    summary: One click each. Sign in with Google and choose what your agents may read; nothing they can change, and you can disconnect any time.
    entries:
      # One person's own Google sign-in, one read each (GoogleConnection::ABILITIES).
      # Any signed-in user sees each card's Connect or Disconnect for their own
      # account; an admin's are the household's, on /admin/google too
      # (IntegrationsController::GOOGLE_CARDS).
      - key: google_calendar
        name: Google Calendar
        icon: "📅"
        blurb: Sign in with Google and your agents read your calendar to prepare you for meetings. Read only, so they cannot add, change or delete an event.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_calendar, name: Read your calendar to prepare for meetings, via: [sign_in] }
      - key: gmail
        name: Gmail
        icon: "✉️"
        blurb: Sign in with Google and your agents read your inbox to see what needs an answer. Read only, so they cannot send, change or delete mail.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_email, name: Read your inbox to see what needs an answer, via: [sign_in] }
      - key: google_drive
        name: Google Drive
        icon: "📁"
        blurb: Sign in with Google and your agents read your Drive files to answer from them. Read only, so they cannot change, share or delete a file.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_drive, name: Read your Drive files to answer from them, via: [sign_in] }

  - key: meeting_notes
    title: Connect your meeting notes
    kicker: Sign in
    summary: One click. Sign in with your notetaker and your agents read your meetings to remember what was said; nothing they can change, and you can disconnect any time.
    entries:
      # One person's own Fathom sign-in (FathomConnection). Live on our own hub
      # (/admin/fathom); an admin sees the card's Connect or Disconnect
      # (IntegrationsController::FATHOM_CARD).
      - key: fathom
        name: Fathom
        icon: "🎙️"
        blurb: Sign in with Fathom and your agents read your meeting notes and transcripts to remember what was said. Read only, so they cannot change or delete a recording.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_meeting_notes, name: Read your meeting notes and transcripts, via: [sign_in] }

  - key: integrations
    title: Integrations
    kicker: Free
    summary: Connect accounts you already own. You pay the vendor directly; we wire it in and do no ongoing work.
    entries:
      - key: google_workspace_connect
        name: Google Workspace
        icon: google
        blurb: Connect your own Workspace. It powers your email drafting agent and a knowledge base built from the Drive folders you choose.
        status: live
        tier: pro
        tier_note: Drafting agent from Team
        connects: [admin_grant]
        abilities:
          - { key: draft_email, name: Draft email replies for you to send, via: [admin_grant] }
          - { key: knowledge_base, name: A knowledge base from the Drive folders you choose, via: [admin_grant] }
      - key: discord
        name: Discord
        icon: discord
        blurb: "Two-way, on request: our bot will post sign-ups, errors and your agents' updates in your server, and answer when you @‑mention it."
        status: on_request
        tier: vibe
        guide: discord
        connects: [app_install]
        abilities:
          - { key: post_updates, name: "Post sign-ups, errors and agent updates", via: [app_install] }
          - { key: answer_mentions, name: Answer when you @‑mention it, via: [app_install] }
      - key: github_org
        name: GitHub
        icon: github
        blurb: Your app's code lives in your own GitHub organization, for white label and full ownership.
        status: on_request
        tier: enterprise
        connects: [app_install]
        abilities:
          - { key: host_code, name: Keep your app's code in your organization, via: [app_install] }
      - key: slack
        name: Slack
        icon: slack
        blurb: The same notifications, and your agent's updates, in your Slack workspace.
        status: soon
        connects: [app_install]
        abilities:
          - { key: post_updates, name: Post notifications and agent updates, via: [app_install], status: soon }

  - key: add_ons
    title: Add-on services
    kicker: We run it
    summary: We set it up and keep it running, priced on top of your plan.
    entries:
      - key: google_workspace_managed
        name: Managed Workspace
        icon: google
        blurb: We create and run your Google Workspace, users and settings. Connecting one you already have stays free.
        status: live
        price: "$25/month + $15/user/month"
        price_note: Google Business Starter seat included
        connects: [managed]
      - key: payments
        name: Payments in your app
        icon: "💳"
        blurb: Card, bank and crypto checkout built into your app.
        status: on_request
      - key: extra_builds
        name: Extra build requests
        icon: "🛠️"
        # Pro and Team promise an Always-on CTO with no monthly cap, so this
        # add-on is for Builder (Mr. McRitchie, 2026-10-13).
        blurb: More changes than Builder's several a month, or a second app.
        status: on_request
        tier: builder

  - key: custom
    title: Talk to us
    kicker: Custom
    summary: Rarer needs we scope with you, one client at a time.
    entries:
      # Stripe moved here from Integrations (Mr. McRitchie, 2026-10-13). Still
      # Coming soon: the code exists but is switched off.
      - key: stripe_connect
        name: Stripe
        icon: stripe
        blurb: Card payments into your own Stripe account.
        status: soon
        connects: [sign_in]
      - key: crypto
        name: Crypto and wallets
        icon: solana
        blurb: Wallet sign-in, on-chain vaults and stablecoin payouts on Solana.
        status: live
      - key: extra_storage
        name: Extra storage
        icon: "🗄️"
        blurb: More database and file storage when your app outgrows its plan.
        status: on_request
      - key: ai_features
        name: AI features
        icon: "🧠"
        blurb: Chat, search, summaries and agents built into your app, on the models that fit the job.
        status: on_request
      - key: custom_connectors
        name: Custom connectors
        icon: "🔌"
        blurb: Your agent reads the systems you already use, such as Egnyte, built for your business.
        status: soon
        connects: [sign_in, api_key]
      - key: enterprise_extras
        name: White label, domains and compliance
        icon: "🛡️"
        blurb: Your brand on everything, extra domains, and compliance work such as CMMC and ITAR.
        status: on_request
        tier: enterprise
