# Logo brand styles: the data Logos::NavbarLogo (lib/logos/navbar_logo.rb)
# draws a brand's Navbar Logo and icon from, and Logos::StackedLogo its Stacked
# Logo. Rules and rake task: docs/topics/logos.md.
#
# name       two words; the logo sets them on one line beside the icon
# icon       a key in the icon data (lib/logos/data/brand_icons*.json)
# lettering  optional: a key in lib/logos/data/brand_lettering.json. The name is
#            then set from the brand's own traced letters, not Montserrat: one
#            weight, so `highlight: colour` only, and no `heavy`, `light` or
#            `tracking`
# highlight  how one word leads the other:
#              weight  the leading word is `heavy`, the other `light`
#              colour  both words are `heavy`; the leading word takes `accent`
# heavy      Montserrat weight for homogeneous text and the leading word
# light      the quiet word's weight (highlight: weight only)
# stacked    optional: the Stacked Logo's form (Logos::StackedLogo). `two_line`
#            (default) sets the first word big and the second small beneath it;
#            `one_line` sets the whole name on one line, for a brand whose
#            second word is too wide to sit under its first
# tagline    optional: the brand's tagline as the logo sets it, in capitals with
#            no full stop. The Stacked Logo's tagline form sets it under the
#            name in Montserrat 500 (Logos::StackedLogo); every character must be
#            in the glyph data. A brand without one has no tagline form
# tracking   optional: extra space after every letter, in em (negative tightens)
# note       optional: one line the brand's page shows about where its art came from
# tones      fills for a light and a dark background. `text` is the name's
#            colour; `quiet` (optional, defaults to `text`) is the non-leading
#            word under highlight: weight; `accent` is the leading word under
#            highlight: colour; `icon` maps each icon layer role to a fill;
#            `icon_key` (optional) names a different icon for this tone.
# watermark  optional: the watermark logo (the whole logo in one colour, slightly
#            transparent, for placing over a photograph). `fill` (default
#            "#FFFFFF"), `opacity` (greater than 0, at most 1; default 0.6) and
#            `icon_key`, a single-colour icon for a brand whose own icon would
#            fill in solid when every layer takes the one colour.
# palette    the brand's colours, as the gallery shows them: an ordered list of
#            {name, hex}, one list per brand, no split by tone (Logos::BrandKit).
#            The logo fills above stay per tone; this is only what is shown
# typefaces  the brand's typeface hierarchy, most prominent first, 1 to 3 levels
#            of {role, family, weight}. `family` is a face the hub serves
#            (Montserrat). A level set in the brand's own traced lettering has no
#            family and no weight, only a `label` saying so (Logos::BrandKit)
#
# Fills are solid #hex only: no gradients.

studio:
  name: McRITCHIE STUDIO
  tagline: BUILD SMARTER
  icon: studio
  highlight: weight
  heavy: 800
  light: 300
  palette:
    - { name: Ink, hex: "#1A1535" }
    - { name: Violet, hex: "#8E82FE" }
    - { name: Deep Violet, hex: "#635BB2" }
    - { name: Violet Mist, hex: "#EEECFF" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 800 }
    - { role: Text, family: Montserrat, weight: 300 }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#1A1535"
      icon: { primary: "#1A1535" }
    dark:
      text: "#FFFFFF"
      icon: { primary: "#8E82FE" }

industries:
  name: McRITCHIE INDUSTRIES
  tagline: BUILD BETTER
  icon: industries
  highlight: weight
  heavy: 700
  light: 300
  note: The Industries icon is drawn flat here, as two solid layers, without the marketing kit's steel gradient and tick marks. That is deliberate in this first version.
  palette:
    - { name: Forge Orange, hex: "#C8661F" }
    - { name: Ember Orange, hex: "#E07B2E" }
    - { name: Charcoal Steel, hex: "#262A30" }
    - { name: Gunmetal, hex: "#59606A" }
    - { name: Brushed Steel, hex: "#8C939C" }
    - { name: Light Steel, hex: "#D3D6DA" }
    - { name: Shop Black, hex: "#141516" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 700 }
    - { role: Text, family: Montserrat, weight: 300 }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#262A30"
      quiet: "#41464D"
      icon: { primary: "#262A30", edge: "#8C939C" }
    dark:
      text: "#F4F5F7"
      quiet: "#D3D6DA"
      icon: { primary: "#D3D6DA", edge: "#FFFFFF" }

turf:
  name: Turf Monster
  icon: turf
  highlight: colour
  heavy: 800
  tracking: -0.025
  stacked: one_line
  note: The head is auto-traced from the 880 px picture, with its grass texture flattened to three solid colours.
  palette:
    - { name: Brand Green, hex: "#4BAF50" }
    - { name: Forest, hex: "#2E7D32" }
    - { name: Deep Green, hex: "#1A550D" }
    - { name: Grass, hex: "#5C972A" }
    - { name: Cream, hex: "#F0EBCF" }
    - { name: Ink, hex: "#1A1535" }
    - { name: Violet, hex: "#8E82FE" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 800 }
    - { role: Text, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#1A1535"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
    dark:
      text: "#FFFFFF"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
  watermark:
    icon_key: turf_mono

welding:
  name: COMMERCIAL WELDING
  tagline: BUILDING STRONG CONNECTIONS
  icon: welding
  lettering: welding
  highlight: colour
  note: The helmet and the lettering are auto-traced from the current PNG files. The name is drawn without “LLC” and the service mark. On dark backgrounds the helmet is the single-colour version.
  palette:
    - { name: Welding Blue, hex: "#2D5E8E" }
    - { name: Spark Orange, hex: "#D7602E" }
    - { name: Ember, hex: "#F08A5A" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, label: Traced lettering (face not identified) }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#2D5E8E"
      accent: "#D7602E"
      icon: { primary: "#2D5E8E", accent: "#D7602E" }
    dark:
      icon_key: welding_mono
      text: "#FFFFFF"
      accent: "#F08A5A"
      icon: { primary: "#FFFFFF" }
  watermark:
    icon_key: welding_mono
