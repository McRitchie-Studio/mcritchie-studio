# THE IMAGE GENERATORS WE CAN CALL — one row per model, read by
# ImageGeneration::Registry.
#
# WHY A REGISTRY RATHER THAN A CLIENT. The operator's decision, 2026-09-26: "the
# generator should be data driven to an extent and deterministic. We should be
# able to transition between generators as model capacities change." A vendor
# name spelled through the codebase makes that transition a rewrite. A row makes
# it an edit to this file — and that was proven within a day of writing it: the
# sheet generator moved from fal to OpenAI and no caller changed.
#
# ⚠ A ROW RECORDS WHAT WAS MEASURED FOR **THAT ROW**, AND NOTHING ELSE.
#
# This is the rule the file exists to enforce, and it was learned by breaking it
# twice in one day:
#
#   * `fal_ideogram_character` shipped claiming `full_body`, `back_view` and
#     `expressions`. `back_view` had NEVER been measured. `full_body` had been
#     measured ONCE and had come back a grey suit cropped mid-thigh, which is not
#     a pass. Three capability claims, one weak measurement.
#   * A report then said "fal cannot hold a set" on the strength of a
#     `fal-ai/flux-pulid` grid. That is a DIFFERENT ROW. Two fal rows are two
#     models; a result measured on one says nothing about the other.
#
# So every row carries a `measured:` block saying what was actually run, when,
# and what came back — including the word NOT for anything untested. A capability
# with no corresponding measurement is a claim the code will act on and nobody
# checked. If you cannot point at a run, do not list the capability.
#
# THE CAPABILITY VOCABULARY, deliberately narrow:
#
#   zero_shot_identity  carries a likeness from ONE photo at generation time,
#                       with no training step to prepare and therefore none to fail.
#   single_portrait     PROVEN to hold that likeness on ONE image.
#   character_sheet     PROVEN to hold it across a MULTI-PANEL sheet in one image.
#                       Strictly stronger than single_portrait and measured
#                       separately, because the two come apart: flux-pulid holds a
#                       portrait and returns six different men on a grid.
#   trained_identity    builds a persistent identity by TRAINING on a photo set.
#   image_to_video      animates a still.
#
# PINNING IS HALF OF "DETERMINISTIC". A sheet from March must match one from
# January, which is impossible if the model moves underneath. Rows name an exact
# published model — a dated snapshot wherever the vendor offers one — and
# `api_version` records the contract the request and response shapes were read
# off, so a vendor reshaping its payload is a visible mismatch rather than a
# silent parse failure.
#
# THE OTHER HALF IS STAMPED ON THE ARTIFACT: artifacts.generator, .generator_endpoint,
# .generator_version, .seed, .prompt, .billable_units, .cost_usd.
#
# NEVER PUT A SECRET IN THIS FILE. Rows name the ENV var; the value comes from
# Heroku config or 1Password.

generators:
  # THE SHEET GENERATOR, and the only row measured to hold a likeness across a
  # whole sheet.
  #
  # THE ENDPOINT IS THE FINDING. This is the Responses API with the
  # `image_generation` TOOL — not /v1/images/edits, which was measured on the same
  # reference and the same prompt and lost identity even on a SINGLE portrait
  # ("different facial structure, age, and facial hair"), and where /v1/images/edits
  # was no better with five reference photos than with one — a finding about THAT
  # endpoint, which is the only path it has ever been measured on, and never a
  # finding about the Responses path this row registers.
  # /v1/images/edits EDITS a picture; the Responses tool
  # LOOKS at the reference, reasons, then generates, and that reasoning step is
  # what carries the likeness across ten panels.
  #
  # A DATED SNAPSHOT, NOT THE `gpt-5` ALIAS. The alias resolves to this snapshot
  # today (measured 2026-09-27 against /v1/models), and an alias that silently
  # rolls forward is precisely what "deterministic" forbids. The approved
  # artifacts were generated through the alias while it pointed here.
  openai_gpt5_sheet:
    label: GPT-5 image generation (Responses)
    adapter: openai
    endpoint: https://api.openai.com/v1/responses
    model: gpt-5-2025-08-07
    api_version: v1
    credential_env: OPENAI_API_KEY
    # TOKENS, NOT IMAGES. The Responses API reports `usage.total_tokens` and no
    # image count at all, so a sheet is one picture and many thousands of these.
    # NO `unit_price_usd` IS DECLARED: the call is a reasoning pass plus an image
    # generation billed on different schedules, and multiplying tokens by a single
    # made-up rate would put a confident dollar figure on the artifact that nobody
    # could re-derive. cost_usd therefore stays nil — "not reported" — which is the
    # true statement, and billable_units still records what was actually measured.
    billing_unit: tokens
    reference_field: input_image
    # ⚠ `one` HERE IS A QUALITY BELIEF, NOT AN API LIMIT, AND IT IS UNMEASURED.
    #
    # THE KEY DOES TWO DIFFERENT JOBS ACROSS THIS FILE, which is worth knowing before
    # you read any row's value. On the fal rows it records the vendor's REQUEST SHAPE —
    # `reference_image_urls` takes a list, `reference_image_url` takes one, and getting
    # it wrong earns a 400. Here it records what we BELIEVE produces a better sheet
    # through an endpoint that accepts as many `input_image` blocks as you send. The
    # first is checkable against a vendor doc; the second is only checkable by paying
    # for sheets. Splitting them into two keys (`request_arity` / `references_sent`)
    # would stop a reader taking one for the other; that is a code change with its own
    # blast radius and it is not this comment.
    #
    # NOT FLIPPED TO `many`, DELIBERATELY, 2026-09-27. ImageGeneration::OpenAI is wired
    # for the plural answer and honours whatever this says, so flipping it is one word.
    # It stays `one` because nothing has measured the alternative ON THIS PATH:
    #   * The "five were no better than one" finding was measured on /v1/images/edits,
    #     a DIFFERENT endpoint this file tells you never to use. It is not evidence here.
    #   * No multi-reference call to /v1/responses has ever been made from this repo.
    #   * The question is a QUALITY judgement about a likeness, and the pads defect
    #     below is the standing proof that a loosely-phrased judgement gets a generous
    #     yes from whoever is asked. It needs the operator's eye, not an agent's.
    # WHAT WOULD SETTLE IT: two sheets of the SAME person from the same prompt, one at
    # `one` and one at `many` over a distilled set, put side by side for an operator
    # verdict, with both token counts recorded here. Until that exists, `many` would be
    # exactly the unmeasured capability claim this file's header exists to refuse.
    reference_arity: one
    capabilities:
      - zero_shot_identity
      - single_portrait
      - character_sheet
    # TEN CELLS, EIGHT FIGURES — one layout, two correct counts, and this is the row
    # that says which is which. The sheet is a 5x2 grid, so there are TEN CELLS. The
    # two full-body figures each SPAN both rows of their column, so there are EIGHT
    # FIGURES: 2 full-body + 6 head views. "Ten-panel" elsewhere in the repo means the
    # ten cells of the grid; a count of eight means the figures standing in them.
    # Neither number is wrong and they are not the same measurement.
    measured:
      date: "2026-09-26"
      by: coordinator
      result: >
        A character sheet from ONE cached ESPN headshot — ten grid cells carrying
        eight figures (2 full-body + 6 head views). The same man in every one of
        them, faithful to the reference. Operator verdict "I think you are there"
        on v4. NOTE: this row claims nothing about reference COUNT — see the
        reference_arity comment above for why that question is still open.
      # The measured low and high below, as numbers for the page's cost hint.
      units_range: [6724, 7629]
      cost: >
        MEASURED through this app's own code path, three sheets, each one image of
        ten cells / eight figures from a stored ESPN headshot. usage.total_tokens:
        7629 (Courtland Sutton, 2026-09-27, 121.8s), 7423 (bo-nix, 2026-09-27),
        6724 (jaylen-waddle, 2026-09-27). So a sheet costs SINGLE-DIGIT THOUSANDS
        of tokens, measured range 6724-7629, and no single figure is "the" cost —
        quote the range or the order, never one sample. There is no dollar figure
        because no token rate is declared here — see billing_unit above for why
        inventing one is refused.
      not_measured: >
        The prompt's "full pads in every panel" clause is NOT satisfied in the six
        head views. Measured twice independently — on the operator-approved v4 by
        the coordinator, and again on this app's own 2026-09-27 run — the two
        full-body figures carry pad structure while the head views show a natural
        sloping shoulder line rather than the squared shelf a shoulder pad creates.
        Repeating the clause per panel did NOT fix it either time, so the open
        question is whether the phrasing must describe the SILHOUETTE instead of
        naming the equipment. The look is operator-approved; the CLAIM is not met.
    docs_url: https://platform.openai.com/docs/api-reference/responses

  # EMAIL HEADER ART (epic email-image-builder, piece 1) — the same Responses
  # endpoint and pinned snapshot as the sheet row, asked for a landscape image.
  #
  # A SEPARATE ROW, NOT A NEW CAPABILITY ON THE SHEET ROW, because the two differ
  # in what they send: this row passes the image tool's `size` (1536x1024, cropped
  # to the 1200x600 preset by EmailImages::Crop) and offers EVERY reference — the
  # brand's mascot or logo plus a style anchor — where the sheet row's `one` is a
  # likeness belief about faces that does not apply to a logo. The reasoning on
  # the sheet row's `reference_arity` still governs that row and nothing here
  # changes it.
  #
  # No `unit_price_usd`, for the reason the sheet row gives: tokens across two
  # billing schedules, no honest single rate. cost_usd stays nil, "unpriced".
  openai_image_header:
    label: GPT-5 image generation, email header (Responses)
    adapter: openai
    endpoint: https://api.openai.com/v1/responses
    model: gpt-5-2025-08-07
    api_version: v1
    credential_env: OPENAI_API_KEY
    billing_unit: tokens
    reference_field: input_image
    reference_arity: many
    image_size: "1536x1024"
    capabilities:
      - email_header
    measured:
      date: "2026-10-06"
      by: pokemon
      result: >
        One round (two images) through this app's own path in the
        email-header-image-generator desk: brief turf-monster
        drop_signup_confirmation/new_player, text mode baked, headline "You're on
        the list!", references the gator mascot and Turf's welcome banner as style
        anchor. Both came back 1536x1024, were cropped to 1200x600 JPG (149,111 and
        155,893 bytes), and show the gator on a night field with the headline spelled
        correctly. No real person, no team mark. The second leaned closely on the
        style anchor's pose; the first did not. Operator verdict not yet given.
      # The two measured token counts, as numbers for the page's cost hint.
      units_range: [5251, 6889]
      cost: >
        MEASURED, two images: usage.total_tokens 5251 (artifact-1c942bee9159, 43.3 s)
        and 6889 (artifact-d40436e5009e, 58.7 s), 101.9 s for the round including
        crop and upload. Single-digit thousands of tokens per header, the same order
        as a sheet. No dollar figure: no token rate is declared (see the sheet row).
      not_measured: >
        Whether `none` (no lettering) is honoured: only `baked` has been run. Industries
        and Studio kits have not been run. Spelling held on one headline; a longer one
        is unmeasured.
    docs_url: https://platform.openai.com/docs/api-reference/responses

  # A SINGLE PORTRAIT, CHEAPLY AND FAST — which is all this row is registered for.
  #
  # IT SHIPPED OVERCLAIMING and this is the corrected row. It previously listed
  # `full_body`, `back_view` and `expressions`. `back_view` was never run at all.
  # `full_body` ran ONCE and came back a grey business suit cropped at mid-thigh
  # rather than a team uniform head-to-toe — the likeness held, the instruction did
  # not, and a capability list is a statement about what the model DELIVERS.
  fal_ideogram_character:
    label: Ideogram V3 Character
    adapter: fal
    endpoint: fal-ai/ideogram/character
    api_version: "1.0.0"
    credential_env: FAL_KEY
    reference_field: reference_image_urls
    reference_arity: many
    unit_price_usd: 0.05
    billing_unit: image units
    capabilities:
      - zero_shot_identity
      - single_portrait
    measured:
      date: "2026-09-26"
      by: shannon
      result: >
        One image of Courtland Sutton from one ESPN headshot. Identity HELD and was
        plainly recognisable even at full-body scale. Billed 3 units at $0.05 =
        $0.15; about 60s queued to completed.
      not_measured: >
        NOT run on a multi-panel sheet, so it claims no character_sheet capability.
        The one full-body attempt produced a grey suit cropped mid-thigh, so
        full_body is NOT claimed either. back_view has never been run.
    docs_url: https://fal.ai/models/fal-ai/ideogram/character

  # THE FASTEST PORTRAIT, and the clearest example of why `character_sheet` is a
  # separate capability from `single_portrait`.
  fal_flux_pulid:
    label: PuLID Flux
    adapter: fal
    endpoint: fal-ai/flux-pulid
    api_version: "1.0.0"
    credential_env: FAL_KEY
    reference_field: reference_image_url
    reference_arity: one
    capabilities:
      - zero_shot_identity
      - single_portrait
    measured:
      date: "2026-09-26"
      by: coordinator
      result: >
        One reference, single portrait — identity HELD, scored 0.75, in 4.3s.
      not_measured: >
        FAILS on a set, which is why character_sheet is absent rather than assumed
        from the portrait result: a 6-panel grid returned SIX DIFFERENT MEN, and
        three separate calls at the same seed matched the reference 1 time in 3.
    docs_url: https://fal.ai/models/fal-ai/flux-pulid

  # THE INCUMBENT, kept and not deleted.
  #
  # `trained_identity` is a real capability and not a euphemism: when a photo set
  # DOES satisfy it, a trained model holds a subject more tightly than any
  # zero-shot adapter. The training step is exactly what we could not feed.
  higgsfield_soul:
    label: Higgsfield Soul v2
    adapter: higgsfield
    endpoint: /higgsfield-ai/soul/v2/standard
    api_version: v2
    credential_env: HIGGSFIELD_API_KEY
    reference_field: custom_reference_id
    reference_arity: trained
    capabilities:
      - trained_identity
    measured:
      date: "2026-09-25"
      by: coordinator
      result: >
        Six custom-reference mints attempted. FOUR FAILED at training preparation,
        always "We couldn't prepare your photos for training"; the two that
        completed each used a single tight ESPN headshot. The images fetched fine
        in every failure, so this is image CONTENT at the training step, never
        reachability.
      not_measured: >
        No generation was ever pinned to a completed identity, so nothing here
        claims single_portrait or character_sheet.
    docs_url: https://docs.higgsfield.ai

  # THE JOB HIGGSFIELD IS ACTUALLY GOOD AT, and the clearest argument for a
  # registry over a migration. Content::AssembleAgent has called this all along
  # and it has never failed. Right tool per stage.
  higgsfield_kling_video:
    label: Kling 2.5 Turbo Pro (image to video)
    adapter: higgsfield
    endpoint: /kling-video/v2.5-turbo/pro/image-to-video
    api_version: v2.5-turbo
    credential_env: HIGGSFIELD_API_KEY
    reference_field: image_url
    reference_arity: one
    capabilities:
      - image_to_video
    measured:
      date: "2026-09-24"
      by: content pipeline
      result: >
        In continuous use by Content::AssembleAgent and has never failed.
      not_measured: >
        Carries no identity capability of its own — it animates a still that some
        other row produced.
    docs_url: https://docs.higgsfield.ai
