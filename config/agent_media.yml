# Where the agents and apps POST on their own: each one's HOME, a medium plus a
# channel (docs/agents/system/agent-message-loop.md, "Media"; the plan is
# .agents/epics/omnichannel-media.md). Read by Media::Config, asked through
# Media.home(purpose:, app:, soul:).
#
# A home is NEVER where a reply goes: a reply always goes back on the medium the
# message arrived on (AgentMessageReplyJob reads the row's own `channel`). This
# file decides only the standalone posts: the floor alert, release notes, /build
# app requests, and a report with no channel chosen in admin.
#
# RESOLUTION. Media.home walks purpose → soul → app → defaults and takes the FIRST
# level with an entry. That entry's `medium` (else defaults.medium) and `channel`
# (else defaults.channel) make the home; a `channel: null` written on purpose
# means "no channel": the caller posts nothing, as before.
#
# FALLBACK. A medium whose block is missing, `enabled: false`, or that has no
# adapter in Media::REGISTRY is skipped for its block's `fallback` (else
# defaults.fallback), keeping the same channel NAME; Media logs the walk once per
# process. So a half-set Slack never silences the floor alert.
#
# SWITCHING. Move an app, a soul or a purpose to another medium by editing its
# `medium:` here (one line), once that medium's block is enabled and names the
# channel. Nothing else changes.
#
# CHANNELS are logical names, per medium. A Discord channel is either an `id` (a
# snowflake, quoted, posted to by the shared bot) or a `webhook_env` (an ENV name,
# or a list tried in order: the URL is a secret and never lives here).
#
# The dispatcher (bin/dispatcher) does not read this file, so it is not in
# AgentMailbox::CodeFingerprint (bin/lib/agent_dispatcher.rb); add it there the
# day bin/lib reads it.
#
# Every entry below resolves to exactly the Discord destination each poster used
# before this file existed (card media-homes-config: zero behaviour change).

defaults:
  medium: discord
  channel: internal
  fallback: discord

discord:
  enabled: true
  guild_id: "1332466565203103744"        # McRitchie Studio (config/agent_routes.yml guilds)
  channels:
    # The floor alert's channel (AgentMessages::FloorAlert, ChangeBuilds): was
    # agent_routes.yml discord.ops_channel_id. lobster-tank until an ops channel exists.
    ops:
      id: "1479973077021495478"
    # Release notes (Release::Conductor, POST /api/v1/release_notes), through the
    # release-notes webhook, else the deploy webhook (ReleaseNotes::DiscordClient).
    releases:
      webhook_env: [ DISCORD_RELEASE_NOTES_WEBHOOK_URL, DISCORD_DEPLOY_WEBHOOK_URL ]
    # The two lanes of DiscordChannels: messages from the outside world, and the
    # team talking to itself (1Password discord.webhooks).
    external:
      webhook_env: DISCORD_EXTERNAL_WEBHOOK_URL
    internal:
      webhook_env: DISCORD_INTERNAL_WEBHOOK_URL

# Slack (Media::Slack): the McRitchie Agents app posts as each soul. Enabled;
# no purpose names it yet (the cutover is card 6), but a shipped release posts
# here (release_posts below). Slack can post only while
# SLACK_BOT_TOKEN is set; without it Media.home falls back to discord, so a
# half-set Slack silences nothing. A channel is an `id` (C…); the app must be a
# member of it (invite @McRitchie Agents) or Slack answers not_in_channel.
slack:
  enabled: true
  token_env: SLACK_BOT_TOKEN
  signing_secret_env: SLACK_SIGNING_SECRET
  team_id: "T0CC9DQ9NAK"                 # McRitchie Studio
  fallback: discord
  channels:
    agents:
      id: "C0CD8ETBZBM"
    ops:
      id: "C0CDEG43ECS"
    releases:
      id: "C0CDJCN4L92"

# A SHIPPED RELEASE ON SLACK (ReleaseNotes::SlackAnnouncement, run by
# `bin/release announce`, which the cycle runs once prod verify is green). Not a
# purpose: it always posts on Slack and never falls back to Discord (the
# Discord release notes stay `purposes.release_notes`).
#   general   ONE summary: release, apps with emoji and prod SHA, every card with
#             task and PR links. A channel name under slack.channels, posted as
#             `soul` (Mason, the COO who runs full-cycle).
#   app_soul  who posts in an app's channel (config/agent_routes.yml
#             slack.channels, matched by the repo's name) when the channel has
#             no default_soul that may answer there. turf-monster → turf_monster
#             and cyvasse → tywin come from those channels' default_soul.
release_posts:
  general:
    channel: agents                      # C0CD8ETBZBM, #agents-general
    soul: mason
  app_soul: steffon

# THE NOISE CAPS (Media::Slack::Limits), enforced at the outbound seam:
# Media::Slack#post and #deliver_reply check them before every chat.postMessage,
# counting from the shared SlackPost ledger. Over a cap the post is not sent: the
# ledger row is `suppressed` with the reason, a reply's message gets a
# reply_suppressed event and reply_status skipped, and nothing retries it.
# A soul-less post (an alert or report through a home) is never capped.
limits:
  # Posts one soul makes in one channel per rolling hour. Release posts are
  # exempt but counted.
  per_soul_per_channel_per_hour: 6
  # Agent posts in one thread since Alex McRitchie last wrote in it. Nothing is
  # exempt: the agents stop and wait for him.
  replies_per_thread_without_owner: 4
  # An answer to a message Alex McRitchie wrote himself counts toward the hourly
  # cap but is never suppressed by it: his own question is not noise.
  owner_replies_count_only: true

# A registered stub (Media::Teams): every method raises NotImplementedError.
teams:
  enabled: false
  fallback: discord
  channels: {}

purposes:
  floor_alert:
    medium: discord
    channel: ops
  # TO FLIP RELEASE NOTES TO SLACK, change the one line below to `medium: slack`
  # (#releases, C0CDJCN4L92). Back to Discord is the same line. Slack receives
  # the same content, its embeds converted to Block Kit (Media::Slack::Format).
  release_notes:
    medium: discord
    channel: releases
  app_requests:
    medium: discord
    channel: external
  # A report with no destination row: rows chosen at /admin/report_destinations
  # (or an owner's /agents/:slug/settings) always win. No channel, so such a
  # report stays `not_configured`, as before.
  reports:
    medium: discord
    channel: null

# Each app's and soul's main home: no poster reads one yet (purposes come first).
apps:
  mcritchie_studio:
    medium: discord
  turf_monster:
    medium: discord
  cyvasse:
    medium: discord

souls:
  avi:
    medium: discord
  alex:
    medium: discord
  turf_monster:
    medium: discord
