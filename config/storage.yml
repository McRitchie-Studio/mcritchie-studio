test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Two durable services: `amazon` (production.rb) and `amazon_dev` (development.rb,
# local desks). QA apps boot RAILS_ENV=production, so they load `amazon`; QA_ENV
# is the one signal separating them from production (Studio.qa_environment?, the
# same read Studio::S3 keys on). Unset or unrecognised resolves PRODUCTION.
#
# BOTH ARE CLOUDFLARE R2, and nothing else: AWS was retired on 2026-10-10. The
# names survive because blob rows record the service NAME. The services are built
# in config/initializers/00_storage_backend.rb, which also decides what a missing
# R2_* variable does (raise in production and QA; a placeholder that reaches
# nothing in test, CI and a keyless desk).
#
# `service: StudioTrashS3` is studio-engine's S3 service with a grace period:
# purging or replacing an attachment MOVES the object under trash/ (copy, then
# delete) and the bucket's `expire-trash-3d` lifecycle rule removes it three days
# later. It refuses to delete from a "*-production" bucket unless the process is
# real production, which is why QA must resolve the dev bucket here.
<% buckets = {
     "amazon" => Studio.qa_environment? ? "mcritchie-studio-dev" : "mcritchie-studio-production",
     "amazon_dev" => "mcritchie-studio-dev"
   } %>
<%# JSON is YAML flow syntax, so each service renders as one quoted line. %>
<% StorageBackend.active_storage_services(buckets).each do |name, config| %>
<%= name %>: <%= config.to_json %>
<% end %>
