production:
  error_log_cleanup:
    class: ErrorLogCleanupJob
    schedule: "0 3 * * * America/Los_Angeles"
    args: []
  # agent_actions retention: deletes rows OLDER than 45 days (occurred_at), in batches
  # of 5,000 with a pause and a 10-minute budget, keeping graded and CI-scope rows.
  # Nightly, after error_log_cleanup. See AgentActionRetentionJob for the rule.
  agent_action_retention:
    class: AgentActionRetentionJob
    schedule: "30 3 * * * America/Los_Angeles"
    args: []
  # csp_reports retention: deletes violation rows not seen for 30 days
  # (CspReport::RETENTION). See CspReportRetentionJob.
  csp_report_retention:
    class: CspReportRetentionJob
    schedule: "45 3 * * * America/Los_Angeles"
    args: []
  # Keeps docs/agents/shared/insights.md honest. The board is the only place that
  # holds BOTH the live bank and the deployed copy of the doc, so this is where the
  # comparison can run at all; a drift writes an ErrorLog receipt.
  insights_doc_freshness:
    class: InsightsDocFreshnessJob
    schedule: "0 4 * * 1 America/Los_Angeles"
    args: []
  # The team@ inbound path: MX for in.mcritchie.studio plus dropped Resend
  # ingests. A failure writes an ErrorLog receipt. See DeskHealthJob.
  desk_health:
    class: DeskHealthJob
    schedule: "0 7 * * * America/Denver"
    args: []
  # The bookkeeping nudge (Books::Reminder): on the 5th, each entity whose last
  # month is not closed FINAL hears which statements are in and which are missing.
  # Posts to the books_reminder report destination; SOP close-the-month (Mack's, docs/agents/agents/mack/sops/close-the-month.md).
  books_reminder:
    class: BooksReminderJob
    schedule: "0 8 5 * * America/Denver"
    args: []
  # Steffon's nightly agent job over the database backups: after Heroku's 02:00
  # Denver captures, read each backed-up app's latest backup (config/apps.yml
  # backups: true), capture one where none completed since the 02:00 slot, record it for
  # the 07:00 daily app report, and open the floor incidents the dispatcher's
  # alert posts once. Inert (one log line) until HEROKU_BACKUP_API_KEY is set.
  # See DbBackupSweepJob and docs/agents/agents/steffon/sops/db-restore-drill.md.
  db_backup_sweep:
    class: DbBackupSweepJob
    schedule: "30 3 * * * America/Denver"
    args: []
  # The morning CTO summary: every live studio-engine app's health for the day
  # ending 07:00 Denver, in ONE Discord message under the report key
  # daily_app_report (Alex McRitchie picks the channel at /admin/report_destinations).
  # Satellites are read over HTTP with HEALTH_TOKEN_<SLUG>; the hub in-process.
  # The same run then posts each app's own CTO report (CtoReport,
  # cto_report:<domain>), reusing those reads.
  # See DailyAppReportJob and docs/agents/system/daily-app-report.md.
  daily_app_report:
    class: DailyAppReportJob
    schedule: "0 7 * * * America/Denver"
    args: []
  # /contact submissions the bot check flagged in the last day, in one email to
  # Alex McRitchie; nothing on a quiet day. See ContactFlaggedDigestJob.
  contact_flagged_digest:
    class: ContactFlaggedDigestJob
    schedule: "0 7 * * * America/Denver"
    args: []
  # The agent mailbox's BACKSTOP read: every text channel and active thread of
  # each guild in config/agent_routes.yml, over the bot's REST API, for whatever
  # the Gateway listener (AgentMessages::DiscordGateway, on this dyno's scheduler
  # process) missed. Inert (one log line) until DISCORD_AGENT_BOT_TOKEN and a
  # guild are set. See AgentMessageDiscordPollJob and
  # docs/agents/system/agent-message-loop.md.
  agent_message_discord_poll:
    class: AgentMessageDiscordPollJob
    schedule: every 10 minutes
    args: []
  # The floor under bin/dispatcher (Alex McRitchie's Mac): one Discord alert per incident
  # when no dispatcher has pinged for 5 minutes or a routed message has waited 10,
  # and one recovery line. Inert (a log line) without the bot token or a
  # floor_alert channel in config/agent_media.yml. See AgentDispatcherAlertJob and Steffon's
  # docs/agents/agents/steffon/sops/agent-dispatcher.md.
  agent_dispatcher_alert:
    class: AgentDispatcherAlertJob
    schedule: every minute
    args: []
  # The Discord channel directory behind /admin/report_destinations: every
  # channel and active thread of each guild in config/agent_routes.yml, upserted
  # into discord_channels, the unseen ones archived. Inert (one log line) until
  # DISCORD_AGENT_BOT_TOKEN is set. See DiscordChannelSyncJob and
  # docs/agents/system/report-destinations.md.
  discord_channel_sync:
    class: DiscordChannelSyncJob
    schedule: every 15 minutes
    args: []
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
