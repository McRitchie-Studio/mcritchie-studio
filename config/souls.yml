# THE SOUL ROSTER: one record per soul, and the one place a soul is written down.
#
# Read by db/seeds/02_agents.rb, which upserts one Agent row per record, and by
# Task::SOUL_ROSTER, the static floor of slugs Task.soul? accepts when the Agent
# table cannot be read. A soul added here is on both, so the seed and the roster
# cannot drift.
#
# Fields:
#   slug, name, status, agent_type, title, description, avatar, position
#             the Agent columns; avatar names a file under public/agents/
#   emoji, color
#             the status-line glyph and tint (Agent#emoji, Agent#status_color),
#             explicit so two souls never collide on the avatar palette
#   metadata  merged into Agent#metadata; the ReviewerSelector keys:
#               reviewer       true if in the senior review pool
#               review_role    owner | reviewer | orchestrator | null
#               domains        areas this soul reviews (domain-fit input)
#               review_weight  NUMERIC weight (2.0 heavy, 1.0 light), never a label
#
# Carl is the standing primary and owner on every PR; he summons one domain light
# from Shannon (UI), Jasper (Web3), Steffon (DevOps) and Xan (Documentation). Avi
# is the qa_owner and stays out of the light pool, so no soul both reviews and QAs
# one change. See docs/agents/agents/carl/sops/pr-review.md.
souls:
- slug: xan
  name: Xan
  status: active
  agent_type: orchestrator
  title: Lead Orchestrator
  description: 'Coordinates all agents, manages task assignment, and oversees system operations — the central brain of McRitchie Studio. Also holds the senior review pool''s Documentation seat: reviews docs, runbooks, the agent operating model, and READMEs on PRs that touch them.'
  avatar: "/agents/xan.webp"
  position: 0
  emoji: "🧭"
  color: "#818CF8"
  metadata:
    review_role: reviewer
    reviewer: true
    domains:
