# What each McRitchie Studio package tier includes — and which SOP delivers
# each feature. This is the ONE place package contents live. Two pages render it:
#
#   /packages        the marketing page: one card per tier, its promise, its
#                    `highlights` and its call to action
#   /packages/stack  the full stack: every feature row below, grouped by
#                    `category`, one column per tier, so the difference between
#                    tiers reads across the row ("Eco dyno" / "Basic dyno" / ...)
#
# Tiers approved by Mr. McRitchie 2026-09-30 (epic: pricing-tiers-v2), a ladder
# where each includes the one below: Vibe free, Pro $100/mo, Growth $500/mo,
# Enterprise custom; 10% off billed annually. They replaced Launch, Host,
# Workspace and Agentic of 2026-09-25 (Workspace folded into Growth); migration
# RemapPackageTiers moved every stored tier to the new keys.
#
# Package keys:
#   key, name       the tier; `key` is what stack_clients.tier and app_requests.tier store
#   tagline         the one-line promise on its card
#   price_monthly   0 renders "Free"; a number "$N/month"; blank renders `price_label`
#                   ("Custom"), or "Pricing coming soon" without one
#   comp            the real client the tier was worked back from. Internal: the
#                   cards do not name clients; the admin SOP map does
#   highlights      the 4-6 inclusions the card leads with, customer-facing
#   cta             label + action: `build` (/build), `schedule` (the studio's
#                   booking calendar) or `enterprise_booking` (enterprise_booking_url
#                   below, else the studio's booking calendar)
#   featured        true on the one card the page highlights
#
# Feature keys:
#   name      customer-facing label
#   category  the group it sits under on /packages/stack (see `categories`)
#   icon      a software key (config/workspace_icons.yml) when the row is about ONE
#             brand's product: the row leads with that brand's logo, and that
#             brand joins its tier's "Powered by" row on /packages. Otherwise an
#             emoji: the neutral lead of a row no single brand owns (Hosting
#             mode, Support). Use a logo only where the customer gets that
#             brand's product.
#   blurb     one customer-facing sentence: what they get, not how
#   vibe/pro/growth/enterprise
#             what that tier gets, shown IN the row:
#               a string  → the package's value ("Basic dyno")
#               true      → included, nothing to quantify
#               omitted   → not included (the cell shows "—")
#   sop       registered SOP invocation that delivers it (docs/agents/agents/*/sops/<sop>.md)
#   section   optional — the part of that SOP that applies
#   you_do    what the CUSTOMER / operator does themselves (blank = nothing)
#   status    live     an SOP delivers it today (names that SOP)
#             builtin  part of the app template or the service itself: nothing to
#                      provision, so no SOP step
#             planned  not delivered today: "Coming soon", names no SOP. Keep this
#                      honest — a planned row is a promise, not a feature.
#   software  the software keys (config/workspace_icons.yml) the feature puts in a
#             client's stack — what /stack draws for a client on that tier. Only a
#             delivered (live or builtin) feature provisions; a planned one does not.
#             /packages/stack draws them (and `shows`, less the lead brand) as the
#             row's logo strip; /packages draws a delivered row's brands on its
#             tier's card. A planned row's logos show only on /packages/stack,
#             beside its Coming soon tag.
#   shows     software keys drawn beside the row on /packages/stack WITHOUT
#             provisioning them: an add-on a client takes per contract, recorded
#             on the client (stack_clients.extra_software), not by its tier
billing:
  annual_discount_percent: 10

# The Google Calendar appointment page the Enterprise "Book a call" opens, in a
# new tab. Blank until Mr. McRitchie supplies it: the button then opens the
# studio's own booking calendar (ScheduleController::BOOKING_URL) in the
# booking popup, so it is never a dead link.
enterprise_booking_url:

