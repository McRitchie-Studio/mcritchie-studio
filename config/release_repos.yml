# Release repo registry: how each repo rides the Deploy workflow. Read by
# Release::Repos (kind, gem?, app?, gem_meta), Release::Conductor.member_plan (gem
# or app per member), bin/release (publishes gems, merges app branches) and
# Task#release_repo / #gem_release? (the board's gem badge and ordering).
#
# PRODUCER-FIRST. `bin/release prepare` publishes every gem member to RubyGems at
# QA assembly, after a fail-closed preflight over all swept gems and before the
# pre-QA gate and any QA deploy, then commits each consumer app's lock bump onto
# origin/release. `bin/release ship` re-verifies each gem (already live: skip)
# before the apps deploy, so an app always builds against the published version.
#
# A GEM IS A CONSUMER TOO: studio-engine depends on solana-studio. The consumer
# bump walks `apps` only, so bump_producer_locks_for_accepted bumps the gems'
# locks from this file's `gems` list, onto `accepted`. Never move a gem into
# `apps` to reach it: validate_gems_for_qa reads a non-empty `apps` list as the
# quorum that QAs a gem, so a producer there lets a gem publish unQA'd.
#
# Two member kinds:
#   gems: published to RubyGems. No app branch here; the PR lives in the gem's own
#         repo. Published at prepare, re-verified at ship, QA'd through a
#         consuming app's bumped Gemfile.lock.
#   apps: deployed. Keyed by repo slug; each carries an optional `prod_deploy`
#         adapter, and its branch merges onto the release branch.
#
# prod_deploy is OPTIONAL. With none, ship advances main and records `no
# production deploy target — nothing dispatched`. Never stand in a no-op deploy
# script: ship would report a deploy that did not happen. A declared adapter
# promises its `command` exists on disk, and repos_test asserts it.
#
# prod_deploy strategies:
#   git_push_heroku: push the release's main to a Heroku git remote.
#       remote    — the git remote name or Heroku git URL.
#       branch    — the branch the remote deploys (main).
#       smoke_url — the production HOST; ship smokes `<smoke_url>/up` after the
#                   push, so the value never ends in /up.
#   github_actions: dispatch a workflow and watch it to completion (the hub). The
#                 workflow pushes to Heroku and runs the /up smoke; the
#                 `production` Environment has no required reviewer, so launching
#                 `bin/release ship` is the confirmation. The conductor runs no
#                 smoke of its own here.
#       workflow  — the .github/workflows file to dispatch (prod-deploy.yml).
#       smoke_url — kept for the board and the deploy record.
#     Its QA twin is the fixed `qa-deploy.yml`, which prepare dispatches instead
#     of `bin/qa-server deploy`.
#   repo_script: run a deploy script the app repo owns.
#       command — the repo-relative script (bin/deploy).
#       args    — its argv (["--yes"] skips prompts).
#     The script runs in the repo's SHIP WORKSPACE (<repo>/.worktrees/_ship): a
#     clean worktree with a DETACHED HEAD at the QA-frozen SHA. So a push uses a
#     refspec that works detached (`HEAD:main`); gitignored artifacts
#     (node_modules, app/assets/builds, .env beyond the mirrored one) are absent;
#     and the only env added is DATABASE_URL for the workspace's private test DB
#     (<app>_ship_test). RAILS_ENV stays unset, so a precompile builds the
#     production artifact.
#
# Optional `qa_deploy: { app: <qa-server-key> }` overrides the qa-server target;
# absent, `Release::Repos.qa_app` uses the repo slug.
#
# GATES. Both commands NAME a suite CI ran; nothing runs on the conductor's
# machine. Each is Shellwords-parsed into an argv (no shell), and an unbalanced
# quote aborts the run naming the string.
#   test_cmd    — G4, the ship gate. Right before the irreversible deploy, ship
#                 reads CI's settled verdict for the QA-frozen SHA's tree (its own
#                 run, or a same-tree green credited from the accepted head) and
#                 aborts on anything but green.
#   qa_test_cmd — G3, the pre-QA gate. Prepare reads CI's verdict on
#                 origin/release before any QA deploy; red aborts prepare while
#                 every member is still `reviewed`.
# UNSET means the repo self-gates (its own deploy runs its suite) and the gate
# skips it. Never blank one to pass a red gate: that silently disarms it. The
# loud override is `bin/release ship --skip-test-gate --reason "…"`, which
# records a red gate SOP.
#
# WHAT TO REGISTER turns on whether the repo's DEPLOY runs the suite:
#   * It does (turf-monster's bin/deploy): qa_test_cmd is the integration subset,
#     `bin/rails test test/integration`, and test_cmd stays unset.
#   * It does not (git_push_heroku, github_actions): both commands are CI's FULL
#     suite, verbatim from the repo's ci.yml, because they are the last gate
#     before production. A subset here leaves every skipped tier ungated.
#     repos_test parses each repo's ci.yml and asserts the match.
#
# THE RAKE-PATH SHAPE IS LOAD-BEARING: `bin/rails db:test:prepare test
# test:system`. `bin/rails test` alone skips test/system, and
# `bin/rails test test:system` dies with `LoadError: cannot load such file --
# <root>/test:system`, because `test` is a rails command that reads the next
# word as a path. A leading rake task (`db:test:prepare`) routes the whole line
# through rake, where `test` and `test:system` are two tasks. Keep it first. An
# app without ActiveRecord has no `db:test:prepare`, so it splits its tiers
# across two CI jobs instead (dads-app).
#
# The Playwright e2e tier does not belong in either gate: it needs a booted
# server. Prepare's post-deploy `/up` wait against QA is that smoke.
#
# The ship workspace (Release::GateWorkspace, role `ship`) is a private detached
# worktree at the frozen SHA, under its own lock, with a test DB proved private
# before `db:test:prepare`. It serves the gem build, the consumer lock bump and
# a repo_script deploy, never a gate.
#
# gem fields:
#   version_file — the file in the gem repo that declares the version to publish.
#   gemspec      — the .gemspec `gem build` packages (default <repo>.gemspec).
#   build_cmd    — the human-readable build command; bin/release drives the
#                  build itself.
#
# cert fields (either section):
#   release_check — the repo's own declared gate command, spawned as a string.
#                   The pre-flight reader is section-blind:
#                   ReleaseRegistry.release_check_cmd flattens both sections, so
#                   any row that declares one gets bin/fast-check's whole-gate
#                   lane (turf-vault does). The publish readers are gems-only
#                   (bin/release.rb#gem_meta_for, bin/release.rb#self_gated_gem?,
#                   app/models/release/repos.rb#gem_meta), so on an `apps` row it
#                   cannot make a repo self-gated or publish it. For a gem it is
#                   also the pre-publish gate, run with `--build`. Name a script
#                   the repo owns; a `&&` chain here copies another repo's CI and
#                   drifts from it.
#   lint_lane     — `none` declares that the repo ships no rubocop. No script
#                   reads it; it stays as the reviewable statement of that fact.
# Both are DECLARED, never inferred: nothing probes a tree for a runner.
#
# The gem repos are checked out as siblings of this app
# (/Users/alex/projects/<repo>), resolved from the app root's parent, so run
# ship from a primary checkout, not a worktree.

# accepted_trigger_lint: true says the repo's own CI fails when `accepted` leaves
# its suite workflow's push branches, so `bin/release` skips its promote-time
# trigger refusal (refuse_blind_accepted!) for that repo. Set it only after
# reading the lint on the repo's origin/accepted; a repo without the key is still
# refused at promote. The lint files:
#   studio-engine, chain-ops   test/lib/ci_accepted_trigger_test.rb
#   solana-studio              test/ci_accepted_trigger_test.rb
#   mcritchie-studio, turf-monster, rolio   test/lib/ci_workflow_triggers_test.rb
#   mcritchie-industries       test/lib/ci_workflow_test.rb

gems:
  studio-engine:
    ladder: three-rung
    accepted_trigger_lint: true
    version_file: lib/studio/version.rb
    gemspec: studio-engine.gemspec
    release_check: bin/release-check
    build_cmd: bin/release-check --build
    # No rubocop: none in the Gemfile or gemspec, no .rubocop.yml. Its static gate
    # is `ruby -c` inside bin/release-check. Delete this line if it gains rubocop.
    lint_lane: none
  solana-studio:
    ladder: three-rung
    accepted_trigger_lint: true
    # A dedicated version file, not the gemspec: bin/dor-check refuses a PR that
    # edits version_file, so the gemspec stays editable through the normal cycle.
    version_file: lib/solana_studio/version.rb
    gemspec: solana-studio.gemspec
    release_check: bin/release-check
    build_cmd: bin/release-check --build
    # No rubocop anywhere in the tree, Gemfile, gemspec or lock; bin/release-check
    # is its static gate and what CI runs. Delete this line if it gains a linter.
    lint_lane: none

apps:
  mcritchie-studio:
    ladder: three-rung
    accepted_trigger_lint: true
    # The hub's deploy workflow runs no tests, so both gates name CI's full
    # `test` job suite, verbatim; repos_test holds them to ci.yml.
    test_cmd: bin/rails db:test:prepare test test:system
    qa_test_cmd: bin/rails db:test:prepare test test:system
    # QA deploys through qa-deploy.yml, dispatched by prepare.
    prod_deploy:
      strategy: github_actions
      workflow: prod-deploy.yml
      smoke_url: https://mcritchie.studio
  turf-monster:
    ladder: three-rung
    accepted_trigger_lint: true
    # bin/deploy runs the full suite before production, so test_cmd stays unset;
    # the integration tier gates the QA deploy.
    qa_test_cmd: bin/rails test test/integration
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
      # The app bin/deploy pushes to, so `bin/release ship --finalize-only` can
      # confirm a killed ship's deploy instead of re-running the suite.
      heroku_app: turf-monster-mainnet
      # Required beside heroku_app: deploy confirmation needs a /up probe, and a
      # repo_script row has no other URL. It adds no post-deploy smoke step.
      smoke_url: https://turfmonster.media
  turf-vault:
    # The Anchor program. Under `apps`, not `gems`: a gems row would publish it to
    # RubyGems, and it has no gemspec.
    ladder: three-rung
    #
    # ⛔ NO prod_deploy — a safety boundary. The program custodies real USDC and is
    # upgraded by hand through a Squads multisig (scripts/squad-upgrade.js, gated by
    # docs/MAINNET_LAUNCH.md). A conductor must never attempt that act, so ship
    # advances main and records no deploy target.
    #
    # ⛔ NO test_cmd, NO qa_test_cmd. Each names a suite CI ran, and its ci.yml runs
    # no Rails suite; its gate is `release_check` below. The QA exemption also
    # requires qa_test_cmd absent (repos_test checks both).
    #
    # QA-evidence exempt: QA does not apply (no dyno, no URL, no deploy), so no run
    # can produce QA evidence for it, and without this key every member naming it
    # holds at `reviewed`. The exemption is declared per repo so the guard stays
    # fail-closed for a repo whose QA env was merely forgotten. QA only: ship still
    # records its release -> main SHA. repos_test checks the declaration: an exempt
    # repo has no qa_test_cmd and no qa_environments.yml entry.
    qa_evidence: exempt
    #
    # Its ci.yml is named `CI` and runs on push to main, release and accepted with no
    # path filter, so Release::AcceptedCertification certifies it with no override.
    #
    # The repo-owned script that runs exactly ci.yml's lanes; turf-vault's
    # scripts/tests/release-check-covers-ci.test.js holds the parity, and
    # `bin/release-check --list` prints the lanes. Budget about 76s cold.
    release_check: bin/release-check
    #
    # No Ruby in the tree at all; JavaScript lints with prettier, which is not this lane.
    lint_lane: none
  rolio:
    # Archived; its GitHub remote no longer resolves for the agent identity, and it
    # has no `accepted` rung. `dormant` keeps it out of the conductor's repo list.
    ladder: dormant
    accepted_trigger_lint: true
    # Rails/SQLite, no studio-engine. git_push_heroku runs no tests, so both gates
    # name CI's full suite, verbatim (repos_test reads rolio's ci.yml at
    # origin/release), and the two strings stay equal.
    test_cmd: bin/rails db:test:prepare test test:system
    qa_test_cmd: bin/rails db:test:prepare test test:system
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/rolio-prod.git
      branch: main
      smoke_url: https://rolio-prod-82e96784b462.herokuapp.com
  mcritchie-industries:
    ladder: three-rung
    accepted_trigger_lint: true
    # Managed studio-engine satellite. git_push_heroku runs no tests, so both gates
    # name CI's full suite, verbatim (repos_test reads its ci.yml at origin/release),
    # and the two strings stay equal.
    test_cmd: bin/rails db:test:prepare test test:system
    qa_test_cmd: bin/rails db:test:prepare test test:system
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcritchie-industries.git
      branch: main
      smoke_url: https://www.mcritchie.industries
  cyvasse:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    # Managed studio-engine satellite (epic cyvasse-revival). Migrations ride the
    # Procfile's `release: bin/rails db:migrate`. A member's post_deploy_cmd is
    # skipped at QA and runs on `cyvasse` at ship.
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/cyvasse.git
      branch: main
      # The herokuapp host always resolves; production.rb leaves host
      # authorization off, so /up answers on it.
      smoke_url: https://cyvasse-614ed5f7e99d.herokuapp.com
    #
    # CI's `test` job suite, verbatim; the gate reads the whole workflow's verdict,
    # so the `static` and `javascript` jobs gate too.
    test_cmd: bin/rails db:test:prepare test test:system
    #
    # QA-evidence exempt on cost, by operator decision: no QA copy without a free
    # tier (the standalone-heroku profile's qa_decision in config/app_profiles.yml,
    # which repos_test checks). A change reaches production gated by CI and review
    # only. Unlike turf-vault's, this exemption is a choice, not an absence. QA only:
    # `shipped` still needs the release -> main record.
    qa_evidence: exempt
  dads-app:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    # Release-managed standalone (epic dads-app): a public photo slideshow at
    # greigmcritchie.com. No studio-engine, no database (Rails 8.1 without
    # ActiveRecord), so no migrations; one Eco dyno.
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/dads-app.git
      branch: main
      smoke_url: https://greigmcritchie.com
    #
    # CI's `test` job command, verbatim. No `db:test:prepare` (no ActiveRecord), so
    # the system tier runs in its own `system-test` job, and the gate reads CI's
    # whole verdict. repos_test holds both jobs. Never join them as
    # `bin/rails test test:system` (the rake-path note above).
    test_cmd: bin/rails test
    #
    # QA-evidence exempt on cost, by operator decision, as cyvasse: the profile's
    # qa_decision. Gated by CI and review only; QA only.
    qa_evidence: exempt
  # --- SHOWCASE APPS: prisoners-dilemma, weekly-lock, rantly, portfolio, 10and5,
  # search-position. Release-managed standalones registered as dads-app is: a
  # Heroku app `mcr-<repo>` on git_push_heroku, test_cmd = CI's `test` job
  # verbatim with the system tier in its own job (repos_test holds both), and
  # QA-evidence exempt under the standalone-heroku profile's qa_decision.
  # smoke_url is https://<repo>.mcritchie.studio once that host serves /up with a
  # valid certificate, the herokuapp host until then: ship smokes after the push,
  # so an unresolvable host aborts a live deploy.
  prisoners-dilemma:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-prisoners-dilemma.git
      branch: main
      smoke_url: https://prisoners-dilemma.mcritchie.studio
    test_cmd: bin/rails test
    qa_evidence: exempt
  weekly-lock:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-weekly-lock.git
      branch: main
      smoke_url: https://weekly-lock.mcritchie.studio
    test_cmd: bin/rails test
    qa_evidence: exempt
  rantly:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-rantly.git
      branch: main
      smoke_url: https://rantly.mcritchie.studio
    test_cmd: bin/rails test
    qa_evidence: exempt
  portfolio:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-portfolio.git
      branch: main
      smoke_url: https://portfolio.mcritchie.studio
    test_cmd: bin/rails test
    qa_evidence: exempt
  10and5:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-10and5.git
      branch: main
      smoke_url: https://mcr-10and5-eb8feab2def8.herokuapp.com
    test_cmd: bin/rails test
    qa_evidence: exempt
  search-position:
    profile: standalone-heroku # config/app_profiles.yml; repos_test.rb holds this entry to it
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/mcr-search-position.git
      branch: main
      smoke_url: https://mcr-search-position-3c91e0b95f46.herokuapp.com
    test_cmd: bin/rails test
    qa_evidence: exempt
  tax-studio:
    # No repo yet; the guard asserts no checkout exists, so `planned` expires the
    # day one does. Register its integration tier as qa_test_cmd then: a registered
    # command whose repo is missing aborts prepare.
    ladder: planned
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
  chain-ops:
    # No production app, so no prod_deploy and no test_cmd. To enroll, in order:
    # give it a real Heroku app and an adapter naming it, register a test_cmd, then
    # flip the ladder. `blocked` only stops `bin/release init` creating rungs;
    # membership is by task, so a chain-ops task that reaches `reviewed` still
    # rides. Ship probes every repo_script command at the frozen SHA before pushing
    # any ref, so a missing command aborts with nothing moved. qa_test_cmd stays
    # unset until test/integration has tests.
    ladder: blocked
    accepted_trigger_lint: true
  moms-app:
    # Registered by bin/register-app on profile standalone-heroku. The contract, the
    # QA decision and how to leave the profile: config/app_profiles.yml and the
    # app-deploy-standard SOP. To change it, edit it by hand; repos_test.rb
    # fails if this entry drifts from the profile.
    # Consumes studio-engine: a release that publishes the engine bumps this app's
    # lock to the published version (bin/release.rb#bump_consumer_locks_for_qa).
    profile: standalone-heroku
    ladder: three-rung
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/moms-app.git
      branch: main
      smoke_url: https://karenmcritchie.com
    test_cmd: bin/rails db:test:prepare test
    qa_evidence: exempt
