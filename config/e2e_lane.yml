# THE E2E LANE'S CONTRACT — what the green `playwright` check actually covers.
#
# The lane's arithmetic is
#
#     executed == committed specs - quarantined specs
#
# and BOTH counts are COMPUTED from the spec files under e2e/ (bin/lib/e2e_spec_census.rb),
# so adding or deleting a spec moves nothing by hand. Two halves read that census:
#
#   · bin/e2e-executed-set-check              THE RUNTIME GATE. Reads Playwright's OWN
#                                             report after the lane runs and asserts it
#                                             EXECUTED exactly the census's `executed` set.
#   · test/lib/e2e_quarantine_ratchet_test.rb THE STATIC GUARD. Asserts every committed spec
#                                             is a bare declaration (no modifier can change
#                                             which specs run), so the census is honest.
#
# WHY THE GATE READS THE RECEIPT. A source count says how many specs are DECLARED; it cannot
# say how many RAN. A runtime skip (`testInfo.skip()`), a widened CI exclusion, an
# `--only-changed`, a file that never got collected: each is a different spelling of one
# event, a spec left the executed set, and each shows up in the receipt as the same
# arithmetic failure.
#
# This file holds what the tree cannot compute: the quarantine ceiling, its tag and the
# shard count. `quarantined` is RATCHETED against its value on `origin/release`
# (test/lib/e2e_quarantine_ratchet_test.rb), the one copy of the number a feature branch's
# diff cannot move, so raising it is a red build and a conversation rather than a line
# nobody reads.
---
# The specs already RED on an untouched `release` checkout the day this lane was
# switched on — tagged ` @quarantine` in their title and excluded by the CI command. A hole
# with a name and a ticket: /tasks/repair-rotted-e2e-specs.
#
# THIS NUMBER MAY ONLY FALL, AND THAT IS ENFORCED — not merely requested here.
# test/lib/e2e_quarantine_ratchet_test.rb compares this value against its value on
# `origin/release` and goes RED if it is higher. That comparison is the whole point: it reads
# a copy of the number that YOUR edit cannot reach. The first version of the guard compared
# this line to... this line, and review proved what that is worth by tagging a 19th spec,
# bumping this number to 19, and watching every guard in the repo AND the runtime receipt go
# green over a suite that had just lost a spec. A ratchet whose reference value moves with the
# thing it restrains is a PIN.
#
# Repair a spec: drop its tag and lower `quarantined` in the same commit; the guard names the
# number. Tagging one MORE spec to green a PR is the exact self-declaration
# disease this whole lane exists to cure, and it is now a red build rather than a red face.
# 18 -> 15 on 2026-08-18 (/tasks/repair-quarantined-e2e-clusters): three deployments_live
# specs REPAIRED, not re-tagged. Root cause was never the specs - the Deployments board
# collapses its three upstream lanes below 1400px, and Playwright configures no viewport,
# so Chromium's 1280px default hid every card they wait on. One test.use({viewport}) line
# revived them. The other four in that file fail for DIFFERENT reasons (three are
# Building-column/blocked-card behaviour, one is the review ticker) and stay tagged.
# 15 -> 12 on 2026-08-20 (/tasks/untag-repaired-block-specs): the three live-block specs in
# deployments_live.spec.js are REPAIRED and now RUN. They needed both halves, which is why they
# stayed tagged through two earlier passes: the spec-side rot (a collapsed lane below 1400px, a
# retired stage:blocked payload, and an assertion on data-glow when the block marker is
# data-stage-glow) fixed in /tasks/repair-remaining-quarantined-specs, AND a PRODUCT gap —
# blocking broadcast nothing at all — fixed in /tasks/broadcast-block-to-board. Both are on main,
# so this un-tags rather than re-tags. Verified before lowering: --grep-invert @quarantine over
# the file is 12/12 green, and the ONE remaining failure is the still-tagged review-ticker spec.
# 12 -> 10 on 2026-08-21 (/tasks/clear-the-quarantine-backlog): two heartbeat_feedback specs
# REPAIRED. Cause was not the specs' logic — they loaded the bare /xan/heartbeat and relied on
# HeartbeatController#latest_session_id, i.e. whichever session owns the newest AgentAction. The
# seed grew newer fixtures ('sess-test-runs'), which now win that default and render ZERO spans,
# so every locator timed out on a page that never had the rows. Pinning
# ?session_id=e2e-heartbeat-0001 (as e2e/alex_heartbeat.spec.js already did) restores them.
# Measured: bare path = 0 heartbeat-event nodes; pinned = 3 (Explore/Verify/Workflow).
# The OTHER two in that file stay tagged on purpose — they assert a design that was REVERSED
# (span grading moved out of the drawer and back inline), so they want deleting or rewriting,
# which is a coverage decision rather than a repair. Annotated in the file.
quarantined: 10

# The ONE sanctioned exclusion. bin/e2e-executed-set-check refuses any executed spec whose
# title carries this tag, and test/lib/ci_workflow_triggers_test.rb pins the CI command to
# this EXACT value — exactly one `--grep-invert`, and nothing else in it. Widening the filter
# to `@quarantine|board` silently drops 8 more specs; that was a live hole until this line.
quarantine_tag: "@quarantine"

# The shard matrix in .github/workflows/ci.yml. The shards UNION to the whole suite, so this
# is not a narrowing — but a shard that goes EMPTY exits 0 SILENTLY (sharding suppresses
# Playwright's own "No tests found" guard), so the floor `executed >= shards` (computed, see the header) is load-bearing
# and the runtime gate refuses a run that is missing any shard's report.
shards: 3
