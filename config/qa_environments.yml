# QA environment registry for stable review servers.
#
# These are intentionally separate from config/satellites.yml:
# satellites.yml describes products; this file describes deploy targets used by
# Avi/Steffon/release-conductor sessions before production rollout.
#
# Apps listed here may not exist yet on Heroku. Use:
#   bin/qa-server list
#   bin/qa-server plan <app>
#   bin/qa-server provision <app> --yes
#   bin/qa-server status <app>
#
# Never put secret values in this file. Put secret names/purposes here and pull
# values through 1Password/Heroku during approved provisioning.

qa_environments:
  mcritchie-studio:
    display_name: McRitchie Studio QA
    repo: mcritchie-studio
    heroku_app: mcritchie-studio-qa
    heroku_domain: mcritchie-studio-qa-26cedb6e8fdc.herokuapp.com
    qa_url: https://qa.mcritchie.studio
    custom_domains:
      - qa.mcritchie.studio
    production_app: mcritchie-studio
    production_url: https://app.mcritchie.studio
    deploy_provider: heroku
    addons:
      - heroku-postgresql:essential-0
    dynos:
      web: 1
      worker: 1
    safety_profile: hub-qa
    required_config:
      APP_HOST: qa.mcritchie.studio
      MAILER_HOST: qa.mcritchie.studio
      DYNO_HOST: "${HEROKU_HOST}"
      QA_ENV: "true"
      MAIL_TRANSPORT: resend
      RESEND_MAILER_FROM: "McRitchie QA <team@mcritchie.studio>"
    required_secrets:
      - RAILS_MASTER_KEY
      - RESEND_API_KEY

  turf-monster:
    display_name: Turf Monster QA
    repo: turf-monster
    heroku_app: turf-monster-qa
    heroku_domain: turf-monster-qa-93e18f3ae318.herokuapp.com
    qa_url: https://qa.turfmonster.media
    custom_domains:
      - qa.turfmonster.media
    production_app: turf-monster-mainnet
    production_url: https://turfmonster.media
    deploy_provider: heroku
    addons:
      - heroku-postgresql:essential-0
      - heroku-redis:mini
    dynos:
      web: 1
      worker: 1
    safety_profile: devnet-no-real-money
    required_config:
      APP_HOST: qa.turfmonster.media
      MAILER_HOST: qa.turfmonster.media
      DYNO_HOST: "${HEROKU_HOST}"
      QA_ENV: "true"
      MAIL_TRANSPORT: resend
      RESEND_MAILER_FROM: "Turf Monster QA <team@mcritchie.studio>"
      PAYMENT_PROVIDER: none
      ENABLE_CDP_RAMP: "false"
      SOLANA_NETWORK: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_PROGRAM_ID: EQGFJAcABtDb6VXtiijTjZ6cE2UqdvhnqJvoharJbpMJ
    derived_config:
      EXPECTED_IDL_HASH: sha256:config/turf_vault.idl.json
    required_secrets:
      - RAILS_MASTER_KEY
      - RESEND_API_KEY
      - MANAGED_WALLET_ENCRYPTION_KEY
      - SOLANA_ADMIN_KEY

  rolio:
    display_name: Rolio QA
    repo: rolio
    heroku_app: rolio-qa
    heroku_domain: rolio-qa-58beede9dc0b.herokuapp.com
    qa_url: https://rolio-qa-58beede9dc0b.herokuapp.com
    custom_domains: []
    production_app: rolio-prod
    production_url: https://rolio-prod-82e96784b462.herokuapp.com
    deploy_provider: heroku
    addons: []
    dynos:
      web: 1
    safety_profile: demo-qa-ephemeral-sqlite
    required_config:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SQLITE_DATABASE: storage/production.sqlite3
      QA_ENV: "true"
    required_secrets:
      - SECRET_KEY_BASE
