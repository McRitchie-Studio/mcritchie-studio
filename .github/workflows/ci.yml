name: CI

on:
  pull_request:
  # `release` is here for the same reason `main` is: it is a SHIPPABLE TIP, and every
  # shippable tip earns its own clean-env verdict.
  #
  # `pull_request` only ever certifies a PR's own head. The sweep (`bin/release
  # prepare`) then MERGES several approved PRs into `release`, producing a NEW
  # merge-commit SHA — a combination of changes that, individually green, no CI run
  # has ever executed together. That merge commit is the exact artifact QA deploys and
  # `bin/release ship` fast-forwards into `main`. Without this trigger it is the one
  # commit in the pipeline CI never runs: the local G3 gate is its ONLY verdict, and a
  # local gate has no clean-env cross-check.
  #
  # Every job runs on a release push — no lane is skipped for cost. A partial verdict on
  # the release candidate is exactly the gap this closes.
  #
  # `accepted` IS THE SAME ARGUMENT ONE RUNG EARLIER, and it was the hole. Review
  # merges several approved PRs onto `accepted`, producing exactly the kind of
  # combination the paragraph above describes — individually green, never executed
  # together — and nothing certified it. The gap surfaced only at the release push,
  # AFTER the sweep had promoted, where unwinding it means unwinding a release. Here
  # the offender is still cheap to find, and the sweep can refuse to promote a red
  # `accepted` before it moves anything (Ci::BranchGate).
  push:
    branches: [ main, release, accepted ]

# NO `concurrency:` BLOCK — deliberately, and it is tested (ci_workflow_triggers_test:
# no_concurrency_block_can_cancel_a_release_run).
#
# The obvious optimisation here is a concurrency group on `accepted` so a burst of
# merges collapses into one run of the final tree, since every landing otherwise costs
# a full ~10-minute suite. That was written, and it was WRONG for a reason worth
# recording rather than rediscovering:
#
# a cancelled run carries the conclusion `cancelled`, and CiStatus folds `cancelled`
# as RED. Every reader of this branch's health is SHA-ADDRESSED — Ci::BranchGate
# resolves the newest ingested run for the branch and folds the runs for THAT sha — so
# a superseded run that lost a race is indistinguishable from a genuine failure. The
# sweep's own `accepted` guard would then refuse to promote a perfectly healthy
# branch. Cheaper CI is not worth a gate that cries wolf; a false refusal wedges the
# release lane far more often than the runs it saves.
#
# Every SHA keeps its own run to completion. If the CI cost becomes the binding
# constraint, the answer is a faster suite (test-steward-grooms-suite) or a merge
# queue that batches BEFORE the merge — not cancellation after it.

jobs:
  # THE STATIC LANE — brakeman, importmap audit and rubocop in ONE job.
  #
  # These were three jobs (`scan_ruby`, `scan_js`, `lint`) doing identical setup and then
  # one command each. Measured on run 32338350375: 37s, 22s and 52s of work behind ~20s of
  # setup APIECE. Merged, the setup is paid once and the lane costs ~131s — which is LONGER
  # than the 1.1min the slowest of the three took alone, and that is fine: the critical
  # path is the `rails` shard at ~3.5min, and a 2.2min lane running beside it costs the PR
  # nothing.
  #
  # WHAT IT BUYS IS NOT SECONDS, IT IS SLOTS, and the slots are the point. The account's
  # concurrency ceiling is ~20 jobs; this workflow ran 14. config/rails_lane.yml said
  # plainly that raising the shard count was gated on headroom rather than appetite —
  # "a shard that waits for a runner is slower than no shard". Three jobs becoming one
  # frees two slots and takes the workflow from 14 jobs to 12 at an unchanged critical
  # path. Those slots were originally freed to pay for shards 5 and 6; that raise was then
  # MEASURED at 3.6min against 4 shards' 3.7min — nothing — because LPT gives each of the
  # heaviest files its own bucket and a shard cannot finish before its heaviest FILE. The
  # shard count went back to 4 (config/rails_lane.yml carries the numbers); the slots stay
  # freed, which is worth having on its own with two PRs in flight against a ~20-job cap.
  #
  # `if: always()` ON THE SECOND AND THIRD CHECKS is load-bearing. Merging three jobs into
  # one would otherwise mean the first failure hides the other two — a brakeman finding
  # would stop you ever seeing the rubocop offences in the same run, and you would fix,
  # push, and wait ~3 minutes to discover the next one. With always(), all three run and
  # the job still reports RED if any failed, so a single run tells you everything that is
  # wrong. It is not an opt-out: always() cannot EXCLUDE a step, only force one, which is
  # why test/lib/ci_workflow_triggers_test.rb permits it and refuses every event-context
  # condition.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for security vulnerabilities in JavaScript dependencies
        if: always()
        run: bin/importmap audit

      - name: Lint code for consistent style
        if: always()
        run: bin/rubocop -f github

  island_animator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/island-background-animator/uv.lock

      - name: Install FFmpeg
        # The fetch is BOUNDED and RETRIED — see .github/scripts/apt-retry for the
        # incident, the measured budgets, and why the loop lives in a script rather
        # than inline here (short version: an inline `"$budget"` in a command
        # position makes this step opaque to bin/lib/ci_test_command.rb, the cert
        # that must be able to SEE every unit CI runs).
        #
        # This bound is the backstop, not the mechanism: the script's own escalating
        # budgets total ~22 minutes, and 25 sits above that and well below the
        # 45-minute job bound, so a step that blows through its retries still fails
        # long before it can take the whole job down with it.
        timeout-minutes: 25
        run: .github/scripts/apt-retry ffmpeg

      - name: Check Island Background Animator
        run: tools/island-background-animator/bin/check

      - name: Check media dependencies
        run: bin/island-background doctor

  # THE `e2e` TIER'S LANE. Until 2026-07-13 this job did not exist, and `e2e` — demanded
  # by config/feature_shapes.yml of the `ui+db` and `onchain-vertical` shapes — was run
  # by NOTHING: not this workflow, not bin/fast-check, not bin/full-suite-check, not the
  # G3/G4 release gates. The tier was satisfied entirely by a builder typing "[e2e] ..."
  # into devops.checks_run, which bin/dor-check credited on sight. A gate that demands
  # evidence it never collects and takes a self-declaration instead is the exact disease
  # of the 2026-07-12 wave.
  #
  # WHAT THE UNRUN SUITE HAD BECOME, measured the day it was switched on: 18 of 69 specs
  # RED on an untouched `release` checkout. Nobody had run it in long enough for a
  # quarter of it to rot — the board grew agent/app filters that hide the very cards the
  # live specs wait on, and a seeded fixture string quietly vanished. That is what an
  # uncollected tier turns into; it does not stay honest and idle. Pinned by
  # test/lib/feature_shape_tiers_test.rb, which fails if a shape ever again demands a
  # tier no runner executes.
  #
  # COST, AND WHY IT IS AFFORDABLE HERE AND NOWHERE ELSE. Measured 2026-07-13,
  # single-worker: the specs this lane actually runs take ~1.1 min (timed at the 51 the lane
  # ran that day; it runs 52 now — release added a healthy pokedex spec while this PR was in
  # review). The FULL suite clocks ~4.7 min, but ~3.6 min of that is the 18 rotted specs each
  # burning a 5s assertion timeout before failing — a number that shrinks when they are
  # repaired, not a number to plan around.
  #
  # Even at 1.1 min it does NOT belong in bin/fast-check: that is the whole ~1 min budget
  # of the builder's cert, doubled, on every commit. A cert that slow is a cert people
  # route around, which is the disease again, wearing a lab coat. As a PARALLEL CI job
  # sharded 3 ways it is ~25s of tests + ~1 min of setup per shard — comfortably inside
  # the existing ~5 min `test` + `test:system` lane it runs alongside, so the pipeline's
  # critical path grows by ZERO. That number is the whole argument for collecting it here
  # rather than in the cert, and for collecting it at all.
  #
  # SHARDING: workers:1 is forced in playwright.config.js, so parallelism has to come
  # from separate runners. Each shard is its own stack (own postgres service, own test
  # server booted by Playwright's webServer), so nothing is shared across shards and the
  # serial in-shard model is preserved.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        # The fetch is BOUNDED and RETRIED — see .github/scripts/apt-retry for the
        # incident, the measured budgets, and why the loop lives in a script rather
        # than inline here (short version: an inline `"$budget"` in a command
        # position makes this step opaque to bin/lib/ci_test_command.rb, the cert
        # that must be able to SEE every unit CI runs).
        #
        # This bound is the backstop, not the mechanism: the script's own escalating
        # budgets total ~22 minutes, and 25 sits above that and well below the
        # 45-minute job bound, so a step that blows through its retries still fails
        # long before it can take the whole job down with it.
        timeout-minutes: 25
        run: .github/scripts/apt-retry curl libjemalloc2 libvips postgresql-client

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # CACHE THE BROWSER, keyed on the resolved Playwright version. Measured on run
      # 32338350375 this step cost 14s per shard — three shards, every run, re-downloading
      # a Chromium that had not changed. The key comes from package-lock.json, so a
      # Playwright bump invalidates it automatically and there is nothing to remember.
      #
      # WHAT IT DOES NOT DO, said plainly so the next measurement is not a surprise: the
      # FIRST run on any branch is a MISS — it populates the cache rather than using one —
      # and GitHub only shares a cache with runs on the same branch or the DEFAULT branch.
      # So the saving appears once this reaches `main`, not on the PR that adds it.
      #
      # `--with-deps` still runs on a hit, deliberately: the cache holds the browser, not
      # the apt libraries headless Chromium needs to launch, and a restored browser that
      # cannot start reads as a mysterious lane failure rather than a missing package.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's own webServer (playwright.config.js) boots the test server for this
      # shard: db:test:prepare, seed, then `rails server -e test` with CABLE_ADAPTER=async
      # so the live-update specs get REAL in-process ActionCable delivery to the browser.
      # Nothing to boot here.
      #
      # --grep-invert @quarantine EXCLUDES the 18 specs that were already red when this
      # lane was first switched on. Stating the hole plainly, as turf-monster's ci.yml
      # does for its @devnet exclusion: those specs are NOT covered by this job today.
      # The exclusion buys the OTHER (executed) specs a real lane now instead of holding all of
      # them hostage to a repair, and it fails safe — a rotted suite wired in red would
      # paint CI red for every PR in flight. It is a debt with a name and a ticket:
      # /tasks/repair-quarantined-e2e-clusters (the older repair-rotted-e2e-specs was
      # archived while every spec was still tagged). When that lands, DELETE this flag.
      #
      # The hole is BOUNDED, not merely deplored: test/lib/e2e_quarantine_ratchet_test.rb
      # ratchets the @quarantine count (ceiling 18, may only fall) — against the value on
      # `origin/release`, NOT against the copy in the PR's own tree, because a ceiling that
      # moves when the author edits it bounds nothing. (Measured: with the earlier version,
      # tagging a 19th spec and bumping the contract went green on every guard AND on the
      # receipt.) Tagging one more spec to green a PR is now a red build. The norm in
      # playwright.config.js asks you not to; the ratchet is what makes it a gate.
      #
      # THREE GUARDS, AND THE THIRD IS THE ONLY ONE THAT GENERALIZES.
      #   1. THE COMMAND. test/lib/ci_workflow_triggers_test.rb asserts this lane runs the
      #      WHOLE suite unconditionally — no job/step `if:`, and its flags are DEFAULT-DENY
      #      (only --shard, --grep-invert and --reporter cannot SHRINK THE SET — and note
      #      --reporter is NOT "inert": it EMITS the receipt in guard 3, and is separately
      #      pinned to keep emitting it; everything else, incl.
      #      flags Playwright ships next year, is refused BY NAME). The one sanctioned
      #      exclusion is value-pinned: exactly one --grep-invert, and its value must be
      #      exactly `@quarantine`. Widening it to `@quarantine|board` — dropping 8 specs to
      #      43, every guard formerly green — is now a test failure.
      #   2. THE DECLARED SET. test/lib/e2e_quarantine_ratchet_test.rb reads the committed
      #      specs: total_specs − quarantined == executed, and every selection modifier is
      #      refused on ANY receiver. The NUMBERS live in config/e2e_lane.yml and are not
      #      repeated here — every copy of them in prose has rotted within days.
      #   3. THE EXECUTED SET — the receipt, below. Guards 1 and 2 read the SOURCE, and a
      #      source-level guard can only refuse the spellings someone thought to refuse.
      #      Three rounds of review proved that by finding a fourth, every time: `.only`
      #      (lane 51 -> 1, three shards GREEN because an empty shard exits 0), then
      #      `.skip`/`.fixme`, then `testInfo.skip()` on a receiver the regex never watched,
      #      then a widened `--grep-invert` on a flag nothing pinned. So the lane now emits
      #      a JSON receipt per shard and `e2e_executed_set` asserts what it ACTUALLY RAN —
      #      `executed` specs, 0 skipped, every shard's report present. A spec that leaves the
      #      lane by ANY route, on ANY axis, lands on the same line of arithmetic.
      - name: Run Playwright e2e suite
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # The receipt this shard will be judged on. `list` keeps the human-readable log.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-report-shard-${{ matrix.shard }}.json
        run: npx playwright test --grep-invert @quarantine --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,json

      # ALWAYS, not `if: failure()`. A FAILING spec still ran — the executed-set gate must see
      # its receipt to count it. Uploading only on failure would mean the gate could only ever
      # audit the runs that were already red.
      - name: Upload this shard's executed-set receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/e2e-report-shard-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Keep the Playwright report from a failed shard
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/playwright-report
          if-no-files-found: ignore

  # THE EXECUTED-SET GATE. The `playwright` job above can prove its specs PASSED; it cannot
  # prove it RAN THEM ALL — no test lane can answer that about itself, which is exactly the
  # blind spot every escape hatch in this PR's review history lived in. This job reads the
  # shards' own JSON receipts and asserts the set they executed against config/e2e_lane.yml.
  #
  # `if: always()` is LOAD-BEARING and is the ONLY condition this job may ever carry. Without
  # it, a red `playwright` job SKIPS this one — and a skipped required check does not report
  # failure, so the one gate that would have said "the lane ran fewer specs than it claims"
  # would go quiet
  # in precisely the runs where it matters. `always()` cannot exclude the lane; every other
  # condition can, and test/lib/ci_workflow_triggers_test.rb refuses every other condition.
  e2e_executed_set:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: playwright
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Download every shard's receipt
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-shard-*
          path: e2e-reports
          merge-multiple: true

      # Stdlib only (json + yaml) — no bundle install, so this gate stays a few seconds and
      # cannot itself be broken by a dependency problem in the app it is auditing.
      - name: Assert the lane executed exactly the specs it claims to
        run: bin/e2e-executed-set-check e2e-reports

  # ================= THE RAILS LANE =================
  #
  # THE SHARDED RAILS SUITE. Until 2026-08-20 this was ONE job — `bin/rails
  # db:test:prepare test test:system` — and it was the whole reason a hub PR waited ten
  # minutes. Measured on run 32329490149, a GREEN run: the job took 534s, of which 411s
  # was `bin/rails test` (6,828 tests, 4 workers on a 4-core runner), 13s was
  # `test:system`, and 91s was setup. Every other job in this workflow was finished
  # inside 3.2 minutes and then sat idle for another 5.7.
  #
  # WHAT LICENSES SPENDING FOUR RUNNERS ON IT. This repository is PUBLIC, so GitHub bills
  # nothing for its Actions minutes. The old shape was optimising a resource that is
  # free (runner-minutes) at the cost of the one that is not (the wall-clock a builder,
  # a review sweep, and the G3 gate each wait on, three times per task). Sharding trades
  # the free one for the scarce one.
  #
  # WHY FOUR AND NOT MORE lives in config/rails_lane.yml next to the number, so there is
  # one place to read it and one place to change it. `strategy.job-total` supplies the
  # denominator, and bin/ci-shard ABORTS if the matrix and the contract disagree.
  #
  # NO CHROME HERE. The browser belongs to the `system` job below — 13 tests that used
  # to make this lane pay for a Chrome install and a chromedriver-eviction dance on
  # every run, and would now make FOUR runners pay for it.
  #
  # THE UNION IS NOT ASSUMED. Four green shards over four empty buckets look exactly
  # like four green shards over the whole suite, which is why `rails_executed_set` below
  # is a separate, unconditional job rather than a claim in this comment.
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # fetch-depth: 0 IS LOAD-BEARING ON EVERY SHARD — do not "optimize" it back to the
      # default, and do not try to put it on only the shard that needs it.
      #
      # test/lib/e2e_quarantine_ratchet_test.rb ratchets the @quarantine ceiling against
      # its value on `origin/release` — the one number a PR's own diff cannot move.
      # actions/checkout defaults to a depth-1 fetch of the head SHA ALONE, which leaves
      # `origin/release` unresolvable, and a ratchet that cannot see its baseline cannot
      # certify monotonicity. It FAILS CLOSED on a missing baseline, so deleting this
      # line turns a shard red and says why.
      #
      # WHICH shard carries that file is decided by bin/lib/test_shard.rb's bin-packing
      # and moves whenever a timing changes — so "the shard that needs it" is not a
      # stable thing to point at. Every shard gets the full history. It costs a few
      # seconds; guessing costs a red build nobody can reproduce.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packages
        # The fetch is BOUNDED and RETRIED — see .github/scripts/apt-retry for the
        # incident, the measured budgets, and why the loop lives in a script rather
        # than inline here (short version: an inline `"$budget"` in a command
        # position makes this step opaque to bin/lib/ci_test_command.rb, the cert
        # that must be able to SEE every unit CI runs).
        #
        # This bound is the backstop, not the mechanism: the script's own escalating
        # budgets total ~22 minutes, and 25 sits above that and well below the
        # 45-minute job bound, so a step that blows through its retries still fails
        # long before it can take the whole job down with it.
        #
        # `libjemalloc2` is deliberately absent from THIS list where the other jobs
        # carry it: it is a PRODUCTION allocator this repo LD_PRELOADs in the
        # Dockerfile, and nothing on the test path references it. `curl`,
        # `postgresql-client` and `libvips` all stay — measured, not assumed:
        # test/commands/agent_worktree_test.rb mints a real per-run Postgres database
        # and bin/lib/cert_orphan_guard.rb shells `psql`, and libvips is required
        # outright by image_processing + Active Storage's boot-time
        # Vips.block_untrusted call.
        timeout-minutes: 25
        run: .github/scripts/apt-retry curl libvips postgresql-client

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # ONE COMMAND, and it is the whole lane for this shard: bin/ci-shard prepares the
      # database and the Tailwind build, runs the files this shard owns, and writes the
      # receipt `rails_executed_set` will judge it on. It refuses to run if the matrix
      # and config/rails_lane.yml disagree about the shard count, if its bucket is empty,
      # or if the suite finished without producing a receipt.
      #
      # `--shard=` RATHER THAN A BARE `1/4` IS DELIBERATE, and it is the same reason the
      # `playwright` job writes `--shard=${{ … }}`. bin/lib/ci_test_command.rb refuses a
      # step that hands a BARE interpolated token to a command it has not proven inert,
      # because such a token might BE the command. Attached to a flag, the interpolation
      # is unambiguously a value. See the header of bin/ci-shard.
      - name: Run this shard of the Rails suite
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          CI_RECEIPT_OUT: ${{ github.workspace }}/rails-report-shard-${{ matrix.shard }}.json
        run: bin/ci-shard --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # ALWAYS, not `if: failure()`. A FAILING test still RAN — the executed-set gate must
      # see its receipt to count it. Uploading only on failure would mean the gate could
      # audit only the runs that were already red.
      - name: Upload this shard's executed-set receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-report-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/rails-report-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  # THE EXECUTED-SET GATE. The `rails` shards above can prove their tests PASSED; they
  # cannot prove they RAN THEM ALL — no test lane can answer that about itself, and
  # sharding makes the question sharper rather than softer. This job reads the shards'
  # own receipts and asserts the executed set against the COMMITTED TREE (it re-globs the
  # repo; it does not ask the planner what it meant to run).
  #
  # `if: always()` is LOAD-BEARING and is the ONLY condition this job may ever carry.
  # Without it, a red `rails` shard SKIPS this job — and a skipped required check does
  # not report failure, so the one gate that would say "the lane ran fewer files than it
  # claims" would go quiet in precisely the runs where it matters. `always()` cannot
  # exclude the lane; every other condition can, and test/lib/ci_workflow_triggers_test.rb
  # refuses every other condition.
  #
  # `bundler-cache: false` because the gate is stdlib-only (json + yaml). It audits the
  # suite, so it must not be breakable by a dependency problem in the thing it audits.
  rails_executed_set:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: rails
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Download every shard's receipt
        uses: actions/download-artifact@v4
        with:
          pattern: rails-report-shard-*
          path: rails-reports
          merge-multiple: true

      - name: Assert the lane executed exactly the files it claims to
        run: bin/rails-executed-set-check rails-reports

  # THE SYSTEM-TEST LANE. 13 Capybara tests, ~13s of running, and the only thing in this
  # workflow that needs a real Chrome. It used to ride inside the monolithic `test` job,
  # where it charged the critical path for the Chrome install and the chromedriver
  # eviction below; sharding would have charged FOUR runners for it. Its own job costs
  # about 84s and runs concurrently with everything else, so it costs the PR nothing.
  #
  # config/rails_lane.yml EXCLUDES test/system from the sharded lane, and
  # bin/rails-executed-set-check therefore does not expect those files in the receipts —
  # the two halves of that split are pinned together by test/lib/rails_lane_contract_test.rb.
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # CHECKOUT FIRST — .github/scripts/apt-retry is a file in THIS repo, so the apt
      # step below cannot run before the tree exists. Ordering, not preference.
      #
      # `fetch-depth: 0` here is INHERITED, not required, and saying so beats leaving the
      # next reader to guess. The `rails` shards need full history because
      # test/lib/e2e_quarantine_ratchet_test.rb reads its baseline from `origin/release`
      # and fails closed without it — the comment that used to sit here said exactly that,
      # and it stopped being true of THIS lane the moment the suite was split: `system`
      # runs test/system only, which reads no git history at all. It is kept because it is
      # what the monolithic `test` job this lane was split out of already did: a few
      # seconds on a job that is not the critical path, against the risk of finding out
      # the hard way that something in boot wanted it. Measure that nothing does, and
      # delete it.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packages
        # The fetch is BOUNDED and RETRIED — see .github/scripts/apt-retry for the
        # incident, the measured budgets, and why the loop lives in a script rather
        # than inline here (short version: an inline `"$budget"` in a command
        # position makes this step opaque to bin/lib/ci_test_command.rb, the cert
        # that must be able to SEE every unit CI runs).
        #
        # This bound is the backstop, not the mechanism: the script's own escalating
        # budgets total ~22 minutes, and 25 sits above that and well below the
        # 45-minute job bound, so a step that blows through its retries still fails
        # long before it can take the whole job down with it.
        #
        # `libjemalloc2` is deliberately absent from THIS list where the other jobs
        # carry it: it is a PRODUCTION allocator this repo LD_PRELOADs in the
        # Dockerfile, and nothing on the test path references it. `curl`,
        # `postgresql-client` and `libvips` all stay — measured, not assumed:
        # test/commands/agent_worktree_test.rb mints a real per-run Postgres database
        # and bin/lib/cert_orphan_guard.rb shells `psql`, and libvips is required
        # outright by image_processing + Active Storage's boot-time
        # Vips.block_untrusted call.
        timeout-minutes: 25
        run: .github/scripts/apt-retry curl libvips postgresql-client

      # System-test lane browser. Install Chrome via Chrome for Testing, then let
      # Selenium Manager (bundled in selenium-webdriver 4.32) fetch the EXACTLY
      # matched chromedriver at runtime. Do NOT let setup-chrome install its own.
      #
      # Why `install-chromedriver: true` skews: `chrome-version: stable` and
      # `install-chromedriver: true` resolve chrome-stable and chromedriver-stable
      # INDEPENDENTLY. During Chrome-for-Testing's publish-lag window they land on
      # DIFFERENT majors (observed on run 28823528715: Chrome 149.0.7827.200 +
      # chromedriver 150.0.7871.46). Selenium Manager PREFERS a driver already on
      # PATH -- on a major mismatch it only WARNS ("advised to delete the driver in
      # PATH and retry"), then uses it anyway -> SessionNotCreatedError, failing
      # `test:system`. `stable` does NOT guarantee a matched chrome/driver pair.
      #
      # Fix: install-chromedriver:false leaves NO driver on PATH, so Selenium
      # Manager resolves the driver that matches the installed Chrome from the CfT
      # known-good manifest (e.g. chrome 149.0.7827.200 -> chromedriver
      # 149.0.7827.155). Self-healing across Chrome bumps -- nothing to pin/maintain.
      # The eviction step below removes any chromedriver preinstalled on the runner
      # image that would otherwise shadow Selenium Manager's matched pick.
      - name: Install Chrome (Chrome for Testing), no bundled chromedriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: false
          install-dependencies: true

      - name: Evict any chromedriver on PATH so Selenium Manager fetches a matched one
        run: |
          for bin in $(which -a chromedriver 2>/dev/null); do sudo rm -f "$bin"; done
          sudo rm -f /usr/local/bin/chromedriver /usr/bin/chromedriver || true
          echo "chromedriver remaining on PATH: $(which chromedriver 2>/dev/null || echo none)"

      - name: Await RubyGems propagation for locked gems
        run: .github/scripts/await-gem-propagation.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run system tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
