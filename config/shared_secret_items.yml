# SHARED SECRET ITEMS: long-lived 1Password fields that the secret cache serves
# to every soul, so a read costs 1Password nothing until the copy expires. NAMES
# AND METADATA ONLY, never a value. Read by bin/lib/secret_cache.rb
# (SecretCache.shared_item_entries); doc: docs/agents/modules/secret-cache.md,
# section "Shared items".
#
# WHY (Alex McRitchie, 2026-11-09; task secret-silos-phase-two). Each soul reads
# its own cached secrets, and 1Password is the fallback. These fields are not one
# soul's: the Discord webhooks are read by hand in any session, the R2 backup keys
# by Steffon's backup and Mack's restore drill, and the Google service account by
# every Drive and Gmail script. bin/op-reads named them (7 days to 2026-11-09):
# workspace-credentials about 60 reads, agents-backup 36, discord.webhooks 26,
# r2.mcritchie-agents-backup 12.
#
# HOW A READ GOES. `bin/secret <vault> <item> <field>` and SecretCache.read_ref
# (bin/agents-backup, bin/r2-backup --op, Workspace::Credentials,
# Gmail::Credentials) look the field up here first. A fresh copy is served from
# <projects>/.secret-cache (0700, each file 0600, never inside a repository); a
# miss or an expired copy is one bounded, metered `op read`, stored. A field this
# file does not name is read from 1Password every time, as before.
#
# A ROTATION. The copy is served until it expires, so a rotation must drop it:
# `bin/secret forget --source <item>` (credential-rotation §4.4 runs it). Nothing here is an admin
# vault: SecretCache refuses to write one to disk, and the test holds this file
# to that.
#
# FIELDS
#   <name>       the cache entry name: <item>.<field>
#   item, field  the 1Password item and the field (or file attachment) label
#   lane         an OpVaults lane (bin/lib/op_vaults.rb): the vault resolves on the
#                reading machine. Use `vault` only for a vault no lane names.
#   vault        a literal vault (industries-agents has no lane yet)
#   lifetime     how long a copy is served: 30m, 12h, 1d, 7d
#   refresh_window  a read inside it re-reads 1Password (default 1h)
#   readers      who reads it (documentation)

items:
  discord.webhooks.release-notes-webhook:
    item: discord.webhooks
    field: release-notes-webhook
    lane: agent
    lifetime: 7d
    readers: [bin/secret by hand (release notes)]
  discord.webhooks.qa-chatter-webhook:
    item: discord.webhooks
    field: qa-chatter-webhook
    lane: agent
    lifetime: 7d
    readers: [bin/secret by hand (QA chatter)]
  discord.webhooks.external-communication-webhook:
    item: discord.webhooks
    field: external-communication-webhook
    lane: agent
    lifetime: 7d
    readers: [bin/secret by hand]
  discord.webhooks.internal-communication-webhook:
    item: discord.webhooks
    field: internal-communication-webhook
    lane: agent
    lifetime: 7d
    readers: [bin/secret by hand]
  r2.mcritchie-agents-backup.access-key-id:
    item: r2.mcritchie-agents-backup
    field: access-key-id
    lane: agent
    lifetime: 7d
    readers: [bin/agents-backup]
  r2.mcritchie-agents-backup.secret-access-key:
    item: r2.mcritchie-agents-backup
    field: secret-access-key
    lane: agent
    lifetime: 7d
    readers: [bin/agents-backup]
  r2.mcritchie-agents-backup.endpoint:
    item: r2.mcritchie-agents-backup
    field: endpoint
    lane: agent
    lifetime: 7d
    readers: [bin/agents-backup]
  r2.mcritchie-agents-backup.crypt-password:
    item: r2.mcritchie-agents-backup
    field: crypt-password
    lane: agent
    lifetime: 7d
    readers: [bin/agents-backup]
  r2.mcritchie-agents-backup.crypt-salt:
    item: r2.mcritchie-agents-backup
    field: crypt-salt
    lane: agent
    lifetime: 7d
    readers: [bin/agents-backup]
  google.industries.agents.credential:
    item: google.industries.agents
    field: credential
    vault: industries-agents
    lifetime: 1d
    readers: [app/services/workspace/credentials.rb]
  gmail.studio.agents.credential:
    item: gmail.studio.agents
    field: credential
    lane: agent
    lifetime: 1d
    readers: [app/services/gmail/credentials.rb]
