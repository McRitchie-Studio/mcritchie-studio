packages:
  - key: vibe
    name: Vibe
    tagline: A real app built by our agents, live at you.mcritchie.studio.
    price_monthly: 0
    comp: 10and5
    highlights:
      - An app built by our agents from your description
      - Live at you.mcritchie.studio
      - Hosted for you on an Eco server
      - HTTPS and deploys handled for you
    cta: { label: Build your app, action: build }
  - key: pro
    name: Pro
    tagline: Your app on your own domain, with real data behind it.
    price_monthly: 100
    comp: Cyvasse
    highlights:
      - Your app on your own domain
      - A Postgres database and realtime updates
      - Sign-in links and app email from your domain
      - File storage with nightly backups
      - Small changes after launch, by email
    cta: { label: Talk to us about Pro, action: schedule }
  - key: growth
    name: Growth
    tagline: Your app, your email, Google Workspace and a marketing team.
    price_monthly: 500
    comp: Turf Monster, Commercial Welding
    featured: true
    highlights:
      - Web and worker servers, Postgres and Redis
      - Google Workspace with 2 seats included
      - An agent that drafts your email
      - Email marketing with list cleaning and analytics
      - A marketing team for strategy, content and launches
      - Monthly build requests and priority support
    cta: { label: Talk to us about Growth, action: schedule }
  - key: enterprise
    name: Enterprise
    tagline: Your systems connected, with a team that knows your business.
    price_label: Custom
    comp: McRitchie Industries
    highlights:
      - Custom connectors to the systems you already use
      - Multiple apps and domains, white label
      - Credential rotation with compliance review
      - Payments, crypto and AI as add-ons
      - A dedicated build team and a named contact
    cta: { label: Book a call, action: enterprise_booking }

