# What each McRitchie Studio package tier includes — and which SOP delivers
# each feature. This is the ONE place package contents live. Two pages render it:
#
#   /packages        the marketing page: one card per tier, its promise, its
#                    `highlights` and its call to action
#   /packages/stack  the full stack: every feature row below, grouped by
#                    `category`, one column per tier, so the difference between
#                    tiers reads across the row ("Vibe Host" / "Builder Host" / ...)
#
# The ladder Mr. McRitchie set on 2026-10-12 (task cto-and-team-tiers), where
# each tier includes the one below: Vibe free, Builder $100/mo, Pro $500/mo
# ("your fractional CTO"), Team $1,500/mo (cut to $900/mo on 2026-10-13); 10% off billed annually. Enterprise
# is no longer a card: /packages draws it as a "Talk to us" line under the
# cards, and /packages/stack keeps its column so the Enterprise-only rows stay
# visible. Pro took Growth's platform features (Growth, $500/mo, of 2026-09-30);
# Team adds the marketing rows. Builder gained Redis, which its realtime updates
# need.
#
# The KEYS moved too, so a stored key does not mean what it did: `pro` was the
# $100 tier (now `builder`) and is now the $500 tier. Migration SplitGrowthTier
# remapped stored rows in that order: pro to builder first, then growth to pro
# (Commercial Welding) or team (Turf Monster and every other growth row).
#
# History: the 2026-09-30 ladder (epic pricing-tiers-v2) was Vibe, Pro ($100),
# Growth and Enterprise; it replaced Launch, Host, Workspace and Agentic of
# 2026-09-25, and migration RemapPackageTiers moved those stored keys.
#
# Package keys:
#   key, name       the tier; `key` is what stack_clients.tier and app_requests.tier store
#   tagline         the one-line promise on its card
#   price_monthly   0 renders "Free"; a number "$N/month"; blank renders `price_label`
#                   ("Custom"), or "Pricing coming soon" without one
#   comp            the real client the tier was worked back from. Internal: the
#                   cards do not name clients; the admin SOP map does
#   card_groups     the card_lanes groups this card shows, in order
#   lanes           lane key => { title: optional, this tier's own title for the
#                   lane (may carry %{tier}), sub: one muted line, status: included
#                   (the default) | missing | soon }. A lane in a shown group that
#                   is not listed is missing. Keep the stack rows below consistent.
#   highlights      the Talk to us line's inclusions (Enterprise has no card)
#   cta             label + action: `build` (/build), `schedule` (the studio's
#                   booking calendar) or `enterprise_booking` (enterprise_booking_url
#                   below, else the studio's booking calendar)
#   featured        true on the one card the page highlights
#   talk_to_us      true on the tier drawn as the "Talk to us" line under the cards
#                   instead of as a card (Enterprise). It keeps its key, its column
#                   on /packages/stack and its stored clients.
#
# Feature keys:
#   name      customer-facing label
#   category  the group it sits under on /packages/stack (see `categories`)
#   icon      a software key (config/workspace_icons.yml) when the row is about ONE
#             brand's product: the row leads with that brand's logo, and that
#             brand joins its tier's "Powered by" row on /packages. Otherwise an
#             emoji: the neutral lead of a row no single brand owns (Hosting
#             mode, Support). Use a logo only where the customer gets that
#             brand's product.
#   brand_from  optional — the first tier that gets the `icon` brand's product, when a
#             lower tier has the row without it: its card then names no logo for it
#   blurb     one customer-facing sentence: what they get, not how
#   vibe/builder/pro/team/enterprise
#             what that tier gets, shown IN the row:
#               a string  → the package's value ("Basic dyno"); written
#                           "<product> · <metric>" it renders as two lines, the
#                           metric smaller and muted ("Pro Host · always on")
#               true      → included, nothing to quantify
#               omitted   → not included (the cell shows "—")
#   href      optional — a page the row's name links to on /packages/stack
#             (Integrations links /integrations)
#   sop       registered SOP invocation that delivers it (docs/agents/agents/*/sops/<sop>.md),
#             or a list when two SOPs deliver one row (Storage: Postgres and the R2 bucket)
#   section   optional — the part of that SOP that applies
#   you_do    what the CUSTOMER / operator does themselves (blank = nothing)
#   status    live     an SOP delivers it today (names that SOP)
#             builtin  part of the app template or the service itself: nothing to
#                      provision, so no SOP step
#             planned  not delivered today: "Coming soon", names no SOP. Keep this
#                      honest — a planned row is a promise, not a feature.
#   software  the software keys (config/workspace_icons.yml) the feature puts in a
#             client's stack — what /stack draws for a client on that tier. Only a
#             delivered (live or builtin) feature provisions; a planned one does not.
#             /packages/stack draws them (and `shows`, less the lead brand) as the
#             row's logo strip; /packages draws a delivered row's brands on its
#             tier's card. A planned row's logos show only on /packages/stack,
#             beside its Coming soon tag.
#   shows     software keys drawn beside the row on /packages/stack WITHOUT
#             provisioning them: an add-on a client takes per contract, recorded
#             on the client (stack_clients.extra_software), not by its tier
billing:
  annual_discount_percent: 10

# The Google Calendar appointment page the Enterprise "Book a call" opens, in a
# new tab. Blank until Mr. McRitchie supplies it: the button then opens the
# studio's own booking calendar (Studio.booking_url, config/initializers/studio.rb) in the
# booking popup, so it is never a dead link.
enterprise_booking_url:

# The groups of /packages/stack, in page order (Mr. McRitchie, 2026-10-12): each
# paid step unlocks one group. `category_from` names the tier a group starts at;
# its header reads "From <tier>".
# The `platform` key reads "Security & integrations" since 2026-10-13, when the
# cards dropped their Platform group (Mr. McRitchie) and the agent rows moved to
# their own `agents` group to mirror the cards' Agents lanes.
categories:
  application: Application
  domain: Domain
  platform: Security & integrations
  agents: Agents
  marketing: Marketing
  service: Service
  add_ons: Talk to us

category_from:
  domain: builder
  platform: pro
  agents: pro
  marketing: pro

# The swim lanes every card lists (Mr. McRitchie, 2026-10-12): one fixed lane
# list per group, in this order on every card that shows the group, each lane
# on a row shared across the cards so it reads like a table. `title` may carry
# %{tier} ("Pro Host"). A card shows the groups in its `card_groups`; in them, a
# lane its `lanes` omits (or marks `missing`) renders as a muted cross "(In
# <first tier that has it>)", computed, never hand-written. A tier may retitle a
# lane in its own `lanes` entry (Pro and Team's "Premium Domain"). `feature`
# names the /packages/stack row a lane stands for; a lane any card marks `soon`
# must name one, and that row must be `planned` (the model test holds both).
# `href` links the lane's title on the cards that include it (Integrations).
card_lanes:
  - { group: Application, key: app, title: Custom Web App }
  - { group: Application, key: host_storage, title: "%{tier} Host & Storage" }
  - { group: Application, key: domain, title: Custom Domain }
  - { group: Application, key: integrations, title: Integrations, href: /integrations }
  - { group: Application, key: vault, title: Password vault }
  - { group: Marketing, key: social, title: Social Outreach, feature: Social Outreach }
  - { group: Marketing, key: email_marketing, title: Email marketing }
  - { group: Marketing, key: content, title: Content sprints }
  - { group: Marketing, key: warmup, title: Launch warm-up }
  - { group: Marketing, key: funnels, title: Funnels built for you, feature: Funnel generation }
  - { group: Agents, key: cto, title: Fractional CTO }
  - { group: Agents, key: cmo, title: Fractional CMO }
  - { group: Agents, key: drafting, title: Email drafting agent }

packages:
  - key: vibe
    name: Vibe
    tagline: A real app built by our agents, live at your-app.mcritchie.studio.
    price_monthly: 0
    comp: 10and5
    card_groups: [Application]
    lanes:
      app: { sub: Bring your idea to life }
      host_storage: { sub: "light server, read-only data" }
      domain: { sub: on your-app.mcritchie.studio, status: missing }
    cta: { label: Build your app, action: build }
  - key: builder
    name: Builder
    tagline: Your app on your own domain, with real data behind it.
    price_monthly: 100
    comp: Cyvasse
    card_groups: [Application, Marketing]
    lanes:
      app: { sub: several changes a month }
      host_storage: { sub: "always on, 11 GB" }
      domain: { sub: www.your-app.com }
    cta: { label: Talk to us about Builder, action: schedule }
  - key: pro
    name: Pro
    tagline: "Your fractional CTO: we build, run and secure your product."
    price_monthly: 500
    comp: Commercial Welding
    card_groups: [Application, Marketing, Agents]
    lanes:
      app: { title: CTO-Managed Web App, sub: Always-on CTO }
      host_storage: { sub: "background jobs, 60 GB" }
      domain: { title: Premium Domain, sub: best-in-class speed & security }
      integrations: { sub: "Google Workspace, Slack & more" }
      vault: { sub: "logins in 1Password, rotated" }
      cto: { sub: 24-hour access & daily summaries }
      social: { sub: posts you approve, status: soon }
    cta: { label: Talk to us about Pro, action: schedule }
  - key: team
    name: Team
    tagline: "Your founding team: a CTO and a CMO."
    price_monthly: 900
    comp: Turf Monster
    featured: true
    card_groups: [Application, Marketing, Agents]
    lanes:
      app: { title: CTO-Managed Web App, sub: Always-on CTO }
      host_storage: { sub: "background jobs, 132 GB" }
      domain: { title: Premium Domain, sub: best-in-class speed & security }
      integrations: { sub: "Google Workspace, Slack & more" }
      vault: { sub: "logins in 1Password, rotated" }
      cto: { sub: 24-hour access & daily summaries }
      drafting: { sub: replies drafted in your inbox }
      cmo: { sub: a monthly demand plan }
      email_marketing: { sub: broadcasts and list cleaning }
      content: { sub: "short-form, tested at volume" }
      warmup: { sub: new domains ramped safely }
      funnels: { status: soon }
      social: { title: CMO-Managed Social, sub: strategy & posting, status: soon }
    cta: { label: Talk to us about Team, action: schedule }
  - key: enterprise
    name: Enterprise
    talk_to_us: true
    tagline: Need more apps, white label or custom connectors? Talk to us.
    price_label: Custom
    comp: McRitchie Industries
    highlights:
      - More than one app, and more than one domain
      - White label on your own accounts
      - Custom connectors to the systems you already use (coming soon)
      - Payments, crypto and AI features as add-ons
      - CMMC/ITAR compliance review, available on request
    cta: { label: Book a call, action: enterprise_booking }

features:
  # --- application (Vibe and up) -------------------------------------------
  - name: Custom Web App
    category: application
    icon: "glyph:app"
    blurb: Built by our agents from your description, then reviewed and shipped through our own pipeline.
    vibe: 1 app
    builder: 1 app
    pro: 1 app + workers
    team: 1 app + workers
    enterprise: Multiple apps
    sop: app-deploy-standard
    you_do: Describe what you want built
    status: live
    software: [github, rails]
  # Infrastructure reads as tier-branded products with one scale metric
  # (Mr. McRitchie, 2026-10-12): "<product> · <metric>" renders as two lines.
  # What each tier provisions on Heroku (checked against Heroku's docs that day):
  #   Vibe     Eco dyno, which sleeps after 30 minutes without web traffic
  #   Builder  Basic dyno · heroku-postgresql:essential-0 (1 GB) · Redis mini
  #   Pro      Basic web + worker · essential-1 (10 GB) · Redis
  #   Team     Basic web + worker · essential-2 (32 GB) · Redis
  # R2 file storage caps: Builder 10 GB, Pro 50 GB, Team 100 GB.
  - name: Host
    category: application
    icon: heroku
    blurb: Where your app runs. Vibe naps when nobody's visiting; from Builder it's always on.
    vibe: Vibe Host · light server, wakes on first visit
    builder: Builder Host · always on
    pro: Pro Host · always on + background jobs
    team: Team Host · always on + background jobs
    enterprise: Sized to need
    sop: app-deploy-standard
    status: live
    software: [heroku]
  # Storage folds what were Database and File storage (Mr. McRitchie,
  # 2026-10-12): Postgres for records, a private Cloudflare R2 bucket for files,
  # so it names both SOPs that provision them.
  - name: Storage
    category: application
    icon: postgres
    blurb: Where your app keeps its records and files, backed up every night.
    vibe: "Vibe Storage · read-only, built into your app"
    builder: Builder Storage · 1 GB records + 10 GB files
    pro: Pro Storage · 10 GB records + 50 GB files
    team: Team Storage · 32 GB records + 100 GB files
    enterprise: Custom
    sop: [app-deploy-standard, bucket-provision]
    status: live
    software: [postgres, cloudflare]
    # Vibe keeps its data in its own files: no Postgres or bucket in its stack.
    brand_from: builder
  # Redis stays its own row: a row's software cannot vary by tier, and Vibe's
  # Host must not provision Redis. It also carries what was "Realtime updates".
  - name: Live updates and jobs
    category: application
    icon: redis
    blurb: Pages that update live without a refresh, and background jobs that run on their own, on Redis.
    builder: Included
    pro: Included
    team: Included
    enterprise: Included
    sop: app-deploy-standard
    status: live
    software: [redis]
  - name: HTTPS and deploys
    category: application
    icon: "🛡️"
    blurb: Certificates and continuous integration on every app, from day one.
    vibe: true
    builder: true
    pro: true
    team: true
    enterprise: true
    status: builtin
  - name: Customer sign-in
    category: application
    icon: "🔑"
    blurb: Magic-link sign-in for your customers, with no passwords to leak.
    builder: true
    pro: true
    team: true
    enterprise: true
    status: builtin
  - name: Error log
    category: application
    icon: "🧾"
    blurb: Every error your app raises, recorded with what the visitor was doing.
    builder: true
    pro: true
    team: true
    enterprise: true
    status: builtin
  - name: Nightly backups
    category: application
    icon: "💾"
    blurb: Your database and files copied every night, so a bad day is an hour, not a loss.
    builder: Nightly
    pro: Nightly
    team: Nightly
    enterprise: Nightly + restore drill
    sop: r2-backup
    status: live
  - name: Hosting mode
    category: application
    icon: "🏷️"
    blurb: On McRitchie Studio's accounts, or white label on your own.
    vibe: McRitchie Studio hosted
    builder: McRitchie Studio hosted
    pro: Hosted or white label
    team: Hosted or white label
    enterprise: White label
    sop: website-launch
    you_do: Approve the hosting costs
    status: live

  # --- domain (Builder and up) ---------------------------------------------
  # Leads the Domain group (Mr. McRitchie, 2026-10-12): three domain levels.
  # Builder's address is www because the bare domain forwards to it on Squarespace
  # DNS (website-launch step 3); Pro and up serve the bare domain from
  # Cloudflare DNS, which points the apex at Heroku (domain-dns).
  - name: Web address
    category: domain
    icon: "glyph:domain"
    blurb: Your app's address, from our subdomain up to your own domain.
    vibe: your-app.mcritchie.studio
    builder: www.your-app.com
    pro: your-app.com + www.your-app.com
    team: your-app.com + www.your-app.com
    enterprise: Multiple domains
