  admin_style:        { page: "style#index",                  audience: admin, label: Design System, emoji: "🎨", hover_emoji: "🧩", desc: Theme · Modals · Tricks · Tasks, icon: palette, parent: admin_dashboard }
  admin_schema:       { page: "schema#index",                 audience: admin, label: Schema, emoji: "🗂️", hover_emoji: "🔎", desc: DB schema browser, parent: admin_basement }
  logos:              { page: "logos#index",                  audience: admin, label: Branding Kits, emoji: "🔷", hover_emoji: "📐", desc: Each brand's navbar logos + how they are built, icon: diamond, parent: admin_dashboard }
  admin_emails:       { page: "studio/emails#index",          audience: admin, label: Emails, emoji: "✉️", hover_emoji: "🖼️", desc: Transactional emails + their banners, parent: admin_basement }
  admin_link_preview: { page: "studio/site_identities#edit",  audience: admin, label: Link preview, emoji: "🔗", hover_emoji: "💬", desc: "Default title, description + image for unfurls", parent: admin_basement }
  asset_browser:      { page: "assets#index",                 audience: admin, label: Assets, emoji: "🗄️", hover_emoji: "🎞️", desc: Object store as a folder tree, parent: admin_basement }
  admin_basement:     { page: "admin/links#basement",         audience: admin, label: Basement, emoji: "🪜", hover_emoji: "📦", desc: Links kept off the sidebar, icon: door-stairwell, parent: admin_dashboard }

  # ── Clients ──────────────────────────────────────────────────────────────
  build_requests: { page: "build#index",             audience: admin, label: App requests, emoji: "🧱", hover_emoji: "📥", desc: Every app requested through /build, icon: inbox, parent: admin_dashboard }
  stack:          { page: "stack#index",             audience: admin, label: Stack, emoji: "🥞", hover_emoji: "🧭", desc: Each client's tier and software, parent: admin_basement }
  credentials:    { page: "credential_vaults#index", audience: admin, label: Credentials, emoji: "🔐", hover_emoji: "🗝️", desc: "Software by entity, with vault icons", parent: admin_basement }

  # ── Finance ──────────────────────────────────────────────────────────────
  books: { page: "books#index", audience: admin, label: Books, emoji: "📒", hover_emoji: "🧾", desc: "Review and confirm bank lines, per entity", icon: book-open, parent: admin_dashboard }

  # ── Email ────────────────────────────────────────────────────────────────
  broadcasts:          { page: "broadcasts#index",         audience: admin, label: Broadcasts, emoji: "📣", hover_emoji: "✉️", desc: "Compose, send and measure marketing email", parent: admin_basement }
  contacts:            { page: "contacts#index",           audience: admin, label: Contacts, emoji: "📇", hover_emoji: "✅", desc: "The mailing list, verified and watched live", parent: admin_basement }
  broadcast_analytics: { page: "broadcast_analytics#show", audience: admin, label: Email analytics, emoji: "📬", hover_emoji: "📈", desc: "Delivery, opens, clicks and list health", parent: broadcasts }

  # ── Ops ──────────────────────────────────────────────────────────────────
  error_logs:           { page: "error_logs#index",    audience: admin, label: Error logs, emoji: "🚨", hover_emoji: "🔍", desc: Captured errors, parent: admin_basement }
  admin_tiktok: { page: "admin/tiktok#show", audience: admin, label: TikTok connection, emoji: "🎵", hover_emoji: "🔐", desc: Connected account · sign in · disconnect, parent: admin_basement }
  admin_google: { page: "admin/google#show", audience: admin, label: Google connection, emoji: "🔗", hover_emoji: "🔐", desc: Calendar · Gmail · Drive · connect · disconnect, parent: admin_basement }
  admin_fathom: { page: "admin/fathom#show", audience: admin, label: Fathom connection, emoji: "🎙️", hover_emoji: "🔐", desc: Meeting notes · transcripts · connect · disconnect, parent: admin_basement }
  admin_agent_messages: { page: "admin/agent_messages#index", audience: admin, label: Agent inbox, emoji: "📬", hover_emoji: "💬", desc: Messages to agents · claims · replies, parent: admin_basement }
  admin_report_destinations: { page: "admin/report_destinations#index", audience: admin, label: Report destinations, emoji: "📰", hover_emoji: "📡", desc: Which Discord channel each report posts to, parent: admin_basement }
  admin_csp_reports: { page: "admin/csp_reports#index", audience: admin, label: CSP reports, emoji: "🛡️", hover_emoji: "🚨", desc: Content-Security-Policy violations · top offenders, parent: admin_basement }
  admin_upgrade_proposals: { page: "admin/upgrade_proposals#index", audience: admin, label: Upgrade proposals, emoji: "⬆️", hover_emoji: "✅", desc: Alex's tier upgrade asks · approve or decline, parent: admin_basement }
  activities_agents:    { page: "agents#activities",   audience: admin, label: Activities, emoji: "🎭", hover_emoji: "🎬", desc: Cross-session agent activity feed, icon: activity, parent: admin_dashboard }

  # ── Data ─────────────────────────────────────────────────────────────────
  admin_ai_builder_multiple: { page: "admin/ai_builder_multiple#index", audience: admin, label: AI Builder Multiple, emoji: "📈", hover_emoji: "🤖", desc: GitHub public commit pace backtest, parent: admin_basement }
  workflow_news_index:       { page: "news#workflow",                   audience: admin, label: News workflow, emoji: "🛠️", hover_emoji: "🧭", desc: Intake → conclude board, parent: news_index }
  merge_people:              { page: "people#merge",                    audience: admin, label: Merge people, emoji: "🔀", hover_emoji: "✅", desc: Resolve duplicate people, parent: people }
  duplicates_people:         { page: "people#duplicates",               audience: admin, label: Duplicates, emoji: "👥", hover_emoji: "🧹", desc: Duplicate candidates, parent: people }

  # ── Video ────────────────────────────────────────────────────────────────
  alt_videos: { page: "alt_videos#index", audience: admin, label: Alt videos, emoji: "🎬", hover_emoji: "🔁", desc: "Every recast version, with clip progress", parent: videos }

  # ── The board family and the heartbeat (reached from the sub-navs) ───────
  stages:                   { page: "tasks#stages",             audience: admin, label: Stages, parent: deployments }
  epics:                    { page: "epics#index",              audience: admin, label: Epics, parent: deployments }
  triage:                   { page: "triage#index",             audience: admin, label: Triage, parent: deployments }
  intelligence:             { page: "intelligence#index",       audience: admin, label: Intelligence, parent: deployments }
  pokedex:                  { page: "pokemon#index",            audience: admin, label: Pokédex, parent: deployments }
  recent_tasks:             { page: "tasks#recent",             audience: admin, label: Recent tasks, parent: deployments }
  all_deployments:          { page: "releases#index",           audience: admin, label: All Deployments, parent: deployments }
  mason_heartbeat:            { page: "heartbeat#show",           audience: admin, label: Per-session heartbeat, parent: deployments }
  heartbeat_all_activities: { page: "heartbeat#all_activities", audience: admin, label: All Activities, emoji: "🗃", parent: mason_heartbeat }
  mason_insights:             { page: "heartbeat#insights",       audience: admin, label: Insight Bank, emoji: "💡", parent: deployments }
  mason_pipeline:             { page: "heartbeat#pipeline",       audience: admin, label: Pipeline, parent: deployments }
  # Pages that are in no nav but carry the crumb trail (task task-pages-standard-header).
  review_events_hub:        { page: "tasks#review_events_hub",  audience: admin, label: Review Process Hub, crumb: Review hub, parent: deployments }
  admin_model_pricing:      { page: "admin/model_pricing#index", audience: admin, label: Model Pricing, parent: deployments }
  dreams:                   { page: "dreams#index",             audience: admin, label: Dreams, parent: agents }

sidebar:
  # The main areas (Alex McRitchie, 2026-11-04). The short words are this section's
  # own: the sub-navs still say Admin dashboard and Deployments. Branding Kits is the
  # /logos page's own label, since no sub-nav reads it. App Requests is what the funnel
  # brought in. Books is Mack's seat (CFO): the books and what they report.
  # `header: true` asks the link sidebar to draw the section's title (Alex McRitchie,
  # 2026-11-04); the basement page draws its own.
  - { title: Admin,   group: admin, header: true, pages: [{ page: admin_dashboard, label: Dashboard }, { page: deployments, label: DevOps }, { page: admin_style, label: Design }, logos, { page: build_requests, label: App Requests }, books, activities_agents, admin_basement] }
  # On /links and in the Basement; no longer in the sidebar (Alex McRitchie, 2026-11-04).
  - { title: NFL,       group: general, pages: [nfl_hub, games_season] }
  # The Basement: links worth keeping that the sidebar does not need to carry.
  - { title: Site,      group: basement, pages: [admin_schema, admin_emails, admin_link_preview, asset_browser] }
  # What each client runs on, and the credentials behind it.
  - { title: Clients,   group: basement, pages: [stack, credentials] }
  # The mailing list and what is sent to it.
  - { title: Email,     group: basement, pages: [broadcasts, contacts, broadcast_analytics] }
  - { title: Ops,       group: basement, pages: [error_logs, admin_tiktok, admin_google, admin_fathom, admin_agent_messages, admin_report_destinations, admin_csp_reports, admin_upgrade_proposals] }
  # Who is who, and the docs.
  - { title: Directory, group: basement, pages: [teams, people, builders, docs] }
  - { title: Data,      group: basement, pages: [admin_ai_builder_multiple, workflow_news_index, merge_people, duplicates_people] }
  # What the studio makes. Alt videos is the recast pipeline: every generated version of every source video.
  - { title: Pipelines, group: basement, pages: [news_index, contents, model_pipeline, body_archetypes, videos, alt_videos] }

sub_navs:
  # The small link row above a board page's title.
  board_sections:
    style: links
    label: Board sections
    items:
      - { page: admin_dashboard, back: true }
      # The Deploy board carries Stages in its header menu instead.
      - { page: stages, except: [deployments] }
      - { page: epics, test_id: board-link-epics }
      - { page: intelligence }
      - { page: activities_agents, icon: true }
      - { page: pokedex }
      # The learning-loop surfaces and the recency list belong to the Deploy lane.
      - { page: mason_pipeline, only: [deployments] }
      - { page: mason_insights, label: Insights, only: [deployments] }
      - { page: recent_tasks, label: Recent, only: [deployments] }

  # The board switcher beside the title. The title already says where you are,
  # so the button for the current board is dropped. A Deploy board wide enough for
  # six lanes shows the whole Build lane, so its Tasks button shows only while the
  # board is too narrow for six (its container query, not a window breakpoint).
  board_views:
    style: buttons
    label: Board views
    items:
      - { page: tasks, hide_when_current: true, badges: [building], narrow_only_on: [deployments] }
      - { page: triage, hide_when_current: true }
      - { page: deployments, hide_when_current: true, badges: [reviewed, assembled] }

  # The chip cluster in a heartbeat page's toolbar.
  heartbeat:
    style: chips
    label: Heartbeat
    items:
      - { page: deployments, back: true, test_id: hb-nav-deployments }
      - { page: mason_insights, icon: true, count: { key: insights, id: hb-insight-count } }
      - { page: heartbeat_all_activities, icon: true, test_id: hb-nav-all-spans }
      - { page: mason_heartbeat, back: true, only: [heartbeat_all_activities], test_id: hb-nav-session }
