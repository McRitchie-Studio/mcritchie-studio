# Nightly UI budget: every public page in config/ui_budget.yml, measured signed out
# at 390 and 1280 and judged against its ceilings by bin/ui-budget (collector:
# bin/lib/ui_budget/collect.cjs; evaluator: bin/lib/ui_budget.rb). Epic:
# .agents/epics/ui-consistency-program.md, piece 4.
#
# REPORT, NOT GATE (task ui-budget-report-never-gates). The ceilings are not
# ratified yet, so a page OVER budget is a finding, not a failure: the run stays
# green and the OVER rows reach the log, the job summary and the alert issue. Only
# a broken MEASUREMENT fails the run: a page it could not measure (MISSING) or a
# collector that crashed. That matters beyond this file: this run attaches a check
# to main's head, and a red one there once blocked a cleared production ship
# (bin/lib/ci_status.rb now ignores schedule-triggered runs when it judges a SHA,
# but the report should not be red for a finding in the first place).
#
# SILENCE MEANS UNDER BUDGET, so anything else is loud. A night with an OVER or
# MISSING row, or a failed run, opens an issue titled "UI budget over: <date>"
# (the UTC date it first went over). Later such nights comment on that open issue
# rather than open another; the next clean night (every row ok) closes it. Same
# alert shape as r2-backup.yml.
#
# The run reads production as an anonymous visitor: GET requests only, no
# cookies, no secrets, a user agent marked `ui-budget` so the apps' logs can tell
# it apart. The table goes to the job summary and the raw JSON to an artifact.
name: UI Budget

on:
  schedule:
    # Off the hour on purpose: GitHub queues top-of-hour schedules behind
    # everyone else's (r2-backup's runs at "0 9" started 5.5 and 8.3 hours late).
    - cron: "23 10 * * *" # 10:23 UTC = 04:23 Denver (MDT), 03:23 (MST)
  workflow_dispatch:

concurrency:
  group: ui-budget
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  budget:
    runs-on: ubuntu-24.04  # pinned, not the floating latest label: that moves to images Playwright cannot install chromium on (guard: test/lib/ci_runner_image_pin_test.rb)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The evaluator is plain Ruby (stdlib only), so no bundle install.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # Node's major comes from .tool-versions, the one pin mise reads locally and
      # studio-engine's versions.json holds (`bin/rails studio:node:check`).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      # Playwright and axe-core come from package-lock.json; axe is injected from
      # node_modules, never fetched from a CDN at run time.
      - name: Install JS dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # `--with-deps` runs its OWN apt-get update/install, outside
      # .github/scripts/apt-retry, so apt's timeouts are set machine-wide for it: a
      # silent socket drops in 30s and the file is re-fetched instead of hanging
      # until the job bound (the 2026-10-26 mirror stall; guard:
      # test/lib/ci_apt_step_timeout_test.rb).
      - name: Harden apt fetches
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install Playwright browser
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Measure and judge
        run: bin/ui-budget --collect --out ui-budget.json --summary ui-budget-summary.md

      - name: Write the job summary
        if: always()
        run: |
          if [ -f ui-budget-summary.md ]; then
            cat ui-budget-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UI budget: no table; the collector did not finish. Read the run log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-budget-${{ github.run_id }}
          path: ui-budget.json
          if-no-files-found: warn
          retention-days: 30

      # Runs on a red night AND on a green night with OVER rows (OVER no longer
      # fails the run); a clean green night exits here without touching issues.
      - name: Alert when over or failed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && ! grep -qE '\| (OVER|MISSING) \|$' ui-budget-summary.md 2>/dev/null; then
            echo "Every row is within budget; no alert."
            exit 0
          fi
          prefix="UI budget over:"
          if [ -f ui-budget-summary.md ]; then
            verdict=$(grep -m1 '^ui-budget:' ui-budget-summary.md || true)
            rows=$(grep -E '\| (OVER|MISSING) \|$' ui-budget-summary.md || true)
            body="$verdict. Run: $RUN_URL

          | page | width | metric | value | ceiling | verdict |
          |---|---|---|---|---|---|
          $rows

          The full table is the run's job summary; the raw numbers are its \`ui-budget-*\` artifact. Ceilings: config/ui_budget.yml. Reproduce one page: \`bin/ui-budget --collect --only <url>\`."
          else
            body="The UI budget run did not produce a table (the collector failed before judging): $RUN_URL. Read the run log."
          fi
          existing=$(gh issue list --state open --search "\"$prefix\" in:title" --json number,title \
            --jq "[.[] | select(.title | startswith(\"$prefix\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$prefix $(date -u +%F)" --body "$body"
          fi

      - name: Close a resolved alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A green run can still carry OVER rows (report-only); only a clean night closes.
          if grep -qE '\| (OVER|MISSING) \|$' ui-budget-summary.md 2>/dev/null; then
            echo "Rows are still over budget; the alert stays open."
            exit 0
          fi
          prefix="UI budget over:"
          for n in $(gh issue list --state open --search "\"$prefix\" in:title" --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number"); do
            gh issue close "$n" --comment "Every page is within budget again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
