# App catalog: one record per app in the McRitchie ecosystem, and the one place
# an app's identity, tier and status are written down.
#
# Loaded once by AppCatalog (lib/app_catalog.rb), which validates it and hands
# out frozen values. Derived from it: ApplicationHelper::APP_EMOJIS (the board's
# glyphs), ReleaseNotes::Formatter::APP_GROUPS (release-notes groups), the App
# rows db/seeds/00_apps.rb upserts (status-line color), and the tier and status
# on /stack and /stack/matrix.
#
# config/satellites.yml (ports, navbar, bin/ecosystem-build) and
# config/release_repos.yml (how each repo ships) still have their own readers.
# test/lib/app_registry_test.rb holds both, and config/qa_environments.yml, to
# this file: a slug, port, Heroku app, status or engine flag that disagrees
# fails it. To add an app, add one record here, run that test, and fix what it
# names.
#
# App fields (every key on every record; null where it does not apply):
#   slug            repo and registry slug
#   name            display name
#   emoji           board glyph; unique across apps and libraries
#   color           status-line tint, #RRGGBB
#   tier            studio | product | basic (null only on an archived app)
#   status          active | delinquent | showcase | archived
#                   archived apps keep their row so their port block stays reserved
#   port            primary local port; the block is port..port+99
#   repo            GitHub repo, or null when none exists
#   heroku_app      production Heroku app, or null
#   production_url  public production URL, or null
#   qa_url          QA URL, or null when the app has no QA copy
#   engine          true when the app runs on studio-engine
#   hosted          true when McRitchie Studio hosts it
#   workspace       its /stack client slug (config/workspace_icons.yml), or null
#   description     one line
#
# Libraries are gems and on-chain programs. They are not apps (no tier, no
# status, no port) but the board and release notes draw them, so their glyph
# and color live here too. Their release metadata stays in release_repos.yml.

