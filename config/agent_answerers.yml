# Who the agents answer (docs/agents/system/agent-message-loop.md, "Held").
#
# A STOPGAP, owner-only: an addressed message from anyone not listed here is
# stored `held` and never claimed until an admin releases it (the Release button
# on /admin/agent_messages/:id, or `bin/rails agent_people:release MESSAGE=<id>`).
# The task agent-sender-authority replaces this file with roles.
#
# Each entry names one person, by either key:
#   identity: { platform: discord, external_id: "<user id>" }  # matches that id's
#                                                              # person, so every
#                                                              # identity linked to
#                                                              # them counts too
#   person_id: <agent_people.id>                               # one environment's row
#
# The server reads this once per process (AgentMessages::Answerers), so a change
# takes effect on deploy. An identity no person holds yet allows nobody until
# that id first speaks.
answerers:
  - name: Alex
    identity:
      platform: discord
      external_id: "536552944271753216"
