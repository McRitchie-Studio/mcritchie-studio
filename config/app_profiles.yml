# App deploy profiles — the shapes a single-use app can take in
# config/release_repos.yml, each defined ONCE instead of re-explained per app.
#
# The SOP that uses this file is Steffon's `app-deploy-standard`
# (docs/agents/agents/steffon/sops/app-deploy-standard.md). The command that
# applies it is `bin/register-app`, which checks an app against the profile's
# contract and GENERATES the app's full release_repos.yml entry.
#
# WHY GENERATED, NOT EXPANDED AT READ TIME. release_repos.yml is parsed by about
# nine independent readers (Release::Repos, bin/release.rb, bin/conductor,
# bin/lib/release_registry.rb, bin/qa-intake, bin/prod-smoke, bin/dor-check, ...).
# Teaching every one of them to expand a profile would touch release-critical
# code in nine places. Instead each registered entry carries the expanded keys
# every reader already understands, plus a `profile:` key naming its source, and
# test/models/release/repos_test.rb fails if an entry ever drifts from its profile.
#
# Fields a profile expands, with %{placeholders} filled per app:
#   heroku_app — the Heroku app name (company account)
#   smoke_url  — the production host the ship smokes as <smoke_url>/up
#   test_cmd   — the app's CI `test` job command, VERBATIM
profiles:
  standalone-heroku:
    description: >-
      A single-use Rails app on its own Heroku app, released through the
      three-rung ladder and shipped by git push, with no QA copy.
    entry:
      ladder: three-rung
      prod_deploy:
        strategy: git_push_heroku
        remote: "https://git.heroku.com/%{heroku_app}.git"
        branch: main
        smoke_url: "%{smoke_url}"
      test_cmd: "%{test_cmd}"
      qa_evidence: exempt
    # What an app must already be before it can be registered on this profile.
    # bin/register-app checks every line live and refuses with the list of what
    # is missing.
    contract:
      - The repo is McRitchie-Studio/<slug>, cloned at /Users/alex/projects/<slug>
      - origin has main, accepted and release (bin/release init creates the last two)
      - .github/workflows/ci.yml has a `test` job; its command becomes test_cmd
      - .gitignore ignores .worktrees/
      - The Heroku app exists and <smoke_url>/up answers 200
      - An app with a database runs migrations in its Procfile release phase
    # THE QA DECISION, taken ONCE for every app on this profile. It replaces the
    # per-app quotes the registry used to carry (those stay below as history).
    # repos_test.rb requires this text verbatim, so change both together.
    qa_decision:
      rule: "standalone apps ship without a QA copy unless there is a free tier."
      asked: 'Confirm the fleet-wide QA rule: "standalone apps ship without a QA copy unless there is a free tier."'
      answer: "Yes to both"
      by: Alex
      on: "2026-09-28"
      history:
        - "cyvasse, 2026-09-25: No cyvasse-qa unless there is a free teir we can use"
        - "dads-app, 2026-09-26: anyway we can get it cheaper than $12/m"
        - "showcase apps, 2026-09-26: No QA copies (Recommended)"
    # What leaving the profile means: an app that needs a QA copy registers its
    # qa_environments.yml entry and a qa_test_cmd, and drops `profile:` (it is no
    # longer this shape). The exemption guard then requires QA evidence again.
