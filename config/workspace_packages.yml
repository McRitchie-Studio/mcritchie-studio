packages:
  - key: vibe
    name: Vibe
    tagline: A real app built by our agents, live at yourname.mcritchie.studio.
    price_monthly: 0
    comp: 10and5
    highlights:
      - An app built by our agents from your description
      - Live at yourname.mcritchie.studio
      - Hosted for you on an Eco server
      - HTTPS and deploys handled for you
    cta: { label: Build your app, action: build }
  - key: pro
    name: Pro
    tagline: Your app on your own domain, with real data behind it.
    price_monthly: 100
    comp: Cyvasse
    highlights:
      - Your app at www.yourname.com, your own domain
      - Postgres and Redis, so pages update live
      - Sign-in links and app email from your domain
      - File storage with nightly backups
      - Small changes after launch, by email
    cta: { label: Talk to us about Pro, action: schedule }
  - key: cto
    name: CTO
    tagline: "Your fractional CTO: we build, run and secure your product."
    price_monthly: 500
    comp: Commercial Welding
    highlights:
      - Your app on yourname.com itself, www redirected to it
      - Web and worker servers on a larger Postgres, with error alerts
      - Google Workspace with 2 seats and an agent that drafts your email
      - Your logins in 1Password, rotated when they leak or age
      - A monthly architecture and roadmap review
      - 4 build requests a month and priority support
    cta: { label: Talk to us about CTO, action: schedule }
  - key: team
    name: Team
    tagline: "Your founding team: a CTO and a CMO."
    price_monthly: 1500
    comp: Turf Monster
    featured: true
    highlights:
      - A CMO agent that finds what holds your demand back
      - Content sprints, tested at volume and measured
      - Launch warm-up and email marketing with list cleaning
      - Funnels built for you (coming soon)
      - 6 build requests a month
    cta: { label: Talk to us about Team, action: schedule }
  - key: enterprise
    name: Enterprise
    card: false
    tagline: Need more apps, white label or custom connectors? Talk to us.
    price_label: Custom
    comp: McRitchie Industries
    highlights:
      - More than one app, and more than one domain
      - White label on your own accounts
      - Custom connectors to the systems you already use (coming soon)
      - Payments, crypto and AI features as add-ons
      - CMMC/ITAR compliance review, available on request
    cta: { label: Book a call, action: enterprise_booking }

