#
# (THREE PRs bumped this counter the same day. Each later one re-derived the number from
# the MERGED tree with the lister rather than keeping either side of the conflict —
# 107+1+2+2 = 112. Picking a side here silently un-counts another PR's specs, which is
# exactly what this file exists to make impossible.)
#
# 2026-08-19: +5 for e2e/app_ladder_row.spec.js (the /deployments app-ladder row).
# MEASURED with the lister, not added by hand: `npx playwright test --list` => 117.
total_specs: 117

# Of those, the ones already RED on an untouched `release` checkout the day this lane was
# switched on — tagged ` @quarantine` in their title and excluded by the CI command. A hole
# with a name and a ticket: /tasks/repair-rotted-e2e-specs.
#
# THIS NUMBER MAY ONLY FALL, AND THAT IS ENFORCED — not merely requested here.
# test/lib/e2e_quarantine_ratchet_test.rb compares this value against its value on
# `origin/release` and goes RED if it is higher. That comparison is the whole point: it reads
# a copy of the number that YOUR edit cannot reach. The first version of the guard compared
# this line to... this line, and review proved what that is worth by tagging a 19th spec,
# bumping this number to 19, and watching every guard in the repo AND the runtime receipt go
# green over a suite that had just lost a spec. A ratchet whose reference value moves with the
# thing it restrains is a PIN.
#
# Repair a spec: drop its tag, lower `quarantined`, raise `executed`, same commit — the guard
# will tell you both numbers. Tagging one MORE spec to green a PR is the exact self-declaration
# disease this whole lane exists to cure, and it is now a red build rather than a red face.
# 18 -> 15 on 2026-08-18 (/tasks/repair-quarantined-e2e-clusters): three deployments_live
# specs REPAIRED, not re-tagged. Root cause was never the specs - the Deployments board
# collapses its three upstream lanes below 1400px, and Playwright configures no viewport,
# so Chromium's 1280px default hid every card they wait on. One test.use({viewport}) line
# revived them. The other four in that file fail for DIFFERENT reasons (three are
# Building-column/blocked-card behaviour, one is the review ticker) and stay tagged.
quarantined: 15

# total_specs - quarantined. What the lane MUST execute — asserted against the runner's own
# report, so no source-level spelling on any axis can move it without moving this line.
#   npx playwright test --list --grep-invert @quarantine  ->  97 tests in 44 files
#
# 2026-08-18, THIRD conflict on this line in one day: /tasks/repair-quarantined-e2e-clusters
# repaired three specs (quarantined 18 -> 15, executed 92 -> 95) while this branch added two
# (total 110 -> 112, executed 92 -> 94). Neither side's number is right on the merged tree.
# Resolved from the INVARIANT — total_specs - quarantined - and re-derived with the lister
# above: 117 - 15 = 102. Taking either side would have un-counted the other PR's work.
# Both halves re-measured 2026-08-19 with the runner:
#   npx playwright test --list                           => 117
#   npx playwright test --list --grep-invert @quarantine => 102
executed: 102

# The ONE sanctioned exclusion. bin/e2e-executed-set-check refuses any executed spec whose
# title carries this tag, and test/lib/ci_workflow_triggers_test.rb pins the CI command to
# this EXACT value — exactly one `--grep-invert`, and nothing else in it. Widening the filter
# to `@quarantine|board` silently drops 8 more specs; that was a live hole until this line.
quarantine_tag: "@quarantine"

# The shard matrix in .github/workflows/ci.yml. The shards UNION to the whole suite, so this
# is not a narrowing — but a shard that goes EMPTY exits 0 SILENTLY (sharding suppresses
# Playwright's own "No tests found" guard), so the floor `executed >= shards` is load-bearing
# and the runtime gate refuses a run that is missing any shard's report.
shards: 3
