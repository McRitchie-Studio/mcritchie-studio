# QA environment registry for stable review servers.
#
# These are intentionally separate from config/satellites.yml:
# satellites.yml describes products; this file describes deploy targets used by
# Avi/Steffon/release-conductor sessions before production rollout.
#
# Apps listed here may not exist yet on Heroku. Use:
#   bin/qa-server list
#   bin/qa-server plan <app>
#   bin/qa-server provision <app> --yes
#   bin/qa-server status <app>
#
# Never put secret values in this file. Put secret names/purposes here and pull
# values through 1Password/Heroku during approved provisioning.

qa_environments:
  mcritchie-studio:
    display_name: McRitchie Studio QA
    repo: mcritchie-studio
    heroku_app: mcritchie-studio-qa
    heroku_domain: mcritchie-studio-qa-26cedb6e8fdc.herokuapp.com
    qa_url: https://qa.mcritchie.studio
    custom_domains:
      - qa.mcritchie.studio
    production_app: mcritchie-studio
    production_url: https://mcritchie.studio
    deploy_provider: heroku
    addons:
      - heroku-postgresql:essential-0
    dynos:
      web: 1
      worker: 1
    safety_profile: hub-qa
    required_config:
      APP_HOST: qa.mcritchie.studio
      MAILER_HOST: qa.mcritchie.studio
      DYNO_HOST: "${HEROKU_HOST}"
      QA_ENV: "true"
      MAIL_TRANSPORT: resend
      RESEND_MAILER_FROM: "McRitchie QA <team@mcritchie.studio>"
    required_secrets:
      - RAILS_MASTER_KEY
      - RESEND_API_KEY

  turf-monster:
    display_name: Turf Monster QA
    repo: turf-monster
    heroku_app: turf-monster-qa
    heroku_domain: turf-monster-qa-93e18f3ae318.herokuapp.com
    qa_url: https://qa.turfmonster.media
    custom_domains:
      - qa.turfmonster.media
    production_app: turf-monster-mainnet
    production_url: https://turfmonster.media
    deploy_provider: heroku
    addons:
      - heroku-postgresql:essential-0
      - heroku-redis:mini
    dynos:
      web: 1
      worker: 1
    safety_profile: devnet-no-real-money
    required_config:
      APP_HOST: qa.turfmonster.media
      MAILER_HOST: qa.turfmonster.media
      DYNO_HOST: "${HEROKU_HOST}"
      QA_ENV: "true"
      MAIL_TRANSPORT: resend
      RESEND_MAILER_FROM: "Turf Monster QA <team@mcritchie.studio>"
      PAYMENT_PROVIDER: none
      ENABLE_CDP_RAMP: "false"
      SOLANA_NETWORK: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_PROGRAM_ID: EQGFJAcABtDb6VXtiijTjZ6cE2UqdvhnqJvoharJbpMJ
    derived_config:
      EXPECTED_IDL_HASH: sha256:config/turf_vault.idl.json
    required_secrets:
      - RAILS_MASTER_KEY
      - RESEND_API_KEY
      - MANAGED_WALLET_ENCRYPTION_KEY
      - SOLANA_ADMIN_KEY

  mcritchie-industries:
    display_name: McRitchie Industries QA
    repo: mcritchie-industries
    heroku_app: mcritchie-industries-qa
    heroku_domain: mcritchie-industries-qa-35b7dd935a08.herokuapp.com
    qa_url: https://qa.mcritchie.industries
    custom_domains:
      - qa.mcritchie.industries
    production_app: mcritchie-industries
    production_url: https://www.mcritchie.industries
    deploy_provider: heroku
    addons:
      - heroku-postgresql:essential-0
    dynos:
      web: 1
    safety_profile: auth-gated-confidential-deal-data
    required_config:
      # production.rb defaults APP_HOST to www.mcritchie.industries — the QA app
      # MUST override it or QA mints www links. VERIFIED LIVE 2026-09-02:
      # `heroku config:get APP_HOST -a mcritchie-industries-qa` returns
      # qa.mcritchie.industries, so the 2026-07-29 "unset" note this replaced is
      # stale.
      APP_HOST: qa.mcritchie.industries
      # Neither Heroku app sets RAILS_ENV, so mcritchie-industries-qa boots as
      # RAILS_ENV=production exactly like real production. QA_ENV is the ONLY
      # signal that separates them, and mcritchie-industries' config/storage.yml
      # keys its bucket choice off it.
      #
      # WITHOUT THIS MARKER, QA resolved bucket mcritchie-industries-production
      # while carrying the mcr-mcritchie-industries-dev key — whose PutObject
      # there is AccessDenied. Active Storage uploads from QA failed SILENTLY.
      # Verified 2026-09-02: QA_ENV was empty on the live app, and this was the
      # ONLY qa_environments entry missing it (mcritchie-studio, turf-monster
      # and rolio all declare it).
      QA_ENV: "true"
      # DECLARED VALUE CORRECTED 2026-09-03. It read "McRitchie Studio", which was
      # wrong twice: the wrong PRODUCT (this is Industries), and missing the QA
      # marker its siblings carry ("McRitchie QA", "Turf Monster QA"). The live app
      # meanwhile sent as "McRitchie Industries" — unmarked — so provisioning would
      # have PATCHED the declared value over it and silently re-branded QA email to
      # the wrong product. Studio.mailer_from reads this (studio-engine
      # lib/studio.rb:593).
      RESEND_MAILER_FROM: "McRitchie Industries QA <team@mcritchie.studio>"
    required_secrets:
      - RAILS_MASTER_KEY
      - RESEND_API_KEY

  rolio:
    display_name: Rolio QA
    repo: rolio
    heroku_app: rolio-qa
    heroku_domain: rolio-qa-58beede9dc0b.herokuapp.com
    qa_url: https://rolio-qa-58beede9dc0b.herokuapp.com
    custom_domains: []
    production_app: rolio-prod
    production_url: https://rolio-prod-82e96784b462.herokuapp.com
    deploy_provider: heroku
    addons: []
    dynos:
      web: 1
    safety_profile: demo-qa-ephemeral-sqlite
    required_config:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SQLITE_DATABASE: storage/production.sqlite3
      QA_ENV: "true"
    required_secrets:
      - SECRET_KEY_BASE
