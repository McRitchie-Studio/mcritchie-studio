---
# THE RUBY SUITE'S RATCHET — the contract test/lib/test_health_ratchet_test.rb enforces.
#
# Three numbers can rot a suite silently, because none shows up as a failure:
#
#   assertion_free  a test that exercises code and asserts nothing about it. It goes
#                   green whatever the code does, which is worse than no test: it
#                   reports coverage it does not have. EXACT, and held at 0 here.
#
#   skips           a test switched off without being deleted. The suite keeps its
#                   name and loses its coverage. NOT STORED: the guard counts skip call
#                   sites now and at the merge base with origin/accepted, and refuses a
#                   rise. Removing a skip needs no edit anywhere.
#
#   frozen          the suite's APPEND hotspots, the files every PR collides at the
#                   bottom of. A frozen file may not grow past its size at the merge
#                   base; a new test goes in a NEW file named for its concern (the
#                   bin/release CLI suite is the model: a shared harness,
#                   test/lib/release_cli_harness.rb, and one file per subcommand).
#                   Shrinking and splitting need no edit here.
#
# The merge base is the one copy of these counts an author's diff cannot move, so no
# ceiling is written down and none drifts stale.
assertion_free: 0

frozen:
  - test/lib/release_cli_harness.rb
  - test/lib/release_cli_archive_test.rb
  - test/lib/release_cli_conductor_test.rb
  - test/lib/release_cli_core_test.rb
  - test/lib/release_cli_deploy_app_test.rb
  - test/lib/release_cli_frozen_main_test.rb
  - test/lib/release_cli_merge_test.rb
  - test/lib/release_cli_notes_test.rb
  - test/lib/release_cli_post_deploy_test.rb
  - test/lib/release_cli_pre_qa_gate_test.rb
  - test/lib/release_cli_prepare_gems_test.rb
  - test/lib/release_cli_prepare_sweep_test.rb
  - test/lib/release_cli_prepare_test.rb
  - test/lib/release_cli_repin_test.rb
  - test/lib/release_cli_retro_test.rb
  - test/lib/release_cli_ship_test.rb
  - test/lib/release_cli_status_test.rb
  - test/lib/dor_check_test.rb
  - test/lib/task_cli_test.rb
  - test/models/task_test.rb
  - test/commands/agent_worktree_test.rb
