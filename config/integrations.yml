# What a McRitchie Studio plan connects to, and what we run for a client on top
# of it. This is the ONE place /integrations reads from (Integration,
# app/models/integration.rb). Draft of 2026-10-13 (Mr. McRitchie, task
# integrations-and-add-ons-page): built to look at, not final copy.
#
# The core product is the agent-powered backend the tiers on /packages sell
# (config/workspace_packages.yml). This page is what plugs into it, in three
# groups (Mr. McRitchie, 2026-10-13; folded from five to three on 2026-11-05,
# task simplify-integrations-page-layout, so the page scrolls less):
#
#   connect       free connections to accounts the CLIENT owns: everything they
#                 sign in to or install (the Google sign-ins, Fathom, Workspace,
#                 Discord, GitHub, Slack). We do no ongoing work and the client
#                 pays the vendor directly.
#   add_ons       the standard, repeatable services we set up and run, priced
#                 (or quoted) on top of a plan.
#   custom        rarer needs scoped one client at a time: no price line, one
#                 "Talk to us" button.
#
# Entry keys:
#   key       unique across the file
#   name      customer-facing label
#   icon      a software key (config/workspace_icons.yml) when the entry is about
#             ONE brand's product: the entry leads with that brand's logo.
#             Otherwise an emoji, the neutral lead of an entry no brand owns.
#   tagline   optional: the one short line the tile shows (about 60 characters).
#             Blank: the tile shows the blurb.
#   blurb     one customer-facing sentence: what they get, not how. The tile's
#             Details disclosure shows it when a tagline stands in for it.
#   status    live        delivered today
#             soon        not delivered today: renders "Coming soon". Keep this
#                         honest, the same rule as a `planned` row on /packages.
#             on_request  delivered per contract after a call, not self-serve
#   tier      the first package key (workspace_packages.yml) the entry is
#             available from; it renders "From <tier>", or "Every plan" for the
#             first tier. Blank: no tier gate.
#   tier_note optional muted line beside the tier ("Drafting agent from Team")
#   price     integrations: omitted (they are free). add_ons: a price string, or
#             omitted for "Quote". custom: never shown.
#   price_note optional muted line under the price
#   guide     optional: a guide page (/integrations/<guide>) the button opens
#             instead of the contact form; the guide's own button then goes to
#             the form. One of Integration::GUIDES.
#
#   dark      optional: true for an entry built but not offered yet. Only an
#             admin's /integrations lists it (to connect the hub's own
#             account); the public page does not show it at all.
#   connects  optional: the ways this entry connects (keys of connection_methods
#             below), in the order the card lists them
#   abilities optional: what the entry can do once connected, each
#               key    unique within the entry
#               name   customer-facing, one short phrase
#               via    the connection methods that unlock it; every one must be
#                      in the entry's `connects`, or the load fails
#               status live (default) or soon: an ability not delivered yet
#                      says Coming soon, the same honesty rule as an entry
#
# The button is not configured: it follows from the group and the status, so a
# Coming soon entry can never offer to connect. Every button opens the /contact
# form prefilled, carrying {page, item, intent} into the submission's `source`,
# except a signed-out visitor's on a Google sign-in card, which opens the
# sign-in modal (IntegrationsController::GOOGLE_CARDS).
#   connect, live or on_request       "Connect"       intent connect
#   connect, soon                     "Get notified"  intent notify
#   add_ons                           "Talk to us"    intent add_on
#   custom                            "Talk to us"    intent custom
# The ways an account can be connected (Mr. McRitchie, 2026-10-13): one
# integration can offer several, and they differ in who they cover, the setup
# they take and the upkeep they leave. A person's sign-in is one click but may
# ask again; an admin's grant takes two minutes and then needs nothing.
connection_methods:
  sign_in:
    label: Sign in
    covers: One person
    setup: One click
    upkeep: May ask you to sign in again
  admin_grant:
    label: Admin approval
    covers: Your whole company
    setup: About 2 minutes in your admin console
    upkeep: No upkeep
  app_install:
    label: Install our app
    covers: Your workspace
    setup: One install
    upkeep: No upkeep
  api_key:
    label: API key
    covers: What the key allows
    setup: Paste it once
    upkeep: Replace it when you rotate it
  managed:
    label: We run it
    covers: Everything
    setup: Nothing to do
    upkeep: We handle it

groups:
  - key: connect
    title: Connect
    kicker: Free
    summary: Sign in or install once. Pay the vendor directly; disconnect any time.
    entries:
      # One person's own Google sign-in, one read each (GoogleConnection::ABILITIES).
      # Any signed-in user sees each card's Connect or Disconnect for their own
      # account; an admin's are the household's, on /admin/google too
      # (IntegrationsController::GOOGLE_CARDS). Agents read the household, and
      # a client app's owner's own rows only for that owner's own CTO chat
      # (GoogleConnection.owned_by). A visitor's Connect opens the
      # sign-in modal, back to /integrations. A signed-in user's Gmail Connect
      # (and Connect Google while Gmail is missing) opens the Gmail admin-trust
      # modal first (modals/_gmail_admin); Calendar and Drive link straight.
      - key: google_calendar
        name: Google Calendar
        icon: "📅"
        tagline: "Your agents read your calendar before your meetings. Read only."
        blurb: Sign in with Google and your agents read your calendar to prepare you for meetings. Read only, so they cannot add, change or delete an event.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_calendar, name: Read your calendar to prepare for meetings, via: [sign_in] }
      - key: gmail
        name: Gmail
        icon: "✉️"
        tagline: "Your agents read your inbox for what needs an answer. Read only."
        blurb: Sign in with Google and your agents read your inbox to see what needs an answer. Read only, so they cannot send, change or delete mail. Turn on Organize as well, and they can label, archive, mark read or spam and add filters on your request; they still never send or delete.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_email, name: Read your inbox to see what needs an answer, via: [sign_in] }
          # Opt-in, its own Connect on the card (GoogleConnection::WRITE_ABILITIES).
          - { key: organize_email, name: "Label, archive and file your mail, on your request", via: [sign_in] }
      - key: google_drive
        name: Google Drive
        icon: "📁"
        tagline: "Agents read the files you pick and file what you ask them to."
        blurb: Sign in with Google, then pick the Drive files your agents may read; they answer from those files and no others. On your request they also create folders and file documents there, and see only what they create. They never change, share or delete a file.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_drive, name: Read the Drive files you pick to answer from them, via: [sign_in] }
          # GoogleConnect::DriveFiler, under the same drive.file scope (/tasks/drive-filing).
          - { key: file_drive, name: "Create folders and file documents in your Drive, on your request", via: [sign_in] }

      # One person's own Fathom sign-in (FathomConnection). Live on our own hub
      # (/admin/fathom); an admin sees the card's Connect or Disconnect
      # (IntegrationsController::FATHOM_CARD).
      - key: fathom
        name: Fathom
        icon: "🎙️"
        tagline: "Your agents read your meeting notes and transcripts. Read only."
        blurb: Sign in with Fathom and your agents read your meeting notes and transcripts to remember what was said. Read only, so they cannot change or delete a recording.
        status: live
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_meeting_notes, name: Read your meeting notes and transcripts, via: [sign_in] }

      # One person's sign-in to one Egnyte domain (EgnyteConnection), built dark:
      # the public page does not list it; an admin's does, with the card's
      # Connect (a domain field) or each domain and its Disconnect, and a
      # disabled Connect until the server holds the developer key
      # (IntegrationsController::EGNYTE_CARD).
      - key: egnyte
        name: Egnyte
        icon: egnyte
        tagline: "Your agents browse your Egnyte folders and file documents."
        blurb: Sign in to your Egnyte domain and your agents can browse its folders, read what each file is, and upload a document where you point them.
        status: soon
        dark: true
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: browse_files, name: Browse your folders and read file details, via: [sign_in], status: soon }
          - { key: upload_files, name: Upload a document to a folder you choose, via: [sign_in], status: soon }

      # A Microsoft 365 tenant, app-only through Microsoft Graph after one admin
      # approval (MsgraphConnection), built dark: the public page does not list
      # it; an admin's does, with each connected tenant and Connect, disabled
      # until MSGRAPH_CLIENT_ID and MSGRAPH_CLIENT_SECRET are set
      # (IntegrationsController::MSGRAPH_CARD).
      - key: microsoft_365
        name: Microsoft 365
        icon: "🏢"
        tagline: "Your agents read your users, Teams and SharePoint. Read only."
        blurb: A Microsoft 365 administrator approves us once, and your agents read your directory, your Teams and your SharePoint files. Read only, so they cannot send, change or delete anything.
        status: soon
        dark: true
        tier: pro
        connects: [admin_grant]
        abilities:
          - { key: read_directory, name: Read your users and Teams, via: [admin_grant], status: soon }
          - { key: read_files, name: Read your SharePoint files, via: [admin_grant], status: soon }

      - key: google_workspace_connect
        name: Google Workspace
        icon: google
        tagline: "Email drafting and a knowledge base from your Drive."
        blurb: Connect your own Workspace. It powers your email drafting agent and a knowledge base built from the Drive folders you choose.
        status: live
        tier: pro
        tier_note: Drafting agent from Team
        connects: [admin_grant]
        abilities:
          - { key: draft_email, name: Draft email replies for you to send, via: [admin_grant] }
          - { key: knowledge_base, name: A knowledge base from the Drive folders you choose, via: [admin_grant] }
      - key: discord
        name: Discord
        icon: discord
        tagline: "Our bot will post updates in your server and answer @‑mentions."
        blurb: "Two-way, on request: our bot will post sign-ups, errors and your agents' updates in your server, and answer when you @‑mention it."
        status: on_request
        tier: vibe
        guide: discord
        connects: [app_install]
        abilities:
          - { key: post_updates, name: "Post sign-ups, errors and agent updates", via: [app_install] }
          - { key: answer_mentions, name: Answer when you @‑mention it, via: [app_install] }
      - key: github_org
        name: GitHub
        icon: github
        tagline: "Your app's code in your own GitHub organization."
        blurb: Your app's code lives in your own GitHub organization, for white label and full ownership.
        status: on_request
        tier: enterprise
        connects: [app_install]
        abilities:
          - { key: host_code, name: Keep your app's code in your organization, via: [app_install] }
      - key: slack
        name: Slack
        icon: slack
        tagline: "Notifications and your agent's updates in your Slack."
        blurb: The same notifications, and your agent's updates, in your Slack workspace.
        status: soon
        connects: [app_install]
        abilities:
          - { key: post_updates, name: Post notifications and agent updates, via: [app_install], status: soon }

      # One person's own Intuit sign-in per QuickBooks Online company
      # (QuickbooksConnection). Built and dark on our own hub (/admin/quickbooks)
      # until the Intuit app is set up: `dark` keeps the tile off the public
      # page, and `soon` keeps it honest. An admin sees the card's Connect
      # (disabled until then) or each company's Disconnect
      # (IntegrationsController::QUICKBOOKS_CARD).
      - key: quickbooks
        name: QuickBooks Online
        icon: "📒"
        tagline: "Your agents read your company info and reports. Read only."
        blurb: Sign in with Intuit and your agents read your QuickBooks company info and reports, such as profit and loss. Read only, so they cannot change your books.
        status: soon
        dark: true
        tier: pro
        connects: [sign_in]
        abilities:
          - { key: read_reports, name: Read your company info and reports, via: [sign_in] }

  - key: add_ons
    title: We run it
    kicker: Add-on services
    summary: We set it up and keep it running, priced on top of your plan.
    entries:
      - key: google_workspace_managed
        name: Managed Workspace
        icon: google
        tagline: "We create and run your Google Workspace for you."
        blurb: We create and run your Google Workspace, users and settings. Connecting one you already have stays free.
        status: live
        price: "$25/month + $15/user/month"
        price_note: Google Business Starter seat included
        connects: [managed]
      - key: payments
        name: Payments in your app
        icon: "💳"
        blurb: Card, bank and crypto checkout built into your app.
        status: on_request
      - key: extra_builds
        name: Extra build requests
        icon: "🛠️"
        # Pro and Team promise an Always-on CTO with no monthly cap, so this
        # add-on is for Builder (Mr. McRitchie, 2026-10-13).
        blurb: More changes than Builder's several a month, or a second app.
        status: on_request
        tier: builder

  - key: custom
    title: Talk to us
    kicker: Custom
    summary: Rarer needs we scope with you, one client at a time.
    entries:
      # Stripe moved here from Integrations (Mr. McRitchie, 2026-10-13). Still
      # Coming soon: the code exists but is switched off.
      - key: stripe_connect
        name: Stripe
        icon: stripe
        blurb: Card payments into your own Stripe account.
        status: soon
        connects: [sign_in]
      - key: crypto
        name: Crypto and wallets
        icon: solana
        tagline: "Solana wallets and stablecoin payouts in your app."
        blurb: Wallet sign-in, on-chain vaults and stablecoin payouts on Solana.
        status: live
      - key: extra_storage
        name: Extra storage
        icon: "🗄️"
        tagline: "More database and file storage as your app grows."
        blurb: More database and file storage when your app outgrows its plan.
        status: on_request
      - key: ai_features
        name: AI features
        icon: "🧠"
        tagline: "Chat, search, summaries and agents in your app."
        blurb: Chat, search, summaries and agents built into your app, on the models that fit the job.
        status: on_request
      - key: custom_connectors
        name: Custom connectors
        icon: "🔌"
        tagline: "Your agent reads the systems you already use."
        blurb: Your agent reads the systems you already use, such as Egnyte, built for your business.
        status: soon
        connects: [sign_in, api_key]
      - key: enterprise_extras
        name: White label, domains and compliance
        icon: "🛡️"
        tagline: "Your brand everywhere, extra domains and compliance."
        blurb: Your brand on everything, extra domains, and compliance work such as CMMC and ITAR.
        status: on_request
        tier: enterprise
