# Which inbound messages reach which agent (docs/agents/system/agent-message-loop.md).
#
# Read by AgentMessages::Routes. Ids are Discord snowflakes, written as STRINGS
# (quoted): an unquoted 19-digit id is a YAML integer and loses nothing today, but
# every reader compares strings, and one quoted and one bare id never match.
#
# Only a guild listed here, and only a channel listed under it, is polled. A
# message there is routed to a soul by, in order:
#   1. a mention of a user listed under that soul's `users` (a per-soul bot user),
#   2. a mention of a role listed under its `roles` (one shared bot, @Avi/@Xan roles),
#   3. the channel's `default_soul`,
# and otherwise stored `unrouted` (kept, never handed to a worker). When a message
# addresses two souls, the one mentioned first in the text wins.
#
# `bot_user_id` is the shared bot's own user id. Messages written by any bot are
# not ingested at all, so the agents' own replies never come back as inbound.
#
discord:
  # The shared bot is Xan's own app (1Password `agents.discord.xan`) for the
  # first live test, 2026-10-14: it reads the channel and posts every reply.
  bot_user_id: "1481150857809760399"   # Xan (bot user)
  guilds:
    "1332466565203103744":             # McRitchie Studio
      name: McRitchie Studio
      channels:
        "1479973077021495478":         # lobster-tank, a quiet channel kept for the test
          name: lobster-tank
          default_soul: ""             # unmentioned messages are stored unrouted
      souls:
        xan:
          roles: []
          users: ["1481150857809760399"]   # @Xan, the bot user itself
  # A fuller shape, for reference:
  # guilds:
  #   "111111111111111111":           # the McRitchie server
  #     name: McRitchie
  #     channels:
  #       "222222222222222222":       # #agent-desk
  #         name: agent-desk
  #         default_soul: ""          # "" = unmentioned messages are unrouted
  #     souls:
  #       avi:
  #         roles: ["333333333333333333"]   # @Avi
  #         users: []                       # or a per-soul bot user id
  #       xan:
  #         roles: ["444444444444444444"]   # @Xan
  #         users: []
