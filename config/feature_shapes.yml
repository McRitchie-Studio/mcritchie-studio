# config/feature_shapes.yml
#
# The adaptive testing pyramid, as data. Maps a task's `devops.shape` → the test
# tiers that MUST be green (recorded in `devops.checks_run`) before the task may
# enter `submitted`, plus the metadata the task must carry. `bin/dor-check`
# reads this file.
#
# Tiers map onto the pyramid in docs/agents/system/devops-cycle-design.md (§3) and the
# lanes in config/devops_test_suites.yml. `manual` (operator visual acceptance)
# is NOT a DoR tier — it is gated at the release QA stop, not before `submitted`.
#
# CONVENTION — tag each satisfying `checks_run` line with its tier in leading
# square brackets so the gate can credit it deterministically:
#   [unit] bin/rails test test/models/upload_test.rb
#   [component] request spec + rendered _upload partial
#   [integration] request -> S3 (FakeVault) -> record
#   [e2e] npx playwright test e2e/upload.spec.js
# A tier counts as satisfied when at least one checks_run line is tagged with it.
#
# Known tiers: unit, component, integration, e2e
#
# `[control]` is NOT a tier and is not credited as one — it is the `test-only`
# shape's required evidence, and the tier-tag parser ignores it exactly as it
# ignores the `[full-suite@…]` / `[rubocop@…]` stamps below:
#   [control] pre-change test/integration/hub_test.rb at HEAD → 1 failure, line 42
# It must name a path that is in the diff, so it is about the change in hand.
#
# EVERY TIER HERE IS RUN BY A LANE **IN THIS REPO** — enforced, not promised.
# test/lib/feature_shape_tiers_test.rb asserts that every tier any shape below demands
# is EXECUTED by a real runner (.github/workflows/ci.yml, bin/fast-check,
# bin/full-suite-check). Add a tier to a shape with no lane behind it and that guard
# goes red. This is not decoration: until 2026-07-13 this file demanded `e2e` and
# `e2e_onchain` and NOTHING RAN EITHER — the tags were credited by bin/dor-check purely
# because a builder typed them into checks_run, so the gate demanded evidence it never
# collected and accepted a self-declaration in its place (the disease catalogued in
# docs/agents/audits/release-gate-and-devops-process-review-2026-07-12.md).
#
# ⚠️ READ THE BOLD PART: **IN THIS REPO**. That qualifier is not hedging — it is the exact
# edge of what the guard proves, and outside that edge the disease is still alive.
#
# THIS FILE IS ECOSYSTEM-WIDE. `bin/dor-check` reads it for a task in ANY repo. But a LANE is
# per-repo, and the guard runs in mcritchie-studio's CI, where no sibling repo is checked out.
# So it proves the claim for THIS repo's runners and is structurally blind to the others.
# Audited by hand, 2026-07-14 (do not re-derive; DO re-check when a repo is added):
#   · mcritchie-studio — `playwright` job in ci.yml.                        e2e COLLECTED.
#   · turf-monster     — `playwright` job in its own ci.yml.                e2e COLLECTED.
#   · rolio            — NO playwright lane. NO e2e/ directory AT ALL.      e2e **NOT COLLECTED**.
#     A `ui+db` task in rolio therefore demands the `e2e` tier that nothing in rolio runs, and
#     bin/dor-check credits the `[e2e]` tag a builder types. That is THE ORIGINAL BUG of
#     /tasks/e2e-tiers-are-decorative, still breathing, one repo over. It is not a live wound
#     today only because rolio is dormant — which is luck, not a mechanism, and luck is what
#     this file is supposed to have replaced.
#   · studio-engine, solana-studio, turf-vault — libraries/programs; no shape here demands e2e
#     of them (`library`/`onchain` are unit+integration).
# The fix is a per-repo tier-collectability check in bin/dor-check (resolve the task's repo,
# read ITS ci.yml through the bin/lib/ci_test_command.rb seam, REFUSE a tier that repo runs no
# lane for — fail closed, so deleting a lane goes red rather than granting an exemption).
# That is a gate change with its own blast radius, so it is a task, not a footnote:
# /tasks/dor-check-tiers-per-repo. Until it lands, this header claims only what it can prove.
#
# What that cost, measured the day the lane was finally switched on: the studio's
# 69-spec Playwright suite was 18 SPECS RED on an untouched `release` checkout. It had
# gone unrun long enough for a quarter of it to rot — board filters shipped and hid the
# cards its specs waited on; a seeded fixture string vanished. An uncollected tier does
# not sit idle and honest. It DECAYS, and the first person to trust it inherits the
# decay. (Repair: /tasks/repair-rotted-e2e-specs.)
#
# REMOVED 2026-07-13 — `e2e_onchain`. It was demanded by `onchain` and `onchain-vertical`
# and collected NOWHERE, and never had been: turf-vault (the Anchor program itself) has
# no CI at all, and turf-monster's devnet-nightly.yml — the only workflow that could
# serve — is gated on a repo variable, has completed `skipped` on every scheduled run,
# and has never once executed. So the strictest-LOOKING tier in the ecosystem was the
# emptiest, on the two shapes that move real money.
#
# It is not coming back as a tier until it is a lane. A "FRESH devnet run for this
# change" needs a funded bot wallet, a real cluster, SOL for a program deploy, and
# minutes of settle — it cannot be a cert or CI lane, and forcing it into one would only
# move the lie down a level. On-chain verification is REAL and still required; it is an
# operator/QA-stop act, the same category this file already carves out for `manual`
# below — NOT a pre-submit tier a builder self-certifies. Build the lane first:
# /tasks/build-devnet-e2e-lane. The guard test enforces that order.
#
# SEPARATE from these tier tags, the merge gate also requires FULL-suite + FULL-
# rubocop evidence, recorded as fingerprint-bound checks_run lines the tier-tag
# parser deliberately ignores (the `@<fingerprint>` is the tell):
#   [full-suite@<git-tree-hash>] bin/rails db:test:prepare test test:system green
#   [rubocop@<git-tree-hash>]    bin/rubocop clean
# `bin/full-suite-check <task>` runs both lanes IN FULL and stamps them; bin/dor-
# check re-grades them against the current code fingerprint so a touched-files
# subset or a since-edited tree is refused. See bin/lib/full_suite_gate.rb. The
# full-suite lane runs WHAT CI RUNS, verbatim (read from the repo's own ci.yml —
# bin/lib/ci_test_command.rb), so the CI-independent cert can never test LESS than
# CI; it used to run `bin/rails test`, which SKIPS the system tier.
#
# THE OTHER TWO CONTRACT KEYS — `dor_tiers` is not the only thing a shape can ask
# for, and two shapes now ask for something a tier list cannot express:
#
#   claimable_when: test_only_diff
#     The shape may be claimed ONLY on a diff bin/dor-check OBSERVES to be 100%
#     test files (bin/lib/test_only_diff.rb, an allowlist — an unrecognized file
#     blocks the claim). This is checked against the diff, never against the label.
#     A shape whose lighter contract is unlocked by TYPING its name is the
#     declaration-over-evidence disease this whole file exists to kill, one level
#     up: `kind: chore` was that bug, and PR #512 is what it cost.
#
#   full_suite_gate: true|false
#     Whether the merge gate demands fingerprint-bound FULL-suite + rubocop
#     evidence (see the block below). Until 2026-08-11 this was INFERRED from
#     `dor_tiers` being empty, so the only zero-tier shape (`docs`) silently
#     skipped the suite gate too — correct for prose, and a trap for any future
#     zero-tier shape, which would have inherited a suite-gate exemption nobody
#     chose. `test-only` is exactly that shape. The key is now explicit and
#     DEFAULTS TO TRUE (fail-closed), and test/lib/feature_shape_tiers_test.rb
#     requires any shape with no tiers to declare it, so the choice is made on
#     purpose and reviewed, rather than inherited from an unrelated field.
#
# This file is the single source of "how much testing is enough" per change
# shape. Tune it here; bin/dor-check and the heartbeat agent pick it up with no
# code change.

defaults:
  # Required on every shape unless the shape overrides required_metadata.
  required_metadata: [acceptance, repositories, risk_tags, test_plan]

shapes:
  ui-only:
    description: Presentation-only change (copy, styling, layout). No new logic, no persistence.
    dor_tiers: [component]
    required_metadata: [acceptance, repositories, risk_tags, test_plan, local_url]
    notes: Add a unit tier only if it introduces logic. Visual acceptance is the operator's at the release QA stop.

  ui+db:
    description: UI plus persistence — a form that writes, a record-backed view, a stateful flow.
    dor_tiers: [unit, component, integration, e2e]
    required_metadata: [acceptance, repositories, risk_tags, test_plan, local_url]
    notes: >-
      e2e here is the happy path, CHROMIUM ONLY (playwright.config.js runs one project) —
      there is no browser matrix and no nightly backstop anywhere in the ecosystem. If a flow
      needs cross-browser or deeper coverage, it needs a LANE first; do not thin an e2e spec
      on the belief that something else re-runs it wider.

  backend:
    description: Background job, service, or pure server logic with no UI surface.
    dor_tiers: [unit, integration]
    required_metadata: [acceptance, repositories, risk_tags, test_plan]
    notes: integration covers the job/service across its I/O boundary (RPC/queue/DB), mocked where external.

  library:
    description: Change in a shared gem (studio-engine / solana-studio) consumed by the apps.
    dor_tiers: [unit, integration]
    required_metadata: [acceptance, repositories, risk_tags, test_plan]
    notes: >-
      integration = the consumer-CI suite must pass in BOTH consuming apps.
      Per-app adoption tasks should declare `dependencies: [this-task]` so Avi
      sequences the gem release before the app releases.

  onchain:
    description: turf-vault program change or its Solana::* Ruby integration.
    dor_tiers: [unit, integration]
    required_metadata: [acceptance, repositories, risk_tags, test_plan]
    notes: >-
      unit+integration = Anchor instruction tests + a multi-instruction lifecycle.
      A fresh devnet run for the change is still REQUIRED before it ships — but it
      is an operator/QA-stop act (like `manual`), not a self-certified pre-submit
      tier: no lane has ever run it (see the e2e_onchain note in the header;
      /tasks/build-devnet-e2e-lane). Highest-scrutiny review (Opus).

  onchain-vertical:
    description: A full new workflow spanning wallet + DB + UI + program.
    dor_tiers: [unit, component, integration, e2e]
    required_metadata: [acceptance, repositories, risk_tags, test_plan, local_url]
    notes: >-
      Almost always a multi-task `release`. Highest scrutiny; usually
      conductor-review. Devnet verification is an operator/QA-stop act, as in
      `onchain` above.

  docs:
    description: Documentation-only change — SOP, runbook, agent-operating-model, or README. No code, no persistence.
    dor_tiers: []
    full_suite_gate: false
    required_metadata: [acceptance, repositories, risk_tags]
    notes: >-
      No code tiers: a doc change certifies by REVIEW, not a test lane — so
      dor_tiers is empty (nothing to fabricate) and the full-suite merge gate is
      skipped. `full_suite_gate: false` says that OUT LOUD; it used to be
      inferred from the empty tier list, which quietly made "no tiers" mean "no
      suite either" for every future shape. It routes to the documentation seat
      (Alex) in ReviewerSelector's SHAPE_DOMAINS. test_plan is dropped from
      required_metadata for the same reason there is nothing to plan; prose
      acceptance is the reviewer's and the operator's at the QA stop, not a
      pre-submit tier.

  test-only:
    description: A change whose entire content is test code — a fixed, deleted, added, or re-diagnosed test. No production diff.
    dor_tiers: []
    full_suite_gate: true
    claimable_when: test_only_diff
    required_evidence: [control]
    required_metadata: [acceptance, repositories, risk_tags, test_plan]
    notes: >-
      READ THIS BEFORE READING `dor_tiers: []` AS A DISCOUNT. It is not one, and
      the empty list is the smallest part of this shape's contract.

      WHY NO TIERS. Every other shape's tiers are evidence FOR a behavioral
      change. A test-only diff HAS no behavioral change, so the tier requirement
      has no subject — and demanding one anyway does not produce evidence, it
      produces theatre. Measured, 2026-08-10: a builder deleting ONE assertion
      from an integration test ran the hub's ENTIRE unit tier (4,103 runs, 20,827
      assertions) purely to have something truthful to tag. He was right to
      refuse to relabel a component test, and the tier he ran said nothing
      whatsoever about his change. A second builder the same night, on an
      e2e-helpers-only diff, recorded plainly that she had nothing to justify her
      shape with. Two agents, one night, independently.

      WHAT IT DEMANDS INSTEAD — strictly MORE than `backend` asked of those two
      changes, in three parts:

      (1) CLAIMABILITY IS VERIFIED, NOT DECLARED. `claimable_when:
      test_only_diff` — bin/dor-check reads the OBSERVED diff (PR files, else the
      task's git tree) and refuses this shape if ANY changed path is not provably
      test content, and refuses it again if no diff can be observed at all. The
      classifier is an allowlist (bin/lib/test_only_diff.rb): test/, tests/, e2e/
      and nothing else, so an unrecognized file BLOCKS the claim. This is the
      whole safety of the shape. Without it, a zero-tier shape is simply the
      shape every under-tested change claims, and this file's entire subject is
      what happens when a gate accepts a self-declaration.

      (2) THE FULL-SUITE MERGE GATE STILL APPLIES (`full_suite_gate: true`,
      unlike `docs`). Test code IS code: it runs, it can be broken, and a
      test-only diff is the change most able to break the suite silently. So the
      fingerprint-bound full-suite + rubocop evidence is required exactly as for
      a feature. That is this shape's EXECUTED evidence, and it is the reason the
      empty tier list costs nothing.

      (3) A CONTROL. `required_evidence: [control]` — record ONE
      `[control] ...` line in checks_run that answers the question a tier list
      cannot: DOES THE CHANGED TEST STILL BITE? dor-check requires the line to
      name a path that is actually in the observed diff, so it is about THIS
      change and re-runnable by the reviewer. Both motivating builders produced
      one unprompted, which is how we know it is the natural artifact: one ran
      the PRE-CHANGE file against the fixed engine and got exactly 1 failure at
      exactly the line he deleted (proving the deletion necessary AND sufficient,
      and that it masked no second break); the other forced a 404 and showed her
      new diagnostic printing the URL. Deleting or weakening an assertion is the
      case that removes safety, so the control is where a reviewer should spend
      their attention — name the file, the command, and the failure you observed.

      HONEST ABOUT (3), because this file's standard is to claim only what it
      proves: the control is CHECKED FOR STRUCTURE, not executed by a lane.
      dor-check verifies it exists and is about a file in this diff; it cannot
      verify the run happened. That is not an oversight to be papered over with a
      fake lane — a test-only diff leaves NO automatic mutation target (production
      code is unchanged, so there is no before/after to run), which puts the
      control in the same category this file already carves out for `manual` and
      devnet verification: real, required, and a REVIEW-checked act rather than a
      self-certified pre-submit tier. Deliberately NOT registered as a
      `dor_tiers` entry for that reason — test/lib/feature_shape_tiers_test.rb
      would (correctly) refuse a tier no runner runs. Executing the control's
      necessary half — replay the pre-change test files against current
      production code and require the verdict to differ — IS mechanizable for the
      modified-file case, and it is filed as its own task rather than half-built
      here: /tasks/execute-test-only-control.
