# SOUL SECRET SETS: which 1Password items each soul may read through the secret
# cache, and the admin tier that no soul holds. NAMES AND METADATA ONLY, never a
# value. Read by bin/lib/soul_secrets.rb (SoulSecrets); doc:
# docs/agents/modules/secret-cache.md, section "Soul secret sets".
#
# WHY (Alex McRitchie, 2026-11-09). Overnight a release waited four hours on one
# live `op item get solana.mack.agent`. A soul's set is warmed into
# <projects>/.secret-cache/<soul>/ when the soul launches (the SubagentStart hook
# runs `bin/secret warm <soul>`), so a later read hits the cache and a stalled
# 1Password costs nothing until an entry expires.
#
# THE TWO RULINGS (task soul-secret-sets, 2026-11-09):
#   1. Admin-vault items are reachable ONLY through allowlisted purpose-built
#      scripts. The agent never holds the value. Such a script reads from its own
#      admin tier (never a soul folder) with a short lifetime, and falls back to
#      1Password. See `admin_tier` below.
#   2. Each soul's set is a PORTABLE UNIT: its manifest (`bin/secret manifest
#      <soul>` prints it) plus that soul's own 1Password service account. A fresh
#      machine warms from the manifest file and the token alone:
#      `OP_SERVICE_ACCOUNT_TOKEN_<SOUL>=... bin/secret warm <soul> --manifest FILE`.
#
# FIELDS
#   souls.<slug>                 a slug from config/souls.yml (the test holds every
#                                roster soul to having a set, even an empty one)
#   service_account.token_env    the variable that holds THIS soul's own service
#                                account token. Unset: warm uses the machine's shared
#                                agent token (OP_SERVICE_ACCOUNT_TOKEN) and says so.
#   items[].item / lane          the 1Password item and its OpVaults lane
#                                (bin/lib/op_vaults.rb), never a vault literal: the
#                                vault resolves on the reading machine (`agent` ->
#                                MCR_OP_VAULT_AGENT, else its default). The `deployer`
#                                lane is refused here (it belongs in admin_tier).
#   items[].fields               the field labels kept on disk; every other field of
#                                the item is dropped at warm. List both spellings when
#                                the vault spells a label two ways.
#   items[].lifetime             how long a warmed copy is served: 30m, 12h, 1d.
#   items[].refresh_window       optional; a read or warm inside it re-reads 1Password
#                                (default: a tenth of the lifetime).
#   items[].readers              the scripts that read it (documentation, and the
#                                list a later ratchet enforces).
#   shared                       entries of the shared cache this soul also uses
#                                (github.agent, harness-key); listed, not copied.
#
# AN EMPTY SET IS HONEST. A soul's items are added from data (bin/op-reads names
# the item behind every bin/secret read), not from a guess.

souls:
  avi:
    about: QA and the release gauntlet. bin/release prepare runs turf-monster's devnet contest rehearsal, whose KeyStore reads these two wallets (lib/turf_monster/qa_rehearsal/key_store.rb ITEMS).
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_AVI
    shared: [github.agent, harness-key]
    items:
      - item: solana.mack.agent
        lane: agent
        fields: ["private key", "private-key", "wallet address", "wallet-address"]
        lifetime: 1d
        refresh_window: 2h
        readers: [bin/release, bin/shims/op-cache/op]
      - item: solana.turf.agent
        lane: agent
        fields: ["private key", "private-key", "wallet address", "wallet-address"]
        lifetime: 1d
        refresh_window: 2h
        readers: [bin/release, bin/shims/op-cache/op]
  steffon:
    about: Infrastructure. Its ship-lane credentials are admin-vault items and live in admin_tier, never here.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_STEFFON
    shared: [github.agent, harness-key]
    items:
      - item: heroku.studio.agents
        lane: agent
        fields: [credential]
        lifetime: 12h
        readers: [bin/lib/heroku_token.rb, bin/shims/heroku]
  alex:
    about: Sales and marketing. No item is named yet.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_ALEX
    shared: [github.agent, harness-key]
    items: []
  turf-monster:
    about: The Turf Monster operator. No item is named yet.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_TURF_MONSTER
    shared: [github.agent, harness-key]
    items: []
  mack:
    about: CFO. Mack's devnet wallet (solana.mack.agent) is signed with by the release gauntlet, which is Avi's set, not by Mack's books work.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_MACK
    shared: [github.agent, harness-key]
    items: []
  pokemon:
    about: The general builder. Builds read the shared GitHub token only.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_POKEMON
    shared: [github.agent, harness-key]
    items: []
  carl:
    about: Primary reviewer. Reviews read the shared GitHub token only.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_CARL
    shared: [github.agent, harness-key]
    items: []
  mason:
    about: COO and documentation reviewer.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_MASON
    shared: [github.agent, harness-key]
    items: []
  shannon:
    about: UI review light.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_SHANNON
    shared: [github.agent, harness-key]
    items: []
  jasper:
    about: On-chain review light. Mainnet signing keys are never in a soul set.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_JASPER
    shared: [github.agent, harness-key]
    items: []
  tyrion:
    about: Cyvasse's house player; client-facing, holds no credentials.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_TYRION
    shared: []
    items: []
  tywin:
    about: The Cyvasse operator. No item is named yet.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_TYWIN
    shared: [github.agent, harness-key]
    items: []
  hank:
    about: Commercial Welding business agent; not yet launched.
    service_account:
      token_env: OP_SERVICE_ACCOUNT_TOKEN_HANK
    shared: []
    items: []

# THE ADMIN TIER (ruling 1). No soul has it. A value is read only inside one of
# these scripts' own process, through SoulSecrets::Admin.read, and never printed:
# there is no `bin/secret` command that returns an admin value.
#
# storage: memory   THE OPEN CHOICE, decided here. "memory" keeps the value in the
#                   script's process for at most `lifetime`, and writes nothing.
#                   "disk" (0600, short TTL) is NOT implemented: every process on
#                   this Mac runs as the same Unix user, so a build lane, or a
#                   compromised gem or npm postinstall in a desk, could read the
#                   file directly and skip the allowlist, which is enforced only in
#                   the read path. Disk becomes safe only when the admin tier runs
#                   as its own Unix user (or a keychain item bound to the script).
#                   The doc names this threat.
admin_tier:
  # The OpVaults lane: its vault (MCR_OP_VAULT_ADMIN, else the default) and its
  # token variable come from bin/lib/op_vaults.rb.
  lane: deployer
  storage: memory
  lifetime: 15m
  # The ENTRY POINTS (the program a process runs as, $PROGRAM_NAME), relative to
  # the tooling root: the hub, a desk, or <projects>/.agents/tooling/<sha>. A
  # library is not an entry point. Adding one is a reviewed change. These are the
  # scripts that read an admin item today; moving each onto Admin.read is later work.
  scripts:
    - bin/release.rb
    - bin/gh-token
    - bin/heroku-token
    - bin/heroku-secret-set
    - bin/rotate-heroku-ci-key
