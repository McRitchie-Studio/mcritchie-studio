# Which inbound messages reach which agent (docs/agents/system/agent-message-loop.md).
#
# Read by AgentMessages::Routes. Ids are Discord snowflakes, written as STRINGS
# (quoted): an unquoted 19-digit id is a YAML integer and loses nothing today, but
# every reader compares strings, and one quoted and one bare id never match.
#
# THE GUILD IS THE BOUNDARY. Every text channel, thread and forum post in a guild
# listed here is read, with no per-channel entry: the Gateway listener as messages
# are posted, the backstop poll every 10 minutes. A guild the bot sits in that is
# NOT listed is ignored, and the log names it once.
#
# ONLY ADDRESSED MESSAGES ARE STORED. A message is kept, and routed to a soul, by:
#   1. a mention of a user listed under that soul's `users` (a per-soul bot user),
#   2. a mention of a role listed under its `roles` (one shared bot, @Avi/@Alex roles),
#   3. a reply to a message the mailbox holds, or to an agent's reply (same thread,
#      same soul unless the reply names another),
#   4. the channel override's `default_soul`.
# Anything else is dropped without being stored. When a message addresses two
# souls, the one mentioned first in the text wins.
#
# `channels` under a guild are OPTIONAL OVERRIDES, never an allow-list:
#   default_soul: avi   route this channel's unaddressed messages to avi
#   ignore: true        mute the channel: nothing in it is stored, mentions included
# A thread or forum post takes its parent channel's override unless it has its own.
#
# `ops_channel_id` is where the dispatcher's floor alert posts
# (docs/agents/agents/steffon/sops/agent-dispatcher.md).
#
# `bot_user_id` is the shared bot's own user id. Messages written by any bot are
# not ingested at all, so the agents' own replies never come back as inbound.
#
discord:
  # The shared bot is Alex's own app (1Password `agents.discord.xan`, a legacy title): it reads the
  # guild and posts every reply.
  bot_user_id: "1481150857809760399"   # Alex's bot user, named "Alex" in Discord (renamed 2026-10-27)
  # Where the floor alert (AgentDispatcherAlertJob) posts, as the same bot: a
  # silent bin/dispatcher, a routed message waiting too long, a submitted card
  # nobody started reviewing, a change card the build launcher could not start.
  # One alert per incident and one recovery line. lobster-tank until an ops channel exists.
  ops_channel_id: "1479973077021495478"
  guilds:
    "1332466565203103744":             # McRitchie Studio: every channel and thread
      name: McRitchie Studio
      souls:
        # Avi, the McRitchie Studio domain's front door (CTO): a mention of his
        # own Discord app's bot user (1Password `agents.discord.avi`). His replies
        # post through the shared bot, signed `**Avi** ·`, until Phase 4.
        avi:
          roles: []
          users: ["1560516264378507334"]   # @Avi (bot user)
        # Alex stays routed for Alex McRitchie as a helper; he has no catalog.
        alex:
          roles: []
          users: ["1481150857809760399"]   # the bot user itself (@Alex in Discord)
        # Turf (the turf_monster soul), the Turf Monster domain's front door: a
        # mention of the existing "Turf Monster" Discord app's bot user, found
        # 2026-10-15 as a member of this guild. Its replies still post through
        # the shared bot above, signed `**Turf** ·` (config/agent_domains.yml
        # reply_name) until Phase 4 gives each soul its own bot.
        turf_monster:
          roles: []
          users: ["1405042649479647293"]   # @Turf Monster (bot user)
        # Tyrion is NOT routed: he answers through OpenClaw with his own bot, and
        # routing him here too would answer every message twice (open decision in
        # .agents/epics/domain-agents.md).
  # A fuller shape, for reference:
  # guilds:
  #   "111111111111111111":           # the McRitchie server
  #     name: McRitchie
  #     channels:                     # optional overrides only
  #       "222222222222222222":       # #agent-desk
  #         name: agent-desk
  #         default_soul: avi         # unaddressed messages here go to avi
  #       "555555555555555555":       # #random
  #         name: random
  #         ignore: true              # muted, mentions included
  #     souls:
  #       avi:
  #         roles: ["333333333333333333"]   # @Avi
  #         users: []                       # or a per-soul bot user id
  #       alex:
  #         roles: ["444444444444444444"]   # @Alex
  #         users: []

# EMAIL (docs/agents/system/agent-message-loop.md, "Email"), read by
# AgentMessages::EmailRoutes. Mail to team@ reaches the hub through the Resend
# inbound (DeskCaptureResendIngestJob), is captured on the desk as always, and
# becomes an agent message only when it is for a CTO:
#   1. a To/Cc address is a CTO's `addresses` (avi@ is a Google group that
#      redirects into team@, so the original To survives), else
#   2. the mail is to team@ and its subject or first new line starts with a CTO's
#      `names` as an address: "Avi, …", "Avi: …", "Hi Avi, …", "@Avi …", else
#   3. it replies (In-Reply-To/References) to an email the mailbox holds.
# `from` is the From line of that CTO's replies, sent through Resend on the
# verified mcritchie.studio domain with Reply-To team@. Turf has no alias into
# team@ (turf@mcritchie.studio was deleted; team@turfmonster.media is a real
# mailbox on another domain), so it is reached by name and replies from team@.
# `agent_addresses` are the fleet's own: mail FROM any of them, the aliases or
# team@ is never answered (no CTO answers a CTO, and no reply answers itself).
# The floor alert's escalation to a person (AgentMessages::FloorAlert#escalate):
# ONE email when an incident has stayed open 15 minutes or flapped three times in
# an hour, and one on its final recovery, through the hub's outbox
# (Studio::Email.deliver). Absent, it goes to alex@mcritchie.studio.
floor:
  escalation_email: alex@mcritchie.studio
email:
  team_address: team@mcritchie.studio
  # Mail From these domains (or their subdomains) is verified only when every
  # DKIM-Signature aligned with the From domain is signed by exactly the listed
  # domain (d=) under one of these selectors (s=). Production refuses to boot
  # without a pin for team_address's domain (config/initializers/agent_email_pins.rb). mcritchie.studio also has
  # a `resend` key (resend._domainkey), so anyone holding RESEND_API_KEY could
  # send a DKIM-passing `From: alex@mcritchie.studio`; only Alex McRitchie's Google
  # Workspace key (`google._domainkey`) proves his mailbox. A pass under any
  # other selector is the public, held (AgentMessages::EmailTrust).
  pinned_dkim:
    mcritchie.studio: [google]
  souls:
    avi:
      addresses: ["avi@mcritchie.studio"]
      names: ["Avi"]
      from: "Avi <avi@mcritchie.studio>"
    turf_monster:
      addresses: []
      names: ["Turf"]
      from: "Turf <team@mcritchie.studio>"
  agent_addresses:
    - admin@mcritchie.studio
    - ray@mcritchie.studio
    - xan@mcritchie.studio    # the seat's address until ray-slug-rename (2026-10-18)
    - carl@mcritchie.studio
    - shannon@mcritchie.studio
    - jasper@mcritchie.studio
    - steffon@mcritchie.studio
    - mack@mcritchie.studio
    - mason@mcritchie.studio
    - rex@mcritchie.studio
    - pokemon@mcritchie.studio
    - team@turfmonster.media

# WEB CHAT (docs/agents/system/agent-message-loop.md, "Web chat"), read by
# AgentMessages::Routes#web_souls and bin/dispatcher (AgentMailbox.routed_souls).
# A signed-in app owner or admin chats with the app's CTO on
# /applications/:slug/chat; AgentMessages::WebIngest stores each message as a
# `web` AgentMessage routed to that app's CTO (config/cto_reports.yml, else a
# client app's AppCto row, soul client_cto), and the
# dispatcher answers it exactly as Discord. A CTO NOT listed here has no web
# chat: the page says so and nothing is stored. Listing a soul here also makes
# bin/dispatcher serve it, which is how Tyrion (not routed on Discord, where he
# answers through OpenClaw) is answered in the web chat: no guild is read for
# him, so nothing is answered twice.
#
# Alex is listed for the /build intake chat (BuildIntake::Ingest), which is not a
# CTO chat: no app's CTO is Alex, so listing him opens no /applications chat. It
# makes bin/dispatcher serve his web rows even if he leaves the Discord routes.
#
# `client_cto` is the ONE soul every client app's chat routes to: its persona is
# filled per app from that app's AppCto row (docs/agents/system/client-cto.md).
# It reads no guild and has no email route. Listing it here is what makes
# bin/dispatcher serve it (a running dispatcher restarts itself when this file
# changes: AgentMailbox::CodeFingerprint).
web:
  souls: [avi, turf_monster, tyrion, alex, client_cto]
