# THE NAVIGATION REGISTRY — every page the hub links from a nav, and every page a
# visitor may open. Loaded by app/models/navigation.rb. Three readers:
#
#   · the link sidebar, /links and /admin/basement   LinkTreeHelper
#   · the section sub-navs                        components/_sub_nav
#   · the admin wall's public PAGE list           AdminWall::PUBLIC_PAGES
#
# pages     One entry per page, keyed by its ROUTE NAME (tasks -> tasks_path).
#             page      controller#action the route serves. The wall reads this,
#                       so it is spelled out; test/models/navigation_test.rb holds
#                       it equal to the route table.
#             audience  public (any visitor) or admin. Nothing else loads, but
#                       signed_in: a page AdminWall::SIGNED_IN opens to any
#                       signed-in user, whose nav entry is an admin's. A page
#                       that is not listed here is admin-only: the wall is
#                       default-deny, and this file can only open what it names.
#             args      positional arguments for the route helper.
#             label, emoji, hover_emoji, desc   how a nav shows the page.
#             parent    the page above this one, a page key. The crumb trail over a
#                       page's title walks it up to a page with none
#                       (config/initializers/studio_crumbs.rb, studio-engine's
#                       docs/PAGE_HEADER.md). Each page names only its parent.
#             crumb     a shorter label for the page in a crumb trail.
#             icon      the link sidebar's line icon, a name from studio-engine's
#                       Studio::Icons. It replaces the emoji and the hover swap under
#                       Studio.sidebar_style = :glass; the emoji stays the fallback.
#                       Not the sub-nav item's `icon: true` below, which means lead
#                       with the page's emoji.
#
# sidebar   The link sections, in order. group: admin sections lead the sidebar for
#           an admin; group: general sections follow and fill /links; group: basement
#           sections never reach the sidebar and fill /admin/basement. /admin/links
#           redirects there.
#           Every sidebar and /links also have Studio: Build, Chat, Portfolio, Packages
#           and Integrations (LinkTreeHelper#studio_link_section), which is not a
#           section here. A signed-out visitor's sidebar is only Sign In and Studio, one
#           line each. No Basement section takes the name Studio.
#           An entry shows when its page is public or the viewer is an admin, and
#           a section with no visible entry is dropped.
#           An entry in pages is a page key, or { page:, label: } to show another
#           word in that section only; the page keeps its label everywhere else.
#           TO SEND A LINK TO THE BASEMENT, move its key to a basement section. To
#           send a whole section, change its group to basement. Its route stays.
#
# sub_navs  One per section of the app. style picks the look (links, buttons or
#           chips); label is the nav landmark's name. Item keys:
#             page               the page it links
#             label              overrides the page's label
#             icon               true to lead with the page's emoji
#             back               true to lead with a back arrow
#             only / except      page keys the item shows on / hides on
#             hide_when_current  drop the item on its own page
#             narrow_only_on     page keys where it shows only while that page's board is
#                                too narrow for all its lanes (the board's boardNarrow)
#             badges             count badges, by stage
#             count              { key:, id: } a tally the caller supplies
#             test_id            the data-test hook
#
# MAKING A PAGE PUBLIC is an edit of `audience` here plus the expected list in
# test/integration/admin_wall_public_set_test.rb, which fails until both agree.
# A public action that is not a page (a form post, a probe, a tracking pixel, an
# auth door) belongs in AdminWall::PUBLIC_ACTIONS instead.
---
