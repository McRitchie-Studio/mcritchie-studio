# THE RUBY SUITE'S RATCHET — the contract test/lib/test_health_ratchet_test.rb enforces.
#
# config/e2e_lane.yml has done this for the browser lane since it was written; nothing
# did it for the 6,582 Ruby test cases. These two numbers are the ones that can rot a
# suite silently, because neither shows up as a failure:
#
#   skips           a test switched off without being deleted. The suite keeps its
#                   name and loses its coverage. 18 of 100 e2e specs are already in
#                   that state, and until now the Ruby side was not counted at all.
#
#   assertion_free  a test that exercises code and asserts nothing about it. It goes
#                   green whatever the code does, which is worse than no test — it
#                   reports coverage it does not have.
#
# THESE ARE EXACT, NOT CEILINGS, deliberately and for the same reason e2e_lane.yml is
# exact. A ceiling silently re-permits every regression up to it, and drifts stale the
# moment someone improves things. Exact means ANY movement — up OR down — is an
# explicit, reviewable edit to this file, sitting in the diff next to the change that
# caused it. Lowering these is the good kind of edit; make it freely.
#
# OPERATOR DECISION 2026-08-14 (Mr. McRitchie): FREEZE FIRST. This holds the line; it
# does not set out to drive the numbers down. Reducing them is a separate, later call
# once the floor has proven cheap. See test-steward-grooms-suite for the grooming act
# that proposes reductions — and note the rule it works under: a test may only be
# deleted or merged by demonstrating that the mutation it caught is still caught.
# +1 (2026-09-25, wire-cyvasse-production-deploy): 25 -> 26. The cyvasse drift guard
# in test/models/release/repos_test.rb reads cyvasse's OWN ci.yml from its sibling
# checkout and skips where none exists (the hub CI runner), exactly like the rolio and
# mcritchie-industries guards beside it. The shape pins above it still bind on CI.
skips: 26
assertion_free: 0

# FROZEN HOTSPOTS — files that may not GROW.
#
# These five are the test suite's conflict hotspots, and the mechanism is APPEND:
# test/lib/release_cli_test.rb alone was touched by 26 of the last 200 merged PRs, and
# they collide because everyone adds at the bottom of the same file. Splitting the
# existing content was measured and rejected as the first move — 297 tests with 46
# helpers and 56 constants interleaved, 9 of which have call sites spanning the whole
# file, so a split needs planned harness extraction and risks silent test LOSS. See
# the archived task split-release-cli-tests for the numbers.
#
# Freezing costs nothing and attacks the same mechanism: a new test has to go
# somewhere else, which gives the suite several bottoms instead of one. That is the
# convention every test written in this session already followed by hand.
#
# THESE ARE CEILINGS, NOT EXACT — the opposite of the two counts above, deliberately.
# A count changes only when someone adds or removes a skip, so exactness costs nothing
# and catches everything. A line count changes on EVERY legitimate edit to an existing
# test, so demanding exactness would fail the build for fixing a typo. Shrinking is
# always allowed and never needs an edit here; lowering a ceiling after real work is
# welcome but never required.
frozen_size:
