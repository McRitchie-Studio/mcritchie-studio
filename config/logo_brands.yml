# Logo brand styles: the data Logos::NavbarLogo (lib/logos/navbar_logo.rb)
# draws a brand's Navbar Logo and icon from, and Logos::StackedLogo its Stacked
# Logo. Rules and rake task: docs/topics/logos.md.
#
# title      optional: the brand's name as the gallery says it, where the name's
#            words would not tell two versions of a brand apart
# name       two words, a first word and an ending; the logo sets them on one
#            line beside the icon. A brand with `lettering` may end in several
#            traced words ("COMMERCIAL WELDING LLC": the ending is WELDING LLC)
# icon       a key in the icon data (lib/logos/data/brand_icons*.json)
# lettering  optional: a key in lib/logos/data/brand_lettering.json. The name is
#            then set from the brand's own traced letters, not Montserrat: one
#            weight, so `highlight: colour` only, and no `heavy`, `light` or
#            `tracking`
# highlight  how one word leads the other:
#              weight  the leading word is `heavy`, the other `light`
#              colour  both words are `heavy`; the leading word takes `accent`
# heavy      Montserrat weight for homogeneous text and the leading word
# light      the quiet word's weight (highlight: weight only)
# stacked    optional: the Stacked Logo's form (Logos::StackedLogo). `two_line`
#            (default) sets the first word big and the second small beneath it;
#            `one_line` sets the whole name on one line, for a brand whose
#            second word is too wide to sit under its first
# tagline    optional: the brand's tagline as the logo sets it, in capitals with
#            no full stop. The Stacked Logo's tagline form sets it under the
#            name in Montserrat 500 (Logos::StackedLogo); every character must be
#            in the glyph data. A brand without one has no tagline form
# tracking   optional: extra space after every letter, in em (negative tightens)
# note       optional: one line the brand's page shows about where its art came from
# tones      the ALT colouring (task logo-original-and-alt): one solid colour per
#            part, the fills for a light and a dark background. `text` is the name's
#            colour; `quiet` (optional, defaults to `text`) is the non-leading
#            word under highlight: weight; `accent` is the leading word under
#            highlight: colour; `icon` maps each icon layer role to a fill;
#            `icon_key` (optional) names a different icon for this tone.
# original   optional: the ORIGINAL colouring, the brand's true art (its kit's
#            own logo), as `light` and `dark`, each a map like a tone: `text`,
#            `quiet`, `accent` and `icon` fills and an optional `icon_key` (the
#            original's own icon data). A brand whose logo is solid colour
#            (Studio) has none, and draws Alt only. Edits and the watermark
#            never use it. An original's fill may be url(#<id>), naming a
#            gradient its own icon data declares in `defs`; every other fill is
#            a #hex.
# watermark  optional: the watermark logo (the whole logo in one colour, slightly
#            transparent, for placing over a photograph). `fill` (default
#            "#FFFFFF"), `opacity` (greater than 0, at most 1; default 0.6) and
#            `icon_key`, a single-colour icon for a brand whose own icon would
#            fill in solid when every layer takes the one colour.
# palette    the brand's colours, as the gallery shows them: an ordered list of
#            {name, hex}, one list per brand, no split by tone (Logos::BrandKit).
#            The logo fills above stay per tone; the palette is what the gallery
#            shows, and the only colours its edit panel may pick (task
#            logo-part-editor, docs/topics/logos.md)
# typefaces  the brand's typeface hierarchy, most prominent first, 1 to 3 levels
#            of {role, family, weight}. `family` is a face the hub serves
#            (Montserrat). A level set in the brand's own traced lettering has no
#            family and no weight, only a `label` saying so (Logos::BrandKit)
#
# Fills are solid #hex only, except an original's gradients (above).

studio:
  name: McRITCHIE STUDIO
  tagline: BUILD SMARTER
  icon: studio
  highlight: weight
  heavy: 800
  light: 300
  palette:
    - { name: Ink, hex: "#1A1535" }
    - { name: Violet, hex: "#8E82FE" }
    - { name: Deep Violet, hex: "#635BB2" }
    - { name: Violet Mist, hex: "#EEECFF" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 800 }
    - { role: Text, family: Montserrat, weight: 300 }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#1A1535"
      icon: { primary: "#1A1535" }
    dark:
      text: "#FFFFFF"
      icon: { primary: "#8E82FE" }

industries:
  name: McRITCHIE INDUSTRIES
  tagline: BUILD BETTER
  icon: industries
  highlight: weight
  heavy: 700
  light: 300
  note: The Original is the marketing kit's own light and dark icon, with its steel gradient and ruler ticks, and the name in the kit wordmark's steel gradient. Alt draws the icon flat, as two solid layers.
  palette:
    - { name: Forge Orange, hex: "#C8661F" }
    - { name: Ember Orange, hex: "#E07B2E" }
    - { name: Charcoal Steel, hex: "#262A30" }
    - { name: Gunmetal, hex: "#59606A" }
    - { name: Brushed Steel, hex: "#8C939C" }
    - { name: Light Steel, hex: "#D3D6DA" }
    - { name: Shop Black, hex: "#141516" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 700 }
    - { role: Text, family: Montserrat, weight: 300 }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#262A30"
      quiet: "#41464D"
      icon: { primary: "#262A30", edge: "#8C939C" }
    dark:
      text: "#F4F5F7"
      quiet: "#D3D6DA"
      icon: { primary: "#D3D6DA", edge: "#FFFFFF" }
  # The kit's 05_icon light and dark SVGs (steel gradient, ruler ticks) and its horizontal logos' lettering: the
  # leading word in the wordmark's steel gradient, the other word in the kit's solid gunmetal (light) or light steel.
  original:
    light:
      icon_key: industries_original_light
      text: url(#steel_name)
      quiet: "#41464D"
      icon: { primary: url(#steel), edge: "#8C939C", ticks: "#3A3F45" }
    dark:
      icon_key: industries_original_dark
      text: url(#steel_name)
      quiet: "#D3D6DA"
      icon: { primary: url(#steel), edge: "#FFFFFF", ticks: "#6B7179" }

turf:
  name: Turf Monster
  icon: turf
  highlight: colour
  heavy: 800
  tracking: -0.025
  stacked: one_line
  note: The head is auto-traced from the 880 px picture, with its grass texture flattened to three solid colours.
  palette:
    - { name: Brand Green, hex: "#4BAF50" }
    - { name: Forest, hex: "#2E7D32" }
    - { name: Deep Green, hex: "#1A550D" }
    - { name: Grass, hex: "#5C972A" }
    - { name: Cream, hex: "#F0EBCF" }
    - { name: Ink, hex: "#1A1535" }
    - { name: Violet, hex: "#8E82FE" }
  typefaces:
    - { role: Display, family: Montserrat, weight: 800 }
    - { role: Text, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#1A1535"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
    dark:
      text: "#FFFFFF"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
  # The three-colour head, the brand's own art, in both tones: ink and green lettering on light, white and green on dark.
  original:
    light:
      text: "#1A1535"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
    dark:
      text: "#FFFFFF"
      accent: "#4BAF50"
      icon: { outline: "#1A550D", body: "#5C972A", light: "#F0EBCF" }
  watermark:
    icon_key: turf_mono

welding:
  title: Commercial Welding v1
  name: COMMERCIAL WELDING LLC
  tagline: BUILDING STRONG CONNECTIONS
  icon: welding
  lettering: welding
  highlight: colour
  note: The helmet and the lettering are auto-traced from the current PNG files. The name is the kit's whole name, COMMERCIAL WELDING LLC, drawn without the service mark. The Original is the kit's square logo, traced in its three colours; its helmet's right half is filled white, so it holds on a dark page. The kit has no lettering for dark pages, so the Original's name is white there, with the accent orange. In Alt on a dark page the helmet is the single-colour version.
  palette:
    - { name: Welding Blue, hex: "#2D5E8E" }
    - { name: Spark Orange, hex: "#D7602E" }
    - { name: Ember, hex: "#F08A5A" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, label: Traced lettering (face not identified) }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#2D5E8E"
      accent: "#D7602E"
      icon: { primary: "#2D5E8E", accent: "#D7602E" }
    dark:
      icon_key: welding_mono
      text: "#FFFFFF"
      accent: "#F08A5A"
      icon: { primary: "#FFFFFF" }
  # The kit's square logo (COM - Square - Large.png): the icon fills are sampled from it; the name colours are the
  # kit's blue and orange (the tagline in orange). The kit has no dark lettering: on dark the name is white.
  original:
    light:
      icon_key: welding_original
      text: "#2D5E8E"
      quiet: "#D7602E"
      accent: "#D7602E"
      icon: { blue: "#2E5E8E", white: "#FFFFFF", accent: "#D5752B" }
    dark:
      icon_key: welding_original
      text: "#FFFFFF"
      quiet: "#D7602E"
      accent: "#D7602E"
      icon: { blue: "#2E5E8E", white: "#FFFFFF", accent: "#D5752B" }
  watermark:
    icon_key: welding_mono

# Alex's item 5 (task welding-llc-and-v2-helmet): v1 beside v2, to compare his tweaks with the original branding. The
# helmet is v1's, derived by Logos::WeldingV2 (rake logos:welding_v2); the name is v1's without LLC.
welding_v2:
  title: Commercial Welding v2
  name: COMMERCIAL WELDING
  tagline: BUILDING STRONG CONNECTIONS
  icon: welding_v2
  lettering: welding
  highlight: colour
  note: Commercial Welding v1's traced helmet with two tweaks. It is centred on the line where its two halves meet, so the logo's vertical guide runs through it. Its lens and frame are moved down so the lens is centred on the middle of the rule of 3's rows; the lens is a little shorter than one row. The name is drawn without “LLC” and the service mark. The Original is v1's Original (the kit's square logo) with the same two tweaks; the kit has no lettering for dark pages, so its name is white there, with the accent orange. In Alt on a dark page the helmet is the single-colour version.
  palette:
    - { name: Welding Blue, hex: "#2D5E8E" }
    - { name: Spark Orange, hex: "#D7602E" }
    - { name: Ember, hex: "#F08A5A" }
    - { name: White, hex: "#FFFFFF" }
  typefaces:
    - { role: Display, label: Traced lettering (face not identified) }
    - { role: Tagline, family: Montserrat, weight: 500 }
  tones:
    light:
      text: "#2D5E8E"
      accent: "#D7602E"
      icon: { primary: "#2D5E8E", accent: "#D7602E" }
    dark:
      icon_key: welding_v2_mono
      text: "#FFFFFF"
      accent: "#F08A5A"
      icon: { primary: "#FFFFFF" }
  # v1's Original with the v2 derivation applied (Logos::WeldingV2: welding_v2_original), in v1's Original colours.
  original:
    light:
      icon_key: welding_v2_original
      text: "#2D5E8E"
      quiet: "#D7602E"
      accent: "#D7602E"
      icon: { blue: "#2E5E8E", white: "#FFFFFF", accent: "#D5752B" }
    dark:
      icon_key: welding_v2_original
      text: "#FFFFFF"
      quiet: "#D7602E"
      accent: "#D7602E"
      icon: { blue: "#2E5E8E", white: "#FFFFFF", accent: "#D5752B" }
  watermark:
    icon_key: welding_v2_mono
