---
# THE RUBY SUITE'S RATCHET — the contract test/lib/test_health_ratchet_test.rb enforces.
#
# config/e2e_lane.yml has done this for the browser lane since it was written; nothing
# did it for the 6,582 Ruby test cases. These two numbers are the ones that can rot a
# suite silently, because neither shows up as a failure:
#
#   skips           a test switched off without being deleted. The suite keeps its
#                   name and loses its coverage. 18 of 100 e2e specs are already in
#                   that state, and until now the Ruby side was not counted at all.
#
#   assertion_free  a test that exercises code and asserts nothing about it. It goes
#                   green whatever the code does, which is worse than no test — it
#                   reports coverage it does not have.
#
# THESE ARE EXACT, NOT CEILINGS, deliberately and for the same reason e2e_lane.yml is
# exact. A ceiling silently re-permits every regression up to it, and drifts stale the
# moment someone improves things. Exact means ANY movement — up OR down — is an
# explicit, reviewable edit to this file, sitting in the diff next to the change that
# caused it. Lowering these is the good kind of edit; make it freely.
#
# OPERATOR DECISION 2026-08-14 (Mr. McRitchie): FREEZE FIRST. This holds the line; it
# does not set out to drive the numbers down. Reducing them is a separate, later call
# once the floor has proven cheap. See test-steward-grooms-suite for the grooming act
# that proposes reductions — and note the rule it works under: a test may only be
# deleted or merged by demonstrating that the mutation it caught is still caught.
skips: 25
assertion_free: 0

# FROZEN HOTSPOTS — files that may not GROW.
#
# These five are the test suite's conflict hotspots, and the mechanism is APPEND:
# test/lib/release_cli_test.rb alone was touched by 26 of the last 200 merged PRs, and
# they collide because everyone adds at the bottom of the same file. Splitting the
# existing content was measured and rejected as the first move — 297 tests with 46
# helpers and 56 constants interleaved, 9 of which have call sites spanning the whole
# file, so a split needs planned harness extraction and risks silent test LOSS. See
# the archived task split-release-cli-tests for the numbers.
#
# Freezing costs nothing and attacks the same mechanism: a new test has to go
# somewhere else, which gives the suite several bottoms instead of one. That is the
# convention every test written in this session already followed by hand.
#
# THESE ARE CEILINGS, NOT EXACT — the opposite of the two counts above, deliberately.
# A count changes only when someone adds or removes a skip, so exactness costs nothing
# and catches everything. A line count changes on EVERY legitimate edit to an existing
# test, so demanding exactness would fail the build for fixing a typo. Shrinking is
# always allowed and never needs an edit here; lowering a ceiling after real work is
# welcome but never required.
frozen_size:
  # +8 (2026-08-19, install-engine-migrations-in-sweep): the gem-publish flow stub
  # gained a seam for install_engine_migrations!, which does real bundler and rails
  # work in what is a bare tmpdir here. The step's OWN behaviour went to a new file,
  # test/lib/release_engine_migration_install_test.rb, which is what this ceiling
  # asks for; only the stub grew this one.
  #
  # +61 (2026-08-22, drop-chain-ops-system-lane): two deploy_app cases — an app
  # with NO prod_deploy (ship advances main and dispatches nothing) and a typo'd
  # strategy (still aborts, before main moves). They belong beside the three
  # existing deploy_app adapter tests and lean on this file's PRIVATE harness
  # (run_cli, build_sibling_fixture, run_git, git_out), which is precisely the
  # interleaving the archived split-release-cli-tests task measured and deferred.
  # The new PURE decisions went to other files, as this ceiling asks:
  # deploy_target? and missing_deploy_commands are tested in
  # test/models/release/ship_sequence_test.rb.
  #
  # +3 (2026-08-28, suite-must-not-mutate-repos): a NET STRUCTURAL WIN that costs
  # three lines here. The two archive tests stubbed the conductor and the worktree
  # reclaim but not sweep_artifacts, sweep_docs or commit_artifact_to_release, and
  # `archive` calls all three with apply: true — so `bin/rails test` ran
  # bin/clean-artifacts and bin/archive-docs FOR REAL against the developer's
  # machine (32.9 MB reclaimed across 9 repos / 32 worktrees, and a git mv in the
  # PRIMARY checkout the next run then died on). The fix went where this ceiling
  # asks: the shared stub moved OUT to test/support/release_archive_seams.rb and
  # the new guard to test/lib/release_archive_isolation_test.rb — 69 lines
  # relocated, two new files, nothing appended at the bottom. What remains here is
  # one `require_relative` and two interpolations of the shared stub, one in each
  # of the two existing stub constants. Those three cannot move: they are the
  # call sites.
  test/lib/release_cli_test.rb: 7428
  test/lib/dor_check_test.rb: 2745
  test/lib/task_cli_test.rb: 2728
  test/models/task_test.rb: 2266
  # +77 (2026-08-27, retire-acquisition-studio-checkout): three CLI-level tests for
  # the origin-unreachable withhold — the error case, the retired-repo (:gone) case,
  # and `cleanup --write` not filing a withheld desk into the delete-later ledger.
  # They stay in THIS file deliberately, against this ceiling's usual advice. The
  # behaviour is only observable through the real CLI against the staged git worktree,
  # and it needs this file's private harness wholesale — agent_worktree, command_env,
  # removal_env, mark_worktree_merged_to_origin_main, plant_task_bin_with_lapsed_claim,
  # abandon_desk!. A new file could only get them by duplicating the fixture, and the
  # tests are exact NEGATIVES of the positive control that already lives here (same
  # desk, same lapsed claim, one variable flipped), which is most of their value.
  # The PURE decisions stay split out in test/commands/origin_unreachable_reclaim_test.rb,
  # which is what this ceiling actually asks for.
  test/commands/agent_worktree_test.rb: 2340
