# Fixture names are kept stable (referenced across many test files); their stages
# are the two-workflow model. new_task/queued_task = designed (not yet built),
# in_progress = building, done = shipped, failed = blocked.
new_task:
  title: New Task
  slug: task-aaa111
  stage: designed
  priority: 0
  position: 0

queued_task:
  title: Queued Task
  slug: task-bbb222
  stage: designed
  priority: 1
  position: 1

in_progress_task:
  title: In Progress Task
  slug: task-ccc333
  stage: building
  priority: 0
  started_at: 2026-04-01 11:00:00
  agent_slug: alex
  position: 0

done_task:
  title: Done Task
  slug: task-ddd444
  stage: shipped
  priority: 0
  completed_at: 2026-04-01 12:00:00
  position: 0

# A blocked task: `blocked` is a `building` ATTRIBUTE now (blocked_at set), not a
# stage. #blocked? re-derives it from blocked_at + the building stage.
failed_task:
  title: Failed Task
  slug: task-eee555
  stage: building
  priority: 0
  blocked_at: 2026-04-01 13:00:00
  blocked_from: submitted
  blocked_by: avi
  block_kind: rework
  error_message: Something went wrong
  position: 0
