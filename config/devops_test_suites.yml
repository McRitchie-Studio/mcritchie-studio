# Canonical test-scope registry.
#
# Four sections:
#   apps.<slug>.suites — the per-app test-suite CATALOG (`bin/devops-tests`
#     prints it for fresh sessions; docs/agents/modules/testing.md documents it).
#   release_scopes — the scopes `bin/release` RUNS (run_test_scope in
#     bin/release.rb resolves a scope key here and emits START/COMPLETED/FAILED
#     telemetry stamped with this metadata).
#   full_suite_scopes — the LOCAL cert lanes `bin/full-suite-check` RUNS. Each
#     lane self-reports a kind=test_scope AgentAction (via the same
#     bin/agent-activity `action` verb) tagged with its key here, so a local cert
#     is a gradeable /alex/pipeline unit like a release run. Kept SEPARATE from
#     release_scopes so bin/release.rb's registry stays release-only; the pipeline
#     helper reads BOTH sections for phase/tier/host chips.
#   ci_scopes — the GitHub Actions jobs `bin/ci-scope-capture` INGESTS. It reads a
#     PR's `gh pr checks` and self-reports one kind=test_scope AgentAction per
#     completed job through the SAME `action` verb — so a CI run is a gradeable
#     /alex/pipeline unit like a local cert or release run, WITHOUT a CI secret,
#     ci.yml change, or server POST from CI. Keys match ci.yml's jobs.
#
# Every suite/scope carries a STABLE `key` (never rename one casually — emitted
# telemetry and grading key off it) plus:
#   phase:  build | ci | qa | ship   — where in the pipeline it runs
#   tier:   unit | integration | e2e | smoke | build | hook | full
#   host:   local | qa | devnet | production | ci   (ci = a GitHub Actions runner)
#   blocks: blocking | seal | advisory — blocking gates abort their pipeline;
#           a seal records a verdict post-deploy without aborting; advisory
#           informs only
#   mutates: true when it creates or changes data
# The older per-suite fields (lane/environment/trigger/command/blocks_merge/
# notes) are unchanged — bin/devops-tests still reads them.
#
# A suite and a release scope can share a key when they are the SAME scope seen
# from both sides (the hub's production read-only smoke IS the conductor's
# prod_smoke_seal).
apps:
  mcritchie-studio:
    display_name: McRitchie Studio
    qa_url: https://qa.mcritchie.studio
    # Canonical production host. Keep this in sync with config/qa_environments.yml
    # production_url and config/release_repos.yml prod_deploy.smoke_url so the
    # /up hard-gate and post-ship smoke hit the same public server.
    production_url: https://mcritchie.studio
    suites:
      - name: Rails unit and controller
        key: studio_rails_test
        phase: ci
        tier: unit
        host: local
        blocks: blocking
        lane: pr_review_gate
        environment: local
        trigger: Every feature PR and before deploy
        command: bin/rails test
        blocks_merge: true
        mutates: false
        notes: Covers models, controllers, jobs, and integration request flows.
      - name: Tailwind build
        key: studio_tailwind_build
        phase: ci
        tier: build
        host: local
        blocks: blocking
        lane: pr_review_gate
        environment: local
        trigger: UI/CSS/theme PRs and before deploy
        command: bin/rails tailwindcss:build
        blocks_merge: true
        mutates: false
        notes: Proves Tailwind v4 assets compile before QA or production.
      - name: Local browser smoke
        key: studio_local_e2e
        phase: build
        tier: e2e
        host: local
        blocks: blocking
        lane: local_proof
        environment: local
        trigger: UI/auth/task-flow PRs
        command: E2E_PORT=<port> npx playwright test
        blocks_merge: true
        mutates: true
        notes: Uses local worktree database and local email capture.
      - name: QA read-only smoke
        key: studio_qa_readonly
        phase: qa
        tier: e2e
        host: qa
        blocks: advisory
        lane: qa_acceptance
        environment: qa
        trigger: After QA deploy
        command: QA_BASE_URL=https://qa.mcritchie.studio npx playwright test --grep @qa-readonly
        blocks_merge: false
        mutates: false
        notes: Banner, signin, task board, and public page health checks.
      - name: Production read-only smoke
        key: prod_smoke_seal
        phase: ship
        tier: e2e
        host: production
        blocks: seal
        lane: production_smoke
        environment: production
        trigger: Post-ship, after the /up hard-gate (bin/release step 5c)
        command: bin/prod-smoke mcritchie-studio
        blocks_merge: false
        mutates: false
        notes: >-
          Runs the @qa-readonly suite (e2e/qa_readonly.spec.js) against prod and
          records a 🟢/🔴 SEAL on the Release. A SEAL, not a gate — never aborts the
          ship; a red seal alerts + recommends rollback. Creates no content, sends
          no email, changes no provider state.

  turf-monster:
    display_name: Turf Monster
    qa_url: https://qa.turfmonster.media
    production_url: https://turfmonster.media
    suites:
      - name: Rails unit and controller
        key: turf_rails_test
        phase: ci
        tier: unit
        host: local
        blocks: blocking
        lane: pr_review_gate
        environment: local
        trigger: Every feature PR and before deploy
        command: bin/rails test
        blocks_merge: true
        mutates: false
        notes: Required for model/controller/job changes.
      - name: Local browser smoke
        key: turf_local_e2e
        phase: build
        tier: e2e
        host: local
        blocks: blocking
        lane: local_proof
        environment: local
        trigger: UI/auth/contest PRs
        command: PW_BASE_URL=http://127.0.0.1:<port> npx playwright test --project=chromium
        blocks_merge: true
        mutates: true
        notes: Uses worktree DB, local email capture, and local-safe seeded data.
      - name: QA read-only smoke
        key: turf_qa_readonly
        phase: qa
        tier: e2e
        host: qa
        blocks: advisory
        lane: qa_acceptance
        environment: qa
        trigger: After QA deploy
        command: QA_BASE_URL=https://qa.turfmonster.media npx playwright test --grep @qa-readonly
        blocks_merge: false
        mutates: false
        notes: Banner, signin, contests index, wallet chooser presence, and public page health.
      - name: QA devnet mutating smoke
        key: turf_qa_devnet_mutating
        phase: qa
        tier: e2e
        host: qa
        blocks: advisory
        lane: qa_acceptance
        environment: qa
        trigger: After Solana, wallet, contest, or entry changes reach QA
        command: QA_BASE_URL=https://qa.turfmonster.media npx playwright test --grep @qa-devnet-mutating
        blocks_merge: false
        mutates: true
        notes: Devnet-only contest create/enter checks. Never run against production.
      - name: Devnet on-chain smoke
        key: turf_devnet_deep
        phase: qa
        tier: e2e
        host: devnet
        blocks: advisory
        lane: nightly_deep
        environment: devnet
        trigger: Manually or nightly for Solana/contract integration changes
        command: npx playwright test --grep @devnet
        blocks_merge: false
        mutates: true
        notes: Uses real devnet resources and funded test wallets.
      - name: Production read-only smoke
        key: turf_prod_smoke
        phase: ship
        tier: smoke
        host: production
        blocks: advisory
        lane: production_smoke
        environment: production
        trigger: After approved production deploy
        command: bin/post_deploy_smoke --app turf-monster-mainnet
        blocks_merge: false
        mutates: false
        notes: Release, dynos, /up, key routes, payment flags, and core identities.
      - name: Production live email smoke
        key: turf_prod_email_smoke
        phase: ship
        tier: smoke
        host: production
        blocks: advisory
        lane: production_smoke
        environment: production
        trigger: Explicit operator approval only
        command: bin/post_deploy_smoke --app turf-monster-mainnet --email-smoke
        blocks_merge: false
        mutates: true
        notes: Sends a real magic link and checks worker delivery.

# The scopes `bin/release` RUNS (bin/release.rb run_test_scope). Keyed by stable
# scope key; the wrapper stamps this metadata into every START/COMPLETED/FAILED
# AgentAction it emits. `blocks: blocking` scopes abort! their pipeline exactly
# as before — the registry describes, it never overrides gate semantics.
#
# `host:` AND `tier:` ALSO DECIDE THE SCOPE'S LOCAL PRESENCE WEIGHT — what a peer
# reading `bin/agent-presence` is told this conductor is costing THIS machine while
# the scope runs (ReleasePresence.scope_weight, bin/lib/release_presence.rb). The
# rule: a scope is `light` only when its host is not `local` AND its tier is one
# that EXECUTES elsewhere — `smoke` (a curl poll) or `hook` (`heroku run`). Every
# other combination is `suite`, including anything unrecognised, because
# under-reporting cost is what lets a peer launch a suite into a saturated box.
#
# So a NEW SCOPE DECLARES ITS COST BY DECLARING `host`/`tier` — there is nothing
# extra to remember, and nothing at the call site to keep in sync.
#
# Note `host:` names the TARGET, not the payer. `prod_smoke_seal` is
# `host: production` and weighs `suite`, correctly: `bin/prod-smoke` runs
# `npx playwright test` on THIS box against a production URL.
release_scopes:
  pre_qa_gate:
    description: Per-app integration tier on origin/release before any QA deploy (release_repos.yml qa_test_cmd)
    phase: qa
    tier: integration
    host: local
    blocks: blocking
    mutates: false
  qa_up_smoke:
    # Presence: light — a curl poll. The QA dyno boots; this box holds a socket.
    description: Post-QA-deploy /up boot poll (wait_for_boot) — QA is not green until every app serves 200
    phase: qa
    tier: smoke
    host: qa
    blocks: blocking
    mutates: false
  qa_post_deploy:
    # Presence: light — `heroku run` executes on a remote one-off dyno, not here.
    description: Member-declared post_deploy_cmd on the QA app (heroku run --exit-code)
    phase: qa
    tier: hook
    host: qa
    blocks: blocking
    mutates: true
  ship_test_gate:
    description: Steffon ship gate — per-app registry test_cmd on the FROZEN ship SHA before ship authority (release_repos.yml test_cmd)
    phase: ship
    tier: full
    host: local
    blocks: blocking
    mutates: false
  gem_release_check:
    description: A gem's own release-check (--build = syntax + unit + build) before publish (release_repos.yml gems.<repo>.release_check)
    phase: ship
    tier: build
    host: local
    blocks: blocking
    mutates: false
  prod_up_smoke:
    # Presence: light — a curl poll, same as qa_up_smoke.
    description: Post-prod-deploy /up hard-gate (deploy_app, git_push_heroku adapter smoke_url)
    phase: ship
    tier: smoke
    host: production
    blocks: blocking
    mutates: false
  prod_post_deploy:
    # Presence: light — `heroku run`, remote. Twin of qa_post_deploy.
    description: Member-declared post_deploy_cmd on the production app (heroku run --exit-code)
    phase: ship
    tier: hook
    host: production
    blocks: blocking
    mutates: true
  prod_smoke_seal:
    # Presence: suite — `host: production` is the TARGET. bin/prod-smoke drives
    # `npx playwright test` LOCALLY, so this box pays in full. The tier keeps it
    # honest: `e2e` is not in ReleasePresence::REMOTE_TIERS.
    description: Post-ship @qa-readonly suite vs prod (bin/prod-smoke) — records a seal, never aborts
    phase: ship
    tier: e2e
    host: production
    blocks: seal
    mutates: false

# The LOCAL cert lanes bin/full-suite-check runs, in order. Each is a gradeable
# test_scope verdict on /alex/pipeline (event_slug = the key below). Blocking:
# a red lane fails the cert. host: local — the agent's own machine, no deploy.
full_suite_scopes:
  full_suite_db_reset:
    description: Reset the test DB before certifying (bin/rails db:test:purge db:test:prepare) — must be clean or the suite is not certified
    phase: build
    tier: build
    host: local
    blocks: blocking
    mutates: true
  full_suite_test:
    description: What CI runs, VERBATIM, on the exact code being shipped (the repo's own ci.yml command — today bin/rails db:test:prepare test test:system, base + SYSTEM tiers) — the full-suite half of the cert
    phase: build
    tier: full
    host: local
    blocks: blocking
    mutates: false
  full_suite_rubocop:
    description: FULL rubocop on the whole repo (bin/rubocop, no path args) — the lint half of the cert
    phase: build
    tier: build
    host: local
    blocks: blocking
    mutates: false

# The GitHub Actions jobs bin/ci-scope-capture INGESTS from a PR's `gh pr checks`.
# Each maps a ci.yml job to a stable test_scope key (event_slug = the key below),
# so a completed CI job becomes a gradeable /alex/pipeline unit like a local cert.
# host: ci — a GitHub Actions runner, not a local/qa/prod host. blocking: these
# are the PR's required checks (ci.yml runs them on every pull_request). The job
# name is normalized to ci_<name> at capture; a job with no key here still emits
# (its event_slug just lands without phase/tier/host chips).
ci_scopes:
  ci_rails:
    description: ci.yml `rails` job — one shard of the Rails suite (bin/ci-shard) on a GitHub runner; the 4-way matrix reports FOUR runs under this one scope
    phase: ci
    tier: full
    host: ci
    blocks: blocking
    mutates: false
  ci_rails_executed_set:
    description: ci.yml `rails_executed_set` job — bin/rails-executed-set-check, asserting the shards' receipts account for every committed test file
    phase: ci
    tier: full
    host: ci
    blocks: blocking
    mutates: false
  ci_system:
    description: ci.yml `system` job — bin/rails db:test:prepare test:system (Capybara + Chrome) on a GitHub runner
    phase: ci
    tier: e2e
    host: ci
    blocks: blocking
    mutates: false
  ci_static:
    description: ci.yml `static` job — brakeman + importmap audit + rubocop in one lane (merged from scan_ruby/scan_js/lint 2026-08-20 to free concurrency for shards 5 and 6)
    phase: ci
    tier: build
    host: ci
    blocks: blocking
    mutates: false
  # RETIRED SLUGS, KEPT ON PURPOSE. ci_lint/ci_scan_ruby/ci_scan_js name jobs that no
  # longer exist — they merged into `static` above. They stay because this registry is
  # read to describe AgentAction rows that were WRITTEN AT THE TIME, and every task on the
  # board from before 2026-08-20 carries them. Deleting an entry does not tidy the
  # registry; it blanks the heartbeat chips for the whole history that used it.
  ci_lint:
    description: "RETIRED 2026-08-20 (merged into `static`) — ci.yml `lint` job, bin/rubocop -f github"
    phase: ci
    tier: build
    host: ci
    blocks: blocking
    mutates: false
  ci_scan_ruby:
    description: "RETIRED 2026-08-20 (merged into `static`) — ci.yml `scan_ruby` job, bin/brakeman"
    phase: ci
    tier: build
    host: ci
    blocks: blocking
    mutates: false
  ci_scan_js:
    description: "RETIRED 2026-08-20 (merged into `static`) — ci.yml `scan_js` job, bin/importmap audit"
    phase: ci
    tier: build
    host: ci
    blocks: blocking
    mutates: false
