# The automatic first version of every /build app (.agents/epics/client-app-zero-to-one.md;
# runbook: docs/agents/system/client-build-launcher.md). Read by the board
# (ClientBuilds.config, app/services/client_builds.rb) and by the launcher on
# Alex McRitchie's Mac (bin/client-build-launcher, bin/lib/client_build_launcher.rb).
#
# preview_domain   where the shared host serves each bundle: <sub>.<preview_domain>.
#                  A separate registrable domain, so the hub's .mcritchie.studio
#                  session cookie never reaches model-written code. Alex McRitchie chose
#                  mcritchie.app on 2026-10-19; the name is config, so a move
#                  is one line here.
# cap              builds running at once on the Mac. The 5-agent cap is shared with
#                  the dispatcher and every session, so this stays small.
# max_attempts     claims one launch task may take. A failed run blocks the task; a
#                  human re-queues it (bin/task move <slug> designed), and past this
#                  many claims the launcher leaves it for a person.
# run_minutes      the builder's wall-clock cap (Alex McRitchie's ~45-minute build budget).
# max_turns        the builder's turn cap: assistant turns in the stream before the
#                  run is stopped.
# model            the builder's model. Execution runs on Opus (focus-session.md, Step 6).
# poll_seconds     how often the launcher asks the board for work when idle.
# bundle_max_bytes the local validation's size limit, before publish validates again.
# typical_build_minutes  the status card's Building ETA for a first version until a
#                  launcher run has ended preview_ready (AppDevopsStages::Eta,
#                  CLIENT BUILDS). The first two real runs took 5m38s and 5m58s
#                  (2026-10-20/21); 8 leaves headroom without promising the 45-minute cap.
preview_domain: mcritchie.app
cap: 2
max_attempts: 3
run_minutes: 45
max_turns: 120
model: opus
poll_seconds: 30
bundle_max_bytes: 5000000
typical_build_minutes: 8

# change_builder   the headless Pokémon builder the launcher runs in a change card's
#                  desk after it cut it (docs/agents/system/client-build-launcher.md,
#                  "The change builder"), ONLY for a card Alex McRitchie's own Slack
#                  or Teams go opened (ChangeBuilds.owner_go?); an app owner's web
#                  card never gets one. It holds a slot of `cap` above. Read by the
#                  board (which offers a card) and by the launcher (which runs it);
#                  `enabled: false` in either place runs no builder, and a missing
#                  section is off.
#   enabled        the switch
#   run_minutes    the builder's wall-clock cap; the run's process group gets TERM,
#                  then KILL. A cold bin/submit-wait alone is about 12 minutes.
#   max_turns      assistant turns before the run is stopped
#   max_attempts   builder runs per card; a failed run is retried after 10 minutes
#                  until this many, then left for a session (the floor alert says so)
#   model          the builder's model
change_builder:
  enabled: true
  run_minutes: 90
  max_turns: 400
  max_attempts: 2
  model: opus
