# Release repo registry — the producer/consumer classification for the Deploy
# workflow (Workflow 2). Single source of truth read by `Release::Repos`.
#
# The Deploy workflow ships a release PRODUCER-FIRST: a gem (a *producer*) is
# published to RubyGems BEFORE the apps (its *consumers*) that depend on it
# deploy, so a consuming app always builds against the just-published version.
# `bin/release ship` ("Run Deployment") publishes every gem member first
# (approval-gated `gem push`), then runs the app deploys.
#
# Read by:
#   * Release::Repos (app/models/release/repos.rb) — kind/gem?/app?/gem_meta
#   * Release::Conductor.member_plan — tags each release member gem vs app
#   * bin/release — skips the branch-merge for gem members; publishes them first
#   * Task#release_repo / #gem_release? — board 💎 gem badge + ordering
#
# Two member kinds:
#   gems — published to RubyGems. They have NO app branch in mcritchie-studio;
#          their PR/branch lives in the gem's own repo. They ride the release as
#          a record, are published at ship, and are QA'd via a consuming app.
#   apps — deployed. A HASH keyed by repo slug; each app carries a `prod_deploy`
#          adapter describing HOW it ships to production (the multi-repo conductor
#          reads this so one release can drive heterogeneous deploys). They have a
#          branch merged onto the release branch.
#
# prod_deploy adapters (the `strategy` selects the deploy mechanic):
#   git_push_heroku — push the release/main branch to a Heroku git remote.
#       remote    — the git remote name or Heroku git URL to push to (e.g. heroku).
#       branch    — the branch the remote deploys (e.g. main).
#       smoke_url — the production URL to smoke-test after the push.
#   repo_script — shell out to a deploy script that lives IN the app repo (the
#                 repo owns its own deploy logic; the conductor just invokes it).
#       command — the repo-relative deploy script (e.g. bin/deploy).
#       args    — argv passed to the script (e.g. ["--yes"] to skip prompts).
#     CONTRACT (read before registering a new one). The script runs with cwd = the
#     repo's SHIP WORKSPACE (<repo>/.worktrees/_ship): a private worktree with a
#     DETACHED HEAD at the QA-frozen SHA, a clean tree, and the repo's shared git
#     config/remotes. So:
#       * `git rev-parse --abbrev-ref HEAD` is the literal "HEAD", not "main" — a
#         script that pushes must use a refspec that works detached (turf's
#         `PUSH_SPEC="$BRANCH:main"` becomes `HEAD:main`, which pushes the frozen
#         commit — exactly right).
#       * GITIGNORED artifacts are NOT there on a fresh workspace (no node_modules,
#         no app/assets/builds, no .env beyond the one the conductor mirrors in).
#         Verify the script's own test/build steps survive that.
#       * The ONLY env the conductor adds is DATABASE_URL, pointing at the
#         workspace's private test DB (<app>_ship_test) so the script's pre-prod
#         suite can't collide with a concurrent one. It is NOT test-scoped (a Rails
#         builtin): a deploy script must not run a development-env rails command and
#         expect its dev database. RAILS_ENV is deliberately NOT set — precompiling
#         assets under RAILS_ENV=test would build the wrong artifact and ship it.
#
# Optional per-app `qa_deploy: { app: <qa-server-key> }` overrides the qa-server
# target; absent, `Release::Repos.qa_app` defaults the key to the repo slug.
#
# Optional per-app `test_cmd` is the conductor's pre-prod gate (G4 Ship):
# `bin/release ship` runs it (cwd = the repo's ISOLATED GATE WORKSPACE, at its
# QA-frozen SHA) right before the irreversible prod deploy and scoped-aborts on
# red. DOUBLE-TEST CAVEAT: only set it where the repo's own deploy does NOT
# already run the suite. The hub deploys via git_push_heroku (no test step), so
# it carries `test_cmd: bin/rails test`. The `repo_script` satellites SELF-GATE —
# their bin/deploy runs their own tests — so they leave `test_cmd` UNSET to avoid
# running the whole suite twice per ship. G4 ALSO self-gates against G3, but ONLY
# against the verdict G3 RECORDED (metadata["qa_gates"][repo] = {sha, cmd, ok},
# written only on a green pre-QA suite): same command + same frozen SHA + green
# => the ship gate records a skip SOP instead of re-running. No record, a red
# record, a different command, or a drifted SHA all FAIL OPEN and run the gate
# (bin/release test_gate / Release::ShipSequence.ship_gate_skip?).
#
# DO NOT blank `qa_test_cmd` to bypass a red G3. That was a documented recipe and
# it is now a closed foot-gun: it used to make G4 skip a suite NOTHING had run
# (the old skip rule compared registry strings against the DEPLOYED sha), which
# silently disarmed the last gate before production.
#
# Optional per-app `qa_test_cmd` is Steffon's PRE-QA gate (G3 Candidate):
# `bin/release prepare` runs it BEFORE any QA deploy — the tier prepare owns
# (Release::STEP_TEST_TIERS). A red gate aborts prepare with eject guidance while
# every swept member is still `reviewed` (nothing flipped, nothing deployed).
# UNSET = the repo self-gates at ship/its own deploy and the gate skips it.
#
# WHERE it runs: the repo's ISOLATED GATE WORKSPACE (Release::GateWorkspace) — a
# private detached worktree pinned at the origin/release SHA, under a dedicated
# gate lock, with a test DB the gate PROVES is private before it runs (it boots
# the app and reads back the resolved connection, and REFUSES a shared DB) — NOT
# the shared primary checkout, which stays on a clean `main`. A suite that lazily
# autoloads over minutes cannot be trusted against a tree a concurrent session can
# `git checkout` out from under it; that is what made the gate false-fail on green
# code. See docs/agents/modules/gates/g3-candidate.md.
#
# ANY COMMAND SHAPE IS SAFE HERE. The gate PREPARES the test env in its workspace
# (`bin/rails db:test:prepare test:prepare`, one boot) before running your command,
# so a PATH-ARG lane works. It must: Rails runs `test:prepare` — the hook that BUILDS
# gitignored assets like app/assets/builds/tailwind.css — only when NO argument looks
# like a path, and the workspace is a `--detach` worktree, which does NOT copy
# gitignored files. Before the gate prepared the env, the satellites' path-arg lanes
# rendered views with NO stylesheet and the gate went RED on GREEN code (2026-07-12).
# Do not "fix" that class of failure by reshaping a command here — the gate owns it.
#
# WHAT to register as qa_test_cmd — the question is NOT "hub or satellite", it is
# "does this repo's DEPLOY run the suite?":
#   * a repo whose OWN DEPLOY runs the full suite (turf-monster: bin/deploy) — the
#     integration SUBSET (`bin/rails test test/integration`): review owns the base
#     tier, and their ship test_cmd / own deploy owns the full pre-prod run
#     (registering the same full suite twice would re-run it every ship, since
#     their SHAs routinely drift via re-pins).
#   * a repo deployed by git_push_heroku (the HUB and ROLIO) — NO test step runs at
#     deploy, so the registered command IS the last gate before prod and must be
#     CI's FULL suite, VERBATIM (`bin/rails db:test:prepare test test:system`), at
#     BOTH gates. The 90/10 policy certifies the whole release batch ONCE at G3, and
#     ship's test_gate self-gates when the frozen SHA matches that certified run, so
#     the suite still runs once per batch; a drifted/straggler SHA re-triggers it at
#     ship. Registering the SUBSET for one of these leaves prod ungated for every
#     tier the subset skips — exactly how rolio's system tier went uncovered.
#
# THESE GATES INCLUDE THE SYSTEM TIER, and the exact SHAPE is load-bearing.
# `bin/rails test` alone SKIPS test/system — so a system-test regression used to
# ride the release branch straight into QA ungated, which is the hole this closes.
# The gate must run what CI runs, so each registers ITS OWN ci.yml command verbatim
# (repos_test.rb parses both ci.yml files and asserts the match):
#
#   * DO NOT "simplify" it to `bin/rails test test:system`. That shape is BROKEN:
#     `test` is a real rails COMMAND, so `test:system` is parsed as a PATH and the
#     run dies with `LoadError: cannot load such file -- <root>/test:system`. It
#     works in ci.yml only because the FIRST arg (`db:test:prepare`) is NOT a rails
#     command, which routes the whole line through RAKE — where `test` and
#     `test:system` are two separate rake tasks. Keep db:test:prepare first.
#   * The leading `db:test:prepare` is therefore what selects the rake path. It is
#     also harmless to re-run: the gate already ran it in prepare_gate_workspace!,
#     against a test DB it PROVED private first, so the re-purge (~2s) hits only
#     the gate's own DB.
#   * Assets need NO setup step in the gate's virgin worktree — but the reason is
#     PER-APP, so do not carry one app's mechanism over to the other:
#       - the HUB self-heals: `rails test`/`rails test:system` each call
#         run_prepare_task -> rake `test:prepare`, which tailwindcss-rails enhances
#         with `tailwindcss:build`, so the gitignored app/assets/builds/tailwind.css
#         is BUILT on demand (a bare `db:test:prepare` does NOT build it — the gem
#         hooks test:prepare, not db:).
#       - ROLIO needs no build at all: it is sprockets + importmap and leaves
#         `config.assets.compile` at its default TRUE in test (it is set false only
#         in production.rb), so `stylesheet_link_tag "application"` COMPILES AT
#         REQUEST TIME from the tracked sources in app/assets/stylesheets/. There is
#         no tailwindcss-rails hook here to rely on, and none is needed.
#   * The BROWSER is driven headless by Selenium Manager, which fetches a chromedriver
#     matched to the installed Chrome (same reason ci.yml installs NO chromedriver).
#     A host with no Chrome fails at driver resolution — an ENV error, not a release
#     regression; assert_system_test_browser! turns that into an up-front ENV abort
#     so nobody ejects a task for it.
#
# NOT to be confused with the PLAYWRIGHT e2e tier, which still does NOT belong
# here: Rails system tests boot their OWN Puma in-process (Capybara), so they run
# fine in the gate workspace, whereas a Playwright run needs an already-booted
# SERVER. The e2e-smoke half of prepare's tier remains prepare's own built-in
# post-deploy `/up` boot wait against QA — the QA deploy IS that smoke.
#
# PARSING: both test_cmd and qa_test_cmd are Shellwords-parsed into an argv
# (bin/release's test_cmd_argv — no shell interpolation), so quoted/spaced args
# survive as single elements: `bin/rails test "test/integration/a b_test.rb"`.
# Plain flag-style commands split exactly as before. An unbalanced quote aborts
# the run naming the offending string instead of executing a garbled command.
#
# gem fields:
#   version_file — path (inside the gem repo) declaring the version to publish.
#                  Read for the producer-first publish + the board indicator.
#                    studio-engine → lib/studio/version.rb  (VERSION = "x.y.z")
#                    solana-studio → solana-studio.gemspec   (spec.version = "x.y.z")
#   gemspec      — the .gemspec `gem build` packages (defaults to <repo>.gemspec).
#   release_check — optional repo-relative pre-publish gate run with `--build`
#                   (syntax + unit + build) before the artifact is pushed.
#   build_cmd    — human-readable build command (documentation; bin/release
#                  drives release_check/gem build directly).
#
# The gem repos are checked out as SIBLINGS of this app (the projects root):
#   /Users/alex/projects/<repo>. `bin/release` resolves them relative to the
#   app root's parent, so run ship from a PRIMARY checkout, not a worktree.

gems:
  studio-engine:
    version_file: lib/studio/version.rb
    gemspec: studio-engine.gemspec
    release_check: bin/release-check
    build_cmd: bin/release-check --build
  solana-studio:
    version_file: solana-studio.gemspec
    gemspec: solana-studio.gemspec
    build_cmd: gem build solana-studio.gemspec

apps:
  mcritchie-studio:
    # Hub: git_push_heroku has no test step, so gate prod on the suite here.
    # (Ship's gate SELF-GATES when the frozen SHA is exactly what the G3 pre-QA
    # gate below already certified this run — full suite runs once per batch.
    # test_cmd and qa_test_cmd must stay the SAME STRING or that skip misses and
    # the suite runs twice: ship_gate_skip? compares the commands verbatim.)
    test_cmd: bin/rails db:test:prepare test test:system
    # Pre-QA gate (G3): the hub certifies CI's FULL suite — the base tier AND the
    # SYSTEM tier — on the release batch. This string is ci.yml's `test` job
    # command VERBATIM, and repos_test.rb parses ci.yml and asserts they match,
    # so the gate cannot silently drift out from under CI again.
    qa_test_cmd: bin/rails db:test:prepare test test:system
    prod_deploy:
      strategy: git_push_heroku
      remote: heroku
      branch: main
      smoke_url: https://mcritchie.studio
  turf-monster:
    # Self-gates at SHIP (bin/deploy runs the full suite pre-prod) — but nothing
    # gated the QA deploy, so the prepare-owned integration tier runs here.
    qa_test_cmd: bin/rails test test/integration
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
  rolio:
    # Release-managed standalone app: Rails/SQLite demo runtime, no Studio Engine.
    #
    # ROLIO GATES LIKE THE HUB, NOT LIKE TURF-MONSTER — read this before narrowing
    # it back to the "satellite" integration subset. The subset is only safe for a
    # repo whose DEPLOY runs the suite (turf-monster's bin/deploy does). Rolio
    # deploys via git_push_heroku, which has NO test step — so test_cmd below is
    # LITERALLY THE LAST GATE before rolio production. It therefore registers CI's
    # FULL suite, verbatim, at BOTH gates, exactly as the hub does.
    #
    # It once did not, and that was a live hole: rolio HAS system tests
    # (test/system/) and its ci.yml runs them, but these commands were `bin/rails
    # test` (G4) and `bin/rails test test/integration` (G3) — BOTH of which SKIP
    # test/system. A system-test regression could reach rolio prod completely
    # ungated. repos_test.rb now parses rolio's OWN .github/workflows/ci.yml (at
    # origin/release, not the working tree) and asserts this command matches it, so
    # the two cannot drift apart again.
    #
    # ⚠ PREREQUISITE — this gate is only safe once rolio carries a system-suite
    # WAIT BUDGET sized for THIS host (rolio task `size-rolio-system-wait-budget`,
    # amcritchie/rolio#23). Rolio's suite ran on Capybara's 2s default, which is
    # calibrated for an IDLE CI runner; the gate host is a SHARED dev Mac where the
    # browser stack was measured ~18x slower under concurrent-agent load (4.6s idle
    # -> 85s loaded). At 2s the FIRST drive of this gate came back RED ON GREEN CODE
    # (CI green on the same SHA), which pre_qa_gate reports as "a regression is
    # riding origin/release — eject it, revert its merge commit". The budget fix is
    # a SEQUENCED prerequisite: the sweep lands rolio#23 into rolio's release
    # FIRST, so this widened gate never drives a 2s-budget suite.
    #
    # DRIVEN, not assumed (the gate was run in rolio's isolated workspace before
    # this was widened — a gate that has never been driven is how you start
    # false-failing green code and ejecting good PRs):
    #   * SQLite passes the private-DB invariant. database_url_for returns nil for
    #     it (no postgres overlay — that would be a live trap); the test DB is
    #     `storage/test.sqlite3`, a FILE INSIDE the gate worktree, which
    #     GateWorkspace.private_db? qualifies via its file_backed? branch.
    #   * No asset build step is needed, and the MECHANISM is not the hub's: rolio
    #     is sprockets + importmap and leaves `config.assets.compile` at its default
    #     TRUE in test (it is set false only in production.rb), so
    #     `stylesheet_link_tag "application"` COMPILES AT REQUEST TIME from the
    #     tracked sources in app/assets/stylesheets/. Nothing is precompiled into
    #     public/assets (only landing.css + store.js are tracked there — there is NO
    #     public/assets/app.css, the .gitignore merely un-ignores that NAME), and
    #     there is no tailwindcss-rails `test:prepare` hook here to depend on.
    #   * Chrome: test/application_system_test_case.rb is `driven_by :selenium,
    #     using: :headless_chrome`, so assert_system_test_browser! binds this
    #     command too — a browserless host aborts as an ENV error, NOT as a red
    #     suite handing out eject/revert guidance.
    #
    # Keep db:test:prepare FIRST (the rake-path trap — see the hub's entry), and
    # keep test_cmd and qa_test_cmd the SAME STRING or ship_gate_skip? can never
    # credit G3's certified run and the suite runs twice every ship.
    test_cmd: bin/rails db:test:prepare test test:system
    qa_test_cmd: bin/rails db:test:prepare test test:system
    prod_deploy:
      strategy: git_push_heroku
      remote: https://git.heroku.com/rolio-prod.git
      branch: main
      smoke_url: https://rolio-prod-82e96784b462.herokuapp.com
  tax-studio:
    # Planned app, no sibling checkout yet — qa_test_cmd stays UNSET (the gate
    # aborts prepare if a registered command's repo is missing). Register the
    # integration tier when the repo lands.
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
  chain-ops:
    # Planned app; test/integration is still empty — qa_test_cmd stays UNSET
    # until it has a real integration tier to run.
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
