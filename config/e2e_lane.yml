# Of those, the ones already RED on an untouched `release` checkout the day this lane was
# switched on — tagged ` @quarantine` in their title and excluded by the CI command. A hole
# with a name and a ticket: /tasks/repair-rotted-e2e-specs.
#
# THIS NUMBER MAY ONLY FALL, AND THAT IS ENFORCED — not merely requested here.
# test/lib/e2e_quarantine_ratchet_test.rb compares this value against its value on
# `origin/release` and goes RED if it is higher. That comparison is the whole point: it reads
# a copy of the number that YOUR edit cannot reach. The first version of the guard compared
# this line to... this line, and review proved what that is worth by tagging a 19th spec,
# bumping this number to 19, and watching every guard in the repo AND the runtime receipt go
# green over a suite that had just lost a spec. A ratchet whose reference value moves with the
# thing it restrains is a PIN.
#
# Repair a spec: drop its tag, lower `quarantined`, raise `executed`, same commit — the guard
# will tell you both numbers. Tagging one MORE spec to green a PR is the exact self-declaration
# disease this whole lane exists to cure, and it is now a red build rather than a red face.
