  # is the site's users and request logs. dashboard, applications and agents are in
  # no sidebar section (Alex McRitchie, 2026-11-04); the admin dashboard links the last
  # two, and tasks too. They stay here because the wall and the route check read this.
  dashboard:      { page: "dashboard#index",      audience: admin, label: Studio dashboard, emoji: "📊", hover_emoji: "📈", desc: Overview + activity, parent: admin_dashboard }
  # Owners reach /applications too (AdminWall::SIGNED_IN); their own sidebar link
  # is AppOwnership.sidebar_links, so this entry shows to an admin only.
  applications:   { page: "applications#index",   audience: signed_in, label: Applications, emoji: "📱", hover_emoji: "🚀", desc: Live apps + pending launch, parent: admin_dashboard }
  agents:         { page: "agents#index",         audience: admin, label: Agents, emoji: "🦞", hover_emoji: "🤝", desc: "Agents and pending setups (Discord bots and the like)", parent: admin_dashboard }
  builders:       { page: "builders#index",       audience: admin, label: Builders, emoji: "🏗️", hover_emoji: "🚀", desc: Builder roster + commit pace, parent: admin_basement }
  tasks:          { page: "tasks#index",          audience: admin, label: Tasks, emoji: "✅", hover_emoji: "🚦", desc: Task board, parent: deployments }
  news_index:     { page: "news#index",           audience: admin, label: News, emoji: "📰", hover_emoji: "🔎", desc: News pipeline, parent: admin_basement }
  contents:       { page: "contents#index",       audience: admin, label: Content, emoji: "🎬", hover_emoji: "✨", desc: Content pipeline, parent: admin_basement }
  model_pipeline: { page: "model_pipeline#index", audience: admin, label: Models, emoji: "🪪", hover_emoji: "🎭", desc: Character model pipeline, parent: admin_basement }
  body_archetypes: { page: "body_archetypes#index", audience: admin, label: Body archetypes, emoji: "🏈", hover_emoji: "💪", desc: Body builds a player sheet is drawn to, parent: admin_basement }
  videos:          { page: "videos#index",          audience: admin, label: Videos, emoji: "🎞️", hover_emoji: "🎬", desc: "Every digested video: cast, A/B/C frames, alt videos", parent: admin_basement }

  # ── Directory ────────────────────────────────────────────────────────────
  teams:  { page: "teams#index",  audience: admin, label: Teams, emoji: "🛡️", hover_emoji: "📋", desc: All teams, parent: admin_basement }
  people: { page: "people#index", audience: admin, label: People, emoji: "👤", hover_emoji: "🪪", desc: Players + staff, parent: admin_basement }
  docs:   { page: "docs#index",   audience: admin, label: Docs, emoji: "📚", hover_emoji: "🔎", desc: Documentation, parent: admin_basement }

  # ── Site administration ──────────────────────────────────────────────────
  admin_dashboard:    { page: "admin/dashboard#show",         audience: admin, label: Admin dashboard, emoji: "📊", hover_emoji: "🔬", desc: Users + request logs, icon: chart-column, crumb: Admin }
